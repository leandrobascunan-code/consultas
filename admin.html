<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel Timón – Administración</title>
<meta name="theme-color" content="#0E2A68">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=1.10">
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  body{overflow-y:auto}
  .panel{max-width:980px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .zona{padding:18px 16px 40px;flex:1}
  .tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:18px;padding:18px;box-shadow:var(--sombra);margin-bottom:16px}
  .tarjeta h2{margin:0 0 6px;font-size:1.15rem;display:flex;gap:10px;align-items:center;color:var(--marino)}
  :root[data-theme="dark"] .tarjeta h2{color:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tarjeta h2{color:#fff}}
  .tarjeta > p.ayuda{margin:0 0 14px;color:var(--texto-suave);font-size:.9rem}
  .campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .campo label{font-weight:800;font-size:.88rem}
  .campo input,.campo textarea,.campo select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--borde);background:var(--superficie-2);color:var(--texto);width:100%}
  .campo textarea{min-height:90px;resize:vertical}
  .campo input:focus,.campo textarea:focus,.campo select:focus{outline:0;border-color:var(--azul)}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .fila-doc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--borde);border-radius:14px;margin-bottom:8px;background:var(--superficie-2)}
  .fila-doc .t{flex:1;min-width:180px}
  .fila-doc .t b{display:block}
  .fila-doc .t small{color:var(--texto-suave)}
  .cargo{border:1px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--superficie-2)}
  .cargo .rejilla{grid-template-columns:1fr 1fr auto;align-items:end}
  .mensaje{padding:10px 14px;border-radius:12px;margin:10px 0;font-weight:700}
  .mensaje.ok{background:rgba(30,142,90,.12);color:var(--exito)}
  .mensaje.mal{background:rgba(192,57,43,.12);color:var(--peligro)}
  .mensaje.info{background:rgba(30,79,163,.1);color:var(--azul)}
  .login{max-width:420px;margin:40px auto;text-align:center}
  .login img{width:110px}
  .acciones-fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .estado-oculto{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#fde2e2;color:#a12a2a}
  .estado-visible{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#dff5e9;color:#1e6e46}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:6px 0 14px}
  .kpi{background:linear-gradient(135deg,#0E2A68,#1E4FA3);color:#fff;border-radius:14px;padding:14px;border-bottom:4px solid var(--amarillo)}
  .kpi b{display:block;font-size:1.25rem;line-height:1.2}
  .kpi span{font-size:.8rem;opacity:.85}
  .graf-caja{background:var(--superficie-2);border:1px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:12px}
  .graf-caja h3{margin:0 0 8px;font-size:.95rem}
  .tabla-stats{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:.92rem}
  .tabla-stats th{background:var(--marino);color:#fff;text-align:left;padding:8px}
  .tabla-stats td{padding:7px 8px;border-top:1px solid var(--borde)}
  .estado-medio{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#fff3c4;color:#7a5c00}
  .contador{font-size:.88rem;color:var(--texto-suave);background:var(--superficie-2);border:1px solid var(--borde);border-radius:99px;padding:6px 12px}
  .plan-caja{margin-top:14px;padding:14px 16px;border-radius:14px;border:2px solid var(--amarillo);background:var(--superficie-2)}
  @media (max-width:640px){.rejilla,.cargo .rejilla{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel">
  <header class="barra">
    <img src="logo.png" alt="Insignia" class="barra-logo">
    <div class="barra-titulo"><strong>Panel de administración</strong><span>Timón · Colegio Marina de Chile</span></div>
    <nav class="barra-acciones" style="margin-left:auto">
      <a class="icono-btn" href="index.html" title="Volver al chat" aria-label="Volver al chat" id="aChat"></a>
      <button class="icono-btn" id="btnSalir" title="Cerrar sesión" aria-label="Cerrar sesión" hidden></button>
    </nav>
  </header>
  <div class="zona" id="zona"></div>
  <p class="firma-clara"><img src="firma-autor.png?v=1.10" alt="Creado por Leandro Bascuñán Valdebenito"><span>© 2026 · Panel v1.10</span></p>
</div>
<div id="aviso" class="toast" hidden></div>
<script src="config.js?v=1.10"></script>
<script src="datos.js?v=1.10"></script>
<script src="conocimiento.js?v=1.10"></script>
<script src="admin.js?v=1.10"></script>
</body>
</html>
