                                    <select className="w-full border-2 border-slate-200 p-2 rounded-lg text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 bg-white" value={formRevision.leccionario} onChange={e=>setFormRevision({...formRevision, leccionario: e.target.value})}>
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Al día / Presente">✅ Al día / Presente</option>
                                        <option value="Incompleto">⚠️ Incompleto</option>
                                        <option value="No está / Ausente">❌ No está / Ausente</option>
                                    </select>
                                </div>
                                
                                <div className="md:col-span-2">
                                    <label className="text-xs font-bold block mb-1">Cuadro Resumen Mensual</label>
                                    <select className="w-full border-2 border-slate-200 p-2 rounded-lg text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 bg-white" value={formRevision.cuadroResumen} onChange={e=>setFormRevision({...formRevision, cuadroResumen: e.target.value})}>
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Al día / Presente">✅ Al día / Presente</option>
                                        <option value="Incompleto">⚠️ Incompleto</option>
                                        <option value="No está / Ausente">❌ No está / Ausente</option>
                                    </select>
                                </div>
                                
                                <div className="md:col-span-2"><label className="text-xs font-bold block mb-1">Registro de Notas (Detallar notas, fechas e instrumentos)</label><textarea placeholder="Ej: Notas ingresadas. Instrumento: Prueba 1 (12/04). Faltan notas rezagados..." className="w-full border-2 border-slate-200 p-2 rounded-lg h-20 outline-none focus:border-indigo-500" value={formRevision.registroNotas} onChange={e=>setFormRevision({...formRevision, registroNotas: e.target.value})}/></div>
                                <div className="md:col-span-2"><label className="text-xs font-bold block mb-1">Comentarios / Observaciones para el Docente</label><textarea placeholder="Aspectos a mejorar o destacar..." className="w-full border-2 border-slate-200 p-2 rounded-lg h-16 outline-none focus:border-indigo-500" value={formRevision.comentarios} onChange={e=>setFormRevision({...formRevision, comentarios: e.target.value})}/></div>
                            </div>
                            <div className="flex justify-end"><button type="submit" className={`${editandoFichaId ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white px-6 py-2 rounded font-bold transition-colors`}>{editandoFichaId ? 'Guardar Cambios' : 'Guardar Revisión'}</button></div>
                        </form>
                    )}
                    <div className="space-y-4">
                        {revisiones.length === 0 ? <p className="text-center italic text-slate-400 p-6 border-2 border-dashed rounded-xl">No hay revisiones de libro registradas.</p> : revisiones.map(r => (
                            <div key={r.id} className="border-l-4 border-indigo-500 bg-white p-5 rounded shadow-sm relative group transition-all hover:shadow-md">
                                {!readOnly && (
                                    <div className="absolute top-4 right-4 flex gap-2 no-print-pdf">
                                    <button onClick={(e)=>handleEdit(e, r)} className="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 p-1.5 rounded transition-colors" title="Editar"><LucideIcon iconName="Edit3" size={18}/></button>
                                    <div className="bg-red-50 hover:bg-red-100 rounded p-0.5 transition-colors">
                                        <DeleteButton onClick={(e) => { 
                                            if(e) e.stopPropagation(); 
                                            setDbData(prev => ({...prev, fichasDocentes: prev.fichasDocentes.filter(f => f.id !== r.id)})); 
                                            if (setNotification) setNotification({message: 'Registro eliminado exitosamente.', type: 'success'}); 
                                            if(editandoFichaId === r.id) setEditandoFichaId(null); 
                                        }} />
                                    </div>
                                </div>
                                )}
                                <div className="flex justify-between items-center border-b pb-2 mb-3 pr-16">
                                    <div>
                                        <h5 className="font-bold text-slate-800">Revisión de Libro • {formatFechaManual(r.fecha)}</h5>
                                        <div className="text-xs font-bold text-indigo-600 mt-1 uppercase tracking-wide">📖 LIBRO: {r.libro || 'General'}</div>
                                    </div>
                                    <span className="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded">Revisado por: {r.evaluador}</span>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mb-4">
                                    <div className="bg-slate-50 p-3 rounded-lg border flex flex-col items-start justify-center gap-1"><strong className="block text-[10px] uppercase text-slate-400">Lista de Asistencia</strong>{renderBadge(r.lista)}</div>
                                    <div className="bg-slate-50 p-3 rounded-lg border flex flex-col items-start justify-center gap-1"><strong className="block text-[10px] uppercase text-slate-400">Leccionario</strong>{renderBadge(r.leccionario)}</div>
                                    <div className="bg-slate-50 p-3 rounded-lg border flex flex-col items-start justify-center gap-1"><strong className="block text-[10px] uppercase text-slate-400">Cuadro Resumen</strong>{renderBadge(r.cuadroResumen)}</div>
                                    <div className="bg-slate-50 p-3 rounded-lg border md:col-span-4"><strong className="block text-[10px] uppercase text-slate-400 mb-1">Registro de Notas (Detalle)</strong><span className="whitespace-pre-wrap text-slate-700">{r.registroNotas || '-'}</span></div>
                                </div>
                                {r.comentarios && <div><strong className="block text-[10px] uppercase text-slate-400 mb-1">Comentarios y Mejoras:</strong><p className="text-sm italic text-slate-700 bg-yellow-50 p-3 rounded border border-yellow-200">{r.comentarios}</p></div>}

                                <div className="mt-4 pt-3 border-t border-slate-200 flex justify-end no-print-pdf">
                                    {r.tomadoConocimiento ? (
                                        <span className="text-xs font-bold text-green-700 bg-green-50 px-3 py-1.5 rounded-full border border-green-200 flex items-center gap-1">
                                            <LucideIcon iconName="CheckDouble" size={16}/> Docente tomó conocimiento: {r.fechaConocimiento}
                                        </span>
                                    ) : (
                                        <span className="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-full border border-orange-200 flex items-center gap-1">
                                            <LucideIcon iconName="Clock" size={16}/> Pendiente de toma de conocimiento
                                        </span>
                                    )}
                                </div>
                                <div className="hidden print:block mt-4 pt-2 border-t border-slate-300 text-right text-xs">
                                     <strong>Estado Notificación:</strong> {r.tomadoConocimiento ? `Tomó conocimiento (${r.fechaConocimiento})` : 'Pendiente de revisión por el docente'}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {tab === 'acompanamientos' && (
                <div className="bg-teal-50 p-8 rounded-2xl border-2 border-teal-200 shadow-inner text-center animate-fade-in flex flex-col items-center justify-center min-h-[350px] no-print-pdf">
                    <div className="bg-white p-5 rounded-full shadow-md mb-6 border border-teal-100 transform transition-transform hover:scale-110">
                        <LucideIcon iconName="Presentation" size={56} className="text-teal-600" />
                    </div>
                    <h3 className="text-2xl md:text-3xl font-black text-teal-900 mb-3">Plataforma de Acompañamiento al Aula</h3>
                    <p className="text-slate-600 mb-8 max-w-lg text-sm leading-relaxed mx-auto">
                        Todo el registro, rúbricas de evaluación y retroalimentación de los acompañamientos al aula se centraliza en la plataforma oficial del establecimiento.
                    </p>
                    <a 
                        href="https://sites.google.com/andaliensur.cl/acompaamiento-al-aula/p%C3%A1gina-principal?authuser=1" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="bg-teal-600 text-white px-8 py-4 rounded-xl font-black shadow-lg hover:bg-teal-700 hover:shadow-teal-500/50 transform hover:-translate-y-1 transition-all flex items-center gap-3 text-lg no-print-pdf mx-auto w-fit"
                    >
                        <LucideIcon iconName="ExternalLink" size={24}/>
                        IR A PLATAFORMA OFICIAL
                    </a>
                </div>
            )}

            <div className="hidden print:block mt-16 pt-8 border-t border-slate-300">
                <FooterFirma docenteName={targetUser.name} isApproved={true} approverName={currentUser.name} showDocente={true} />
            </div>
        </div>
    );
};
// --- TERMINA AQUÍ EL NUEVO MÓDULO ---

    const EstadisticasDocenteModule = ({ context, dbData, currentUser }) => {
        const misEvals = (dbData.evaluaciones || []).filter(e => e.asignaturaId === context.asignaturaId && e.nivel === context.nivel && e.letra === context.letra && e.docente === currentUser.name);
        const totalCursoEvals = (dbData.evaluaciones || []).filter(e => e.nivel === context.nivel && e.letra === context.letra);
        const counts = {}; misEvals.forEach(e => { counts[e.instrumento] = (counts[e.instrumento] || 0) + 1; });
        const graphData = Object.keys(counts).map(k => ({ label: k, value: counts[k], color: "#f97316" }));
        const comparisonData = [ { label: "Mis Evaluaciones", value: misEvals.length, color: "#f97316" }, { label: "Total Curso", value: totalCursoEvals.length, color: "#3b82f6" } ];
        return (
            <div className="space-y-6">
               <div className="bg-white p-6 rounded-xl border shadow-sm">
                   <h3 className="font-bold text-teal-800 mb-4">Estadísticas: {context.nivel} {context.letra}</h3>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                       <div><StatsGraph data={graphData} title="Frecuencia de Mis Instrumentos" /><p className="text-xs text-gray-500 mt-2 text-center">Tipos de evaluaciones que yo aplico en esta asignatura.</p></div>
                       <div><StatsGraph data={comparisonData} title="Carga Evaluativa del Curso" /><div className="text-sm space-y-2 mt-4 bg-slate-50 p-3 rounded border border-slate-200"><p><strong>Mis Evaluaciones:</strong> {misEvals.length}</p><p><strong>Total Evaluaciones Curso:</strong> {totalCursoEvals.length}</p><p className="text-xs text-gray-500 italic mt-1">* Comparativa para evitar sobrecarga.</p></div></div>
                   </div>
               </div>
           </div>
        );
    };

        // ==========================================
    // PANEL DE ESTADO DE MONITOREO DEL DOCENTE
    // Se muestra dentro del escritorio, bajo las tarjetas de cursos.
    // Indica, curso por curso, qué está registrado, qué fue revisado por UTP
    // y qué falta por subir.
    // ==========================================
        // ==========================================
    // PANEL DE ESTADO DE MONITOREO DEL DOCENTE (PASO 1 del escritorio)
    // Muestra primero QUÉ FALTA y permite ir directo al instrumento.
    // Resalta el curso y la unidad que el docente está editando en ese momento.
    // ==========================================
    const ResumenMonitoreoDocente = ({ dbData, asignacionesAgrupadas, year, onVerDetalle, onIrAInstrumento, cursoActivoId = '', itemActivo = null }) => {
        const [abierto, setAbierto] = useState(true);
        const [soloPendientes, setSoloPendientes] = useState(false);

        const nombreAsig = (id) => (dbData.asignaturas || []).find(x => x.id === id)?.nombre || id;

        const tieneContenidoCrono = (c) => !!c && (!!c.documentoExterno || (c.unidades || []).some(u =>
            (u.meses || []).length > 0 || String(u.oa || '').trim() || parseInt(u.sesiones) > 0));

        const tieneContenidoPlan = (p) => !!p && (!!p.documentoExterno || String(p.oaGlobal || '').trim() !== '' ||
            (p.sesiones || []).some(s => String(s.contenido || s.objetivoClase || s.actividadCentral || '').trim()));

                // ORDEN OFICIAL DE CURSOS: 1° Básico a 8° Básico y luego 1° a 4° Medio
        const ordenNivelPanel = (n) => {
            const i = NIVELES_DEFAULT.indexOf(n);
            return i === -1 ? 99 : i;
        };

        // 1a. Se unen las asignaciones que corresponden al MISMO curso (misma asignatura
        //     y mismo nivel, o mismo grupo electivo). Así una asignatura ya no se repite
        //     una vez por cada letra (A, B, C) del mismo nivel.
        const cursosUnicos = Object.values((asignacionesAgrupadas || []).reduce((acc, a) => {
            const anio = a.year || year;
            const clave = a.esElectivo
                ? `a.asignaturaId|G|{a.nombreGrupo}|${anio}`
                : `a.asignaturaId|N|{a.nivel}|${anio}`;
            if (!acc[clave]) acc[clave] = { ...a, anio, letras: [], niveles: [] };
            (a.letrasAgrupadas || [a.letra]).forEach(l => {
                if (l && !acc[clave].letras.includes(l)) acc[clave].letras.push(l);
            });
            (a.nivelesAgrupados || [a.nivel]).forEach(n => {
                if (n && !acc[clave].niveles.includes(n)) acc[clave].niveles.push(n);
            });
            return acc;
        }, {}));

        cursosUnicos.forEach(c => {
            c.letras.sort();
            c.niveles.sort((x, y) => ordenNivelPanel(x) - ordenNivelPanel(y));
        });

        cursosUnicos.sort((a, b) => {
            if (a.esElectivo !== b.esElectivo) return a.esElectivo ? 1 : -1;
            if (a.esElectivo) return (a.nombreGrupo || '').localeCompare(b.nombreGrupo || '');
            const d = ordenNivelPanel(a.niveles[0]) - ordenNivelPanel(b.niveles[0]);
            if (d !== 0) return d;
            return nombreAsig(a.asignaturaId).localeCompare(nombreAsig(b.asignaturaId));
        });

        // 1b. Una fila por curso o grupo del docente
        const filas = cursosUnicos.map(a => {
            const anio = a.anio || year;
            const cronoKeys = [];
            const prefijos = [];

            if (a.esElectivo) {
                cronoKeys.push(`a.asignaturaId-GLOBAL-{anio}-a.nombreGrupo`,`{a.asignaturaId}-GLOBAL-${anio}`);
                prefijos.push(`a.asignaturaId-GLOBAL-{anio}-${a.nombreGrupo}-U`);
                a.niveles.forEach(n => {
                    cronoKeys.push(`a.asignaturaId-{n}-${anio}`);
                    prefijos.push(`a.asignaturaId-{n}-anio-{a.nombreGrupo}-U`);
                });
            } else {
                cronoKeys.push(`a.asignaturaId-{a.nivel}-${anio}`);
                a.letras.forEach(l => prefijos.push(`a.asignaturaId-{a.nivel}-anio-{l}-U`));
            }

            const crono = cronoKeys.map(k => (dbData.cronogramas || []).find(c => c.key === k)).find(Boolean) || null;
            const numeros = (crono && (crono.unidades || []).length > 0) ? crono.unidades.map(u => u.numero) : [1, 2, 3, 4];

            const unidades = numeros.map(n => {
                const planes = (dbData.planificaciones || []).filter(p => prefijos.some(pref => String(p.key) === pref + n));
                const registro = planes.find(tieneContenidoPlan) || planes[0] || null;
                return { tipo: 'unidad', numero: n, etiqueta: `Unidad ${n}`, registro, hayContenido: planes.some(tieneContenidoPlan) };
            });

            const items = [{ tipo: 'crono', numero: 0, etiqueta: 'Cronograma', registro: crono, hayContenido: tieneContenidoCrono(crono) }, ...unidades];
            const listos = items.filter(i => i.hayContenido).length;

            return {
                id: `a.asignaturaId-{a.esElectivo ? a.nombreGrupo : a.nivel}-${anio}`,
                asig: a,
                asignatura: nombreAsig(a.asignaturaId),
                curso: a.esElectivo ? a.nombreGrupo : `${a.nivel} ${a.letras.join(', ')}`,
                esElectivo: !!a.esElectivo,
                items,
                listos,
                total: items.length,
                pct: items.length > 0 ? Math.round((listos * 100) / items.length) : 0
            };
        });

        if (filas.length === 0) return null;

        // 2. Totales
        const todos = filas.flatMap(f => f.items);
        const totalReg = todos.filter(i => i.hayContenido).length;
        const totalMon = todos.filter(i => i.hayContenido && i.registro?.monitoreado).length;
        const totalFalta = todos.filter(i => !i.hayContenido).length;
        const pctGlobal = todos.length > 0 ? Math.round((totalReg * 100) / todos.length) : 0;

        const estado = (it) => {
            if (!it.hayContenido) return { texto: 'Falta subir', accion: 'Ir a completar', icono: '⬆️', clase: 'bg-white border-slate-300 text-slate-500', punto: 'bg-slate-400' };
            const e = it.registro?.estado || 'Borrador';
            if (e === 'Aprobado') return { texto: 'Aprobado', accion: 'Abrir y revisar', icono: '✅', clase: 'bg-green-50 border-green-300 text-green-800', punto: 'bg-green-500' };
            if (e === 'Modificar') return { texto: 'Debe corregir', accion: 'Abrir y corregir', icono: '✏️', clase: 'bg-orange-50 border-orange-300 text-orange-800', punto: 'bg-orange-500' };
            if (e === 'Rechazado') return { texto: 'Rechazado', accion: 'Abrir y rehacer', icono: '⛔', clase: 'bg-red-50 border-red-300 text-red-800', punto: 'bg-red-500' };
            return { texto: 'Enviado, por revisar', accion: 'Abrir y revisar', icono: '🕓', clase: 'bg-yellow-50 border-yellow-300 text-yellow-800', punto: 'bg-yellow-500' };
        };

        const esActiva = (fila, it) => !!itemActivo && fila.id === cursoActivoId &&
            itemActivo.tipo === it.tipo && (it.tipo === 'crono' || itemActivo.numero === it.numero);

        const filasVisibles = soloPendientes
            ? filas.filter(f => f.items.some(i => !i.hayContenido || (i.registro?.estado === 'Modificar' || i.registro?.estado === 'Rechazado')))
            : filas;

        return (
            <div className="mb-8 bg-white border-2 border-teal-300 rounded-2xl overflow-hidden shadow-lg no-print-pdf animate-fade-in">
                {/* CABECERA */}
                <div className="bg-gradient-to-r from-teal-800 to-teal-600 text-white px-5 py-4">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                        <div className="min-w-0">
                            <div className="text-[10px] font-black uppercase tracking-[0.2em] text-teal-200 mb-1">Paso 1</div>
                            <h3 className="font-black text-lg uppercase flex items-center gap-2 leading-tight">
                                <LucideIcon iconName="ListChecks" size={22}/> Estado de mis planificaciones
                            </h3>
                            <p className="text-[11px] text-teal-100 mt-1 max-w-xl">
                                Haga clic en cualquier casilla para abrir directamente ese cronograma o esa unidad.
                            </p>
                        </div>
                        <button type="button" onClick={() => setAbierto(v => !v)} className="bg-white/15 hover:bg-white/25 rounded-lg px-3 py-2 text-[11px] font-bold flex items-center gap-2 transition-colors shrink-0">
                            <LucideIcon iconName={abierto ? 'ChevronUp' : 'ChevronDown'} size={16}/> {abierto ? 'Ocultar' : 'Ver detalle'}
                        </button>
                    </div>

                    {/* BARRA DE AVANCE GLOBAL */}
                    <div className="mt-4">
                        <div className="flex justify-between text-[10px] font-bold uppercase tracking-wider text-teal-100 mb-1">
                            <span>Avance de entrega</span>
                            <span>{totalReg} de {todos.length} instrumentos · {pctGlobal}%</span>
                        </div>
                        <div className="w-full h-3 bg-teal-900/50 rounded-full overflow-hidden">
                            <div className={`h-full transition-all duration-700 ${pctGlobal === 100 ? 'bg-green-400' : 'bg-orange-400'}`} style={{ width: `${pctGlobal}%` }}></div>
                        </div>
                        <div className="flex flex-wrap gap-2 mt-3">
                            <span className="bg-white/15 text-[10px] font-bold px-3 py-1 rounded-full">Entregados: {totalReg}</span>
                            <span className="bg-teal-900/60 text-[10px] font-bold px-3 py-1 rounded-full">Revisados por UTP: {totalMon}</span>
                            <span className={`text-[10px] font-bold px-3 py-1 rounded-full ${totalFalta > 0 ? 'bg-orange-500' : 'bg-green-500'}`}>Me falta subir: {totalFalta}</span>
                        </div>
                    </div>
                </div>

                {abierto && (
                    <div className="p-5 space-y-4 bg-teal-50">
                        {/* LEYENDA Y FILTRO */}
                        <div className="flex flex-wrap items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-3">
                            <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Significado de los colores:</span>
                            {[
                                { t: 'Falta subir', c: 'bg-slate-400' },
                                { t: 'Enviado, por revisar', c: 'bg-yellow-500' },
                                { t: 'Aprobado', c: 'bg-green-500' },
                                { t: 'Debe corregir', c: 'bg-orange-500' },
                                { t: 'Rechazado', c: 'bg-red-500' }
                            ].map(l => (
                                <span key={l.t} className="flex items-center gap-1.5 text-[10px] font-bold text-slate-600">
                                    <span className={`w-3 h-3 rounded-full ${l.c}`}></span> {l.t}
                                </span>
                            ))}
                            <label className="ml-auto flex items-center gap-2 text-[11px] font-bold text-teal-800 cursor-pointer bg-teal-50 border border-teal-200 px-3 py-1.5 rounded-lg">
                                <input type="checkbox" className="accent-teal-600" checked={soloPendientes} onChange={e => setSoloPendientes(e.target.checked)} />
                                Ver solo lo que me falta o debo corregir
                            </label>
                        </div>

                        {filasVisibles.length === 0 && (
                            <div className="bg-green-50 border-2 border-green-200 rounded-xl p-6 text-center">
                                <LucideIcon iconName="CheckCircle" size={36} className="text-green-500 mx-auto mb-2"/>
                                <p className="font-bold text-green-800 text-sm">¡Excelente! No tiene instrumentos pendientes ni observados.</p>
                            </div>
                        )}

                        {filasVisibles.map(f => {
                            const activo = f.id === cursoActivoId;
                            const comentarios = f.items
                                .flatMap(i => (i.registro?.comments || []).map(c => ({ ...c, donde: i.etiqueta })))
                                .slice(-3);
                            return (
                                <div key={f.id} className={`rounded-xl border-2 p-4 transition-all ${activo ? 'bg-teal-50/60 border-teal-500 shadow-md' : 'bg-white border-slate-200 hover:border-teal-300'}`}>
                                    {/* Título del curso + avance */}
                                    <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="font-black text-sm text-slate-800 uppercase">{f.asignatura}</span>
                                                <span className={`text-[10px] font-black px-2 py-0.5 rounded-full border ${f.esElectivo ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                                    {f.curso}
                                                </span>
                                                {activo && (
                                                    <span className="text-[9px] font-black bg-teal-600 text-white px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                                                        <LucideIcon iconName="Eye" size={10}/> Está trabajando aquí
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <div className="w-28 h-2 bg-slate-200 rounded-full overflow-hidden">
                                                <div className={`h-full ${f.pct === 100 ? 'bg-green-500' : 'bg-teal-500'}`} style={{ width: `${f.pct}%` }}></div>
                                            </div>
                                            <span className="text-[10px] font-black text-slate-500">{f.listos}/{f.total}</span>
                                        </div>
                                    </div>

                                    {/* Casillas */}
                                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                                        {f.items.map((it, i) => {
                                            const ev = estado(it);
                                            const mon = !!it.registro?.monitoreado;
                                            const enUso = esActiva(f, it);
                                            return (
                                                <button
                                                    key={i}
                                                    type="button"
                                                    onClick={() => onIrAInstrumento && onIrAInstrumento(f.asig, it)}
                                                    title={it.tipo === 'crono' ? 'Abrir el cronograma de este curso' : `Abrir la Unidad ${it.numero} de este curso`}
                                                    className={`relative text-left rounded-xl border-2 p-2.5 text-[10px] flex flex-col gap-1 min-w-0 cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-md ${ev.clase} ${enUso ? 'ring-4 ring-teal-400 ring-offset-1 border-teal-600' : ''}`}
                                                >
                                                    {enUso && (
                                                        <span className="absolute -top-2 left-2 bg-teal-600 text-white text-[8px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider shadow">Editando</span>
                                                    )}
                                                    <div className="flex items-center justify-between gap-1">
                                                        <span className="font-black uppercase truncate flex items-center gap-1">
                                                            <span className={`w-2 h-2 rounded-full ${ev.punto}`}></span> {it.etiqueta}
                                                        </span>
                                                        {it.registro?.documentoExterno && <span title="Documento adjunto">📎</span>}
                                                    </div>
                                                    <div className="font-bold uppercase truncate">{ev.icono} {ev.texto}</div>
                                                    <div className={`truncate text-[9px] ${mon ? 'text-teal-700 font-bold' : 'opacity-70'}`}>
                                                        {it.hayContenido ? (mon ? '👁️ Revisado por UTP' : 'Aún sin revisar') : 'Pendiente de entrega'}
                                                    </div>
                                                    {mon && it.registro?.fechaMonitoreo && (
                                                        <div className="text-[9px] opacity-70 truncate">{it.registro.monitoreadoPor || 'UTP'} · {it.registro.fechaMonitoreo}</div>
                                                    )}
                                                    <div className="text-[9px] font-black mt-auto pt-1 underline opacity-80">{ev.accion} →</div>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* Comentarios de UTP */}
                                    {comentarios.length > 0 && (
                                        <div className="mt-3 space-y-2">
                                            {comentarios.map((c, k) => (
                                                <div key={k} className="bg-yellow-50 border-l-4 border-yellow-400 rounded-r-lg p-2.5">
                                                    <div className="text-[9px] font-black uppercase text-yellow-700 mb-1 flex items-center gap-1">
                                                        <LucideIcon iconName="MessageSquare" size={11}/> Comentario de UTP · {c.donde}
                                                    </div>
                                                    <p className="text-[11px] text-slate-700 italic leading-snug m-0">"{c.text}"</p>
                                                    <div className="text-[9px] text-slate-400 mt-1">{c.author} · {c.date}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        {onVerDetalle && (
                            <div className="flex justify-end pt-1">
                                <button type="button" onClick={onVerDetalle} className="bg-slate-800 text-white text-[11px] font-bold px-5 py-2.5 rounded-lg hover:bg-black flex items-center gap-2 shadow">
                                    <LucideIcon iconName="Eye" size={14}/> Ver el detalle completo del monitoreo
                                </button>
                            </div>
                        )}
                    </div>
                )}
            </div>
        );
    };

    const DocenteDashboard = ({ user, dbData, setDbData, readOnly = false, viewer = null, forcedYear = null }) => {
        const [selAsignatura, setSelAsignatura] = useState(''); 
        const [selNivel, setSelNivel] = useState(''); 
        const [selLetra, setSelLetra] = useState(''); 
        
        // Estados para manejo de Electivos y Mixtos
        const [selEsElectivo, setSelEsElectivo] = useState(false);
        const [selNombreGrupo, setSelNombreGrupo] = useState('');
        const [selEsMixto, setSelEsMixto] = useState(false);
        
        const [activeTab, setActiveTab] = useState('cronograma');
        const [notification, setNotification] = useState(null);
        const [showEventos, setShowEventos] = useState(true); 
        const [showFechasImportantes, setShowFechasImportantes] = useState(true);
        const [showExcepcionesBanner, setShowExcepcionesBanner] = useState(true); // <-- NUEVO ESTADO PARA CERRAR EXCEPCIONES

        // NUEVO: al elegir un curso o una pestaña, la pantalla se desplaza hasta las pestañas y el contenido
        const zonaTrabajoRef = useRef(null);
        useEffect(() => {
            if (!selAsignatura || !zonaTrabajoRef.current) return;
            const t = setTimeout(() => {
                if (zonaTrabajoRef.current) zonaTrabajoRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 80);
            return () => clearTimeout(t);
        }, [activeTab, selAsignatura, selNivel, selLetra, selNombreGrupo]);
        
        const [selectedYear, setSelectedYear] = useState(forcedYear || getAcademicYear());
        useEffect(() => { if (forcedYear) setSelectedYear(forcedYear); }, [forcedYear]);
        const targetUid = user.uid; 
        
        // 1. Obtener asignaciones crudas
        const rawAsignaciones = (dbData.asignaciones || []).filter(a => 
            a.docenteId === targetUid && 
            (a.year === selectedYear || (!a.year && selectedYear === 2025))
        ); 
        
        // 2. LÓGICA DE AGRUPACIÓN DINÁMICA E INTELIGENTE
        const asignacionesAgrupadas = Object.values(rawAsignaciones.reduce((acc, curr) => {
            let key = curr.id; // Por defecto ID único (Plan común)
            
            if (curr.esElectivo && curr.nombreGrupo) {
                // Si es un grupo electivo, la llave es la Asignatura + el Nombre del Grupo
                // Así se fusionan automáticamente TODOS los niveles que compartan el mismo grupo.
                key = `curr.asignaturaId-GRUPO-{curr.nombreGrupo}`;
            }

            if (!acc[key]) {
                acc[key] = { 
                    ...curr, 
                    letrasAgrupadas: [curr.letra], 
                    nivelesAgrupados: [curr.nivel], // Guardamos todos los niveles
                    isGrouped: curr.esElectivo,
                    isMixto: false // Lo calcularemos abajo
                };
            } else {
                // Si ya existe, acumulamos letras y niveles sin repetir
                if (!acc[key].letrasAgrupadas.includes(curr.letra)) acc[key].letrasAgrupadas.push(curr.letra);
                if (!acc[key].nivelesAgrupados.includes(curr.nivel)) acc[key].nivelesAgrupados.push(curr.nivel);
            }
            
            // Si el grupo tiene más de un nivel, lo marcamos como mixto/multinivel
            if (acc[key].nivelesAgrupados.length > 1) {
                acc[key].isMixto = true;
            }
            
            return acc;
        }, {}));
        
                // Ordenar visualmente: primero el Plan Común en el orden oficial de cursos
        // (1° Básico a 8° Básico y luego 1° a 4° Medio); al final los Grupos Electivos
        const ordenNivelCurso = (n) => {
            const i = NIVELES_DEFAULT.indexOf(n);
            return i === -1 ? 99 : i;
        };
        asignacionesAgrupadas.sort((a, b) => {
            if (a.esElectivo !== b.esElectivo) return a.esElectivo ? 1 : -1;
            if (a.esElectivo) return (a.nombreGrupo || '').localeCompare(b.nombreGrupo || '');
            const d = ordenNivelCurso(a.nivel) - ordenNivelCurso(b.nivel);
            if (d !== 0) return d;
            const la = (a.letrasAgrupadas || [a.letra])[0] || '';
            const lb = (b.letrasAgrupadas || [b.letra])[0] || '';
            if (la !== lb) return la.localeCompare(lb);
            return (a.asignaturaId || '').localeCompare(b.asignaturaId || '');
        });

                const selectAssignment = (a) => { 
            setSelAsignatura(a.asignaturaId); 
            setSelNivel(a.nivel); 
            setSelLetra(a.letra); 
            setSelEsElectivo(a.esElectivo);
            setSelNombreGrupo(a.nombreGrupo);
            setSelEsMixto(a.isMixto);
        };

        // NUEVO: unidad que se debe abrir cuando el docente llega desde el panel de monitoreo
        const [unidadObjetivo, setUnidadObjetivo] = useState(null);

        // NUEVO: lleva al docente directamente al instrumento que debe completar
        const irAInstrumento = (asig, item) => {
            if (!asig) return;
            selectAssignment(asig);
            if (item.tipo === 'crono') {
                setUnidadObjetivo(null);
                setActiveTab('cronograma');
            } else {
                setUnidadObjetivo({ n: item.numero, marca: Date.now() });
                setActiveTab('planificacion');
            }
        };

        // NUEVO: el botón de detalle abre la pestaña aunque todavía no se haya elegido un curso
        const abrirMonitoreoCompleto = () => {
            if (!selAsignatura && asignacionesAgrupadas.length > 0) selectAssignment(asignacionesAgrupadas[0]);
            setActiveTab('monitoreo');
        };
        // NUEVO: identifica el curso y la unidad que el docente está editando ahora
        const [unidadActiva, setUnidadActiva] = useState(1);

        const cursoActivoId = selAsignatura
            ? `selAsignatura-{selEsElectivo ? selNombreGrupo : selNivel}-${selectedYear}`
            : '';

        const itemActivo = !selAsignatura ? null
            : (activeTab === 'cronograma' ? { tipo: 'crono', numero: 0 }
            : (activeTab === 'planificacion' ? { tipo: 'unidad', numero: unidadActiva } : null));

        const NOMBRES_PESTANA = {
            cronograma: 'Cronograma anual', planificacion: 'Planificación de clases', cobertura: 'Cobertura curricular',
            evaluaciones: 'Evaluaciones', resultados: 'Resultados', estadisticas: 'Estadísticas',
            portafolio: 'Mi portafolio', monitoreo: 'Detalle del monitoreo', calendario: 'Calendario escolar',
            materiales: 'Estado de materiales', glosario: 'Glosario 6C'
        };

        // --- CORRECCIÓN DE COLISIÓN DE PLANIFICACIONES ---
        const asignacionActual = asignacionesAgrupadas.find(a => a.asignaturaId === selAsignatura && (selEsMixto ? a.nombreGrupo === selNombreGrupo : a.nivel === selNivel && a.letra === selLetra));
        const misLetrasAsignadas = asignacionActual ? asignacionActual.letrasAgrupadas : [selLetra];

        // Contexto inteligente para pasar a los hijos
        const context = { 
            asignaturaId: selAsignatura, 
            asignaturaNombre: dbData.asignaturas.find(a=>a.id===selAsignatura)?.nombre, 
            nivel: selNivel, 
            letra: selLetra, 
            letrasReales: misLetrasAsignadas, // CORRECCIÓN: Solo aplica a los cursos de ESTE docente
            asignacionId: asignacionActual?.id, 
            year: selectedYear, 
            docenteName: user.name,
            esElectivo: selEsElectivo,
            nombreGrupo: selNombreGrupo,
            esMixto: selEsMixto
        };

        const currentUserForPermissions = viewer || user;

        // --- INICIO NUEVO CÓDIGO: CÁLCULOS DE PROGRESO (CORREGIDO ELECTIVOS) ---
        let totalCronogramasEsperados = asignacionesAgrupadas.length;
        let cronogramasCreados = 0;
        let totalUnidadesEsperadas = 0;
        let unidadesPlanificadas = 0;

        asignacionesAgrupadas.forEach(asig => {
            // 1. Generamos TODAS las posibles llaves con las que se pudo guardar
            let posiblesCronoKeys = [];
            if (asig.esElectivo) {
                posiblesCronoKeys.push(`asig.asignaturaId-GLOBAL-{asig.year || getAcademicYear()}-${asig.nombreGrupo}`);
                posiblesCronoKeys.push(`asig.asignaturaId-GLOBAL-{asig.year || getAcademicYear()}`);
                // Agregamos las llaves individuales de cada nivel que conforma el grupo
                asig.nivelesAgrupados.forEach(n => {
                    posiblesCronoKeys.push(`asig.asignaturaId-{n}-${asig.year || getAcademicYear()}`);
                });
            } else {
                posiblesCronoKeys.push(`asig.asignaturaId-{asig.nivel}-${asig.year || getAcademicYear()}`);
            }

            // 2. Buscamos si existe al menos un cronograma que coincida con alguna llave
            const cronoObj = (dbData.cronogramas || []).find(c => posiblesCronoKeys.includes(c.key));

                       if (cronoObj) {
                // Un cronograma creado solo para guardar comentarios de UTP no cuenta como entregado
                const cronoConContenido = !!cronoObj.documentoExterno || (cronoObj.unidades || []).some(u =>
                    (u.meses || []).length > 0 || String(u.oa || '').trim() || parseInt(u.sesiones) > 0);
                if (cronoConContenido) cronogramasCreados++;
                const unidadesDelCrono = (cronoObj.unidades || []).length || 4;
                totalUnidadesEsperadas += unidadesDelCrono;

                // 3. Buscamos las planificaciones correspondientes a cualquiera de esas llaves
                const planesDeEsteCrono = (dbData.planificaciones || []).filter(p => 
                    posiblesCronoKeys.includes(p.cronogramaKey) || 
                    (asig.esElectivo && p.nombreGrupo === asig.nombreGrupo && p.key.startsWith(asig.asignaturaId))
                );

                // Usamos un Set para no contar la misma unidad dos veces si el electivo afectó a 2 niveles
                const unidadesUnicasPlanificadas = new Set(planesDeEsteCrono
                    .filter(p => !!p.documentoExterno || String(p.oaGlobal || '').trim() !== '' ||
                        (p.sesiones || []).some(s => String(s.contenido || s.objetivoClase || s.actividadCentral || '').trim()))
                    .map(p => p.unidadNumero));
                unidadesPlanificadas += unidadesUnicasPlanificadas.size;
            } else {
                totalUnidadesEsperadas += 4;
            }
        });

        const pctCronogramas = totalCronogramasEsperados > 0 ? Math.round((cronogramasCreados / totalCronogramasEsperados) * 100) : 0;
        const pctPlanificaciones = totalUnidadesEsperadas > 0 ? Math.round((unidadesPlanificadas / totalUnidadesEsperadas) * 100) : 0;
        // --- FIN NUEVO CÓDIGO ---

        // --- LÓGICA EVENTOS PRÓXIMOS (DE SÁBADO A SÁBADO) ---
        const obtenerEventosProximos = () => {
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            
            // Calcular sábado anterior
            const start = new Date(hoy);
            const day = start.getDay(); // 0 = Dom, 1 = Lun, ..., 6 = Sab
            const diffToSat = day === 6 ? 0 : day + 1;
            start.setDate(start.getDate() - diffToSat);
            
            // Calcular próximo sábado
            const end = new Date(start);
            end.setDate(start.getDate() + 7);

            return (dbData.calendarioEscolar || [])
                .filter(ev => {
                    if (!ev.fecha) return false;
                    const fechaEv = new Date(ev.fecha + "T12:00:00");
                    fechaEv.setHours(0,0,0,0);
                    return fechaEv >= start && fechaEv <= end;
                })
                .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
        };
        const eventosProximos = obtenerEventosProximos();

        // NUEVO: los hitos del semestre solo se muestran mientras su fecha no haya pasado
        const hitosVigentes = (dbData.calendarioEscolar || [])
            .filter(ev => {
                if (!ev.esHito || !ev.fecha) return false;
                const f = new Date(String(ev.fecha).substring(0, 10) + "T12:00:00");
                if (isNaN(f.getTime())) return false;
                f.setHours(0, 0, 0, 0);
                const hoyHito = new Date();
                hoyHito.setHours(0, 0, 0, 0);
                return f >= hoyHito; // el hito desaparece recién al día siguiente
            })
            .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

        // --- NUEVO: LÓGICA DE EXCEPCIONES AUTORIZADAS PARA EL DOCENTE ---
        const hoyExcepciones = new Date();
        hoyExcepciones.setHours(0,0,0,0);
        const misExcepciones = (dbData.config?.excepcionesEvaluacion || []).filter(ex => {
            if (!ex.docentes?.includes(user.uid)) return false;
            const fechaEx = new Date(ex.fecha + "T12:00:00");
            fechaEx.setHours(0,0,0,0);
            return fechaEx >= hoyExcepciones;
        }).sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

        // --- NUEVO: Detectar fichas de retroalimentación pendientes de lectura
        const misFichasPendientes = (dbData.fichasDocentes || []).filter(f => f.docenteId === user.uid && !f.tomadoConocimiento);

        return (
                                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-orange-100 flex flex-col h-full">
               {notification && <NotificationPopup message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}

               {/* --- ALERTA DE TOMA DE CONOCIMIENTO Y FEEDBACK (NUEVO) --- */}
               {(() => {
                   const misFichasPendientes = (dbData.fichasDocentes || []).filter(f => f.docenteId === user.uid && !f.tomadoConocimiento);
                   const feedbackMejora = (dbData.fichasDocentes || [])
                                            .filter(f => f.docenteId === user.uid && f.comentarios && f.tomadoConocimiento)
                                            .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))
                                            .slice(0, 2); 

                   return (
                       <>
                           {/* NOTIFICACIÓN DE FIRMA PENDIENTE */}
                           {misFichasPendientes.length > 0 && !readOnly && (
                               <div className="mx-4 mt-4 space-y-3">
                                   {misFichasPendientes.map(ficha => (
                                       <div key={ficha.id} className="bg-gradient-to-r from-red-600 to-orange-600 text-white p-4 md:p-5 rounded-xl shadow-lg flex flex-col md:flex-row items-center justify-between gap-4 animate-pop-in border-2 border-red-300">
                                           <div className="flex items-center gap-4 w-full md:w-auto">
                                               <div className="bg-white/20 p-3 rounded-full flex-shrink-0">
                                                   <LucideIcon iconName="BellRing" size={32} className="animate-pulse" />
                                               </div>
                                               <div>
                                                   <h4 className="font-black text-lg md:text-xl">¡Atención! Nueva {ficha.tipo || 'Retroalimentación'}</h4>
                                                   <p className="text-sm opacity-90 mt-1">
                                                       UTP ha registrado una pauta con fecha <strong>{formatFechaManual(ficha.fecha)}</strong> {ficha.libro ? `para el libro: ${ficha.libro}` : ''}.
                                                       Presiona Ok para verificar tu portafolio.
                                                   </p>
                                               </div>
                                           </div>
                                           <button 
                                               onClick={() => {
                                                   setDbData(prev => ({
                                                       ...prev,
                                                       fichasDocentes: prev.fichasDocentes.map(f => f.id === ficha.id ? {...f, tomadoConocimiento: true, fechaConocimiento: new Date().toLocaleString('es-CL')} : f)
                                                   }));
                                                   setNotification({message: 'Toma de conocimiento registrada exitosamente', type: 'success'});
                                                   setActiveTab('portafolio');
                                                   window.scrollTo({ top: 0, behavior: 'smooth' });
                                               }} 
                                               className="bg-white text-red-700 px-6 py-3 rounded-xl font-black text-sm hover:bg-red-50 transition-transform active:scale-95 whitespace-nowrap shadow-md w-full md:w-auto"
                                           >
                                               <div className="flex items-center justify-center gap-2">
                                                   <LucideIcon iconName="CheckCircle" size={18}/>
                                                   OK, VER MI FICHA
                                               </div>
                                           </button>
                                       </div>
                                   ))}
                               </div>
                           )}

                           {/* FEEDBACK DIRECTO EN PORTADA */}
                           {feedbackMejora.length > 0 && !readOnly && (
                               <div className="mx-4 mt-4 bg-white p-6 rounded-2xl border-l-8 border-indigo-500 shadow-md flex flex-col md:flex-row gap-6 items-start">
                                   <div className="flex-shrink-0 bg-indigo-50 p-4 rounded-full">
                                       <LucideIcon iconName="TrendingUp" size={36} className="text-indigo-600"/>
                                   </div>
                                   <div className="flex-1 w-full">
                                       <h4 className="font-black text-indigo-900 text-lg mb-1">Aspectos a Mejorar (Feedback UTP)</h4>
                                       <p className="text-xs text-slate-500 mb-4 uppercase font-bold tracking-wider">Extraído de tus últimas revisiones de portafolio:</p>
                                       
                                       <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                           {feedbackMejora.map(f => (
                                               <div key={f.id} className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                                   <div className="flex justify-between items-start mb-2">
                                                        <span className="text-[10px] font-black text-indigo-500 bg-white px-2 py-0.5 rounded shadow-sm border border-indigo-100">
                                                            {f.tipo}
                                                        </span>
                                                        <span className="text-[10px] text-slate-400 font-bold">{formatFechaManual(f.fecha)}</span>
                                                   </div>
                                                   {f.libro && <div className="text-[10px] font-bold text-slate-600 mb-2 truncate">📖 {f.libro}</div>}
                                                   <div className="text-sm text-indigo-950 font-medium italic border-l-2 border-indigo-300 pl-3">
                                                       "{f.comentarios}"
                                                   </div>
                                               </div>
                                           ))}
                                       </div>
                                   </div>
                               </div>
                           )}
                       </>
                   );
               })()}

              {/* --- WIDGETS SUPERIORES: FECHAS Y EVENTOS --- */}
               {(showEventos || showFechasImportantes || misExcepciones.length > 0) && (
                   <div className="mx-4 mb-4 mt-4 space-y-4">
                       
                       {/* 1. NUEVO WIDGET: EXCEPCIONES AUTORIZADAS */}
                       {showExcepcionesBanner && misExcepciones.length > 0 && (
                           <div className="bg-gradient-to-r from-emerald-50 to-teal-50 border-2 border-emerald-300 shadow-md rounded-xl p-3 md:p-4 relative overflow-hidden flex flex-col md:flex-row gap-4 items-center animate-fade-in">
                               {/* BOTÓN CERRAR EXCEPCIONES */}
                               <button onClick={() => setShowExcepcionesBanner(false)} className="absolute top-2 right-2 text-emerald-500 hover:text-emerald-700 bg-emerald-200/50 rounded-full p-1 transition-colors z-10" title="Ocultar aviso">
                                   <LucideIcon iconName="X" size={14} />
                               </button>
                               
                               <div className="flex-shrink-0 flex flex-col items-center justify-center md:border-r border-emerald-200 md:pr-4 w-full md:w-auto">
                                   <div className="bg-emerald-100 p-2 rounded-full mb-1">
                                       <LucideIcon iconName="Unlock" size={24} className="text-emerald-600"/>
                                   </div>
                                   <span className="text-[10px] font-black text-emerald-800 uppercase tracking-widest text-center">Excepciones</span>
                                   <span className="text-[9px] text-emerald-600 text-center font-bold">Autorizadas UTP</span>
                               </div>
                               <div className="flex flex-row gap-3 overflow-x-auto pb-2 w-full snap-x hide-scrollbar pt-2">
                                   {misExcepciones.map((ex, i) => (
                                       <div key={i} className="min-w-[200px] max-w-[250px] p-3 rounded-lg border-l-4 border-emerald-500 bg-white shadow-sm snap-start shrink-0 flex flex-col transition-transform hover:scale-105">
                                           <div className="flex justify-between items-start mb-1.5">
                                               <span className="text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider bg-emerald-600 text-white">
                                                   {formatFechaManual(ex.fecha)}
                                               </span>
                                           </div>
                                           <div className="font-bold text-sm text-slate-800 leading-snug mb-1">
                                               Curso: <span className="text-teal-700">{ex.curso}</span>
                                           </div>
                                           <div className="text-[10px] text-slate-600 flex items-center gap-1 font-medium">
                                               Se ha permitido una <strong className="text-sm text-emerald-600">{ex.cantidad}° evaluación</strong>
                                           </div>
                                       </div>
                                   ))}
                               </div>
                           </div>
                       )}
                       
                                              {/* MEJORA B: FECHAS IMPORTANTES DEL SEMESTRE (solo hitos vigentes) */}
                       {showFechasImportantes && hitosVigentes.length > 0 && (
                           <div className="bg-gradient-to-r from-blue-900 to-indigo-900 border border-indigo-800 shadow-md rounded-xl p-3 md:p-4 relative overflow-hidden no-print-pdf flex flex-col md:flex-row gap-4 items-center transition-all animate-fade-in">
                               <button onClick={() => setShowFechasImportantes(false)} className="absolute top-2 right-2 text-indigo-300 hover:text-white bg-indigo-800/50 rounded-full p-1 transition-colors" title="Ocultar fechas importantes">
                                   <LucideIcon iconName="X" size={14} />
                               </button>
                               
                               <div className="flex-shrink-0 flex flex-col items-center justify-center md:border-r border-indigo-700 md:pr-4 w-full md:w-auto">
                                   <div className="bg-indigo-800 p-2 rounded-full mb-1">
                                       <LucideIcon iconName="Calendar" size={20} className="text-blue-300"/>
                                   </div>
                                   <span className="text-[10px] font-black text-indigo-200 uppercase tracking-widest text-center">Hitos del</span>
                                   <span className="text-[9px] text-indigo-400 text-center">Semestre</span>
                               </div>
                               
                               <div className="flex flex-row gap-3 overflow-x-auto pb-2 w-full snap-x hide-scrollbar pt-2">
       {(() => {
        // Se usan únicamente los hitos cuya fecha es hoy o posterior
        const hitos = hitosVigentes;

        if (hitos.length === 0) return <div className="text-indigo-300/70 text-xs italic px-2 py-4">No hay hitos próximos en el calendario escolar.</div>;

        return hitos.map((ev) => (
            <div key={ev.id} className="min-w-[200px] max-w-[250px] p-3 rounded-lg border border-indigo-700 bg-indigo-800/50 shadow-sm snap-start shrink-0 flex flex-col text-white transition-transform hover:scale-105">
                <div className="flex justify-between items-start mb-1.5">
                    <span className="text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider bg-blue-500 text-white">
                        {formatFechaManual(ev.fecha)}
                    </span>
                </div>
                <div className="font-bold text-sm leading-snug mb-1 truncate" title={ev.actividad}>{ev.actividad}</div>
                <div className="text-[10px] text-indigo-300 flex items-center gap-1 font-medium">
                    <LucideIcon iconName="Pin" size={12}/> {ev.etiquetaHito || 'Institucional'}
                </div>
            </div>
        ));
    })()}
</div>
                           </div>
                       )}

                       {/* EVENTOS DE ESTA SEMANA (SE MANTIENE DEBAJO) */}
                       {showEventos && eventosProximos.length > 0 && (
                           <div className="bg-white border border-slate-200 shadow-sm rounded-xl p-3 md:p-4 relative overflow-hidden no-print-pdf flex flex-col md:flex-row gap-4 items-center transition-all animate-fade-in">
                               {/* Botón para cerrar */}
                               <button onClick={() => setShowEventos(false)} className="absolute top-2 right-2 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1 transition-colors" title="Ocultar eventos">
                                   <LucideIcon iconName="X" size={14} />
                               </button>
                               
                               {/* Cabecera del widget */}
                               <div className="flex-shrink-0 flex flex-col items-center justify-center md:border-r border-slate-100 md:pr-4 w-full md:w-auto">
                                   <div className="bg-orange-100 p-2 rounded-full mb-1">
                                       <LucideIcon iconName="BellRing" size={20} className="text-orange-600 animate-pulse"/>
                                   </div>
                                   <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Esta Semana</span>
                                   <span className="text-[9px] text-slate-400 text-center">(Sáb a Sáb)</span>

                               {/* Tarjetas de colores dinámicos */}
