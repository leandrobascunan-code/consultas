                const PublicEvaluaciones = ({ dbData }) => {
        const [selNivel, setSelNivel] = useState(''); const [selLetra, setSelLetra] = useState(''); 
        const [showMonthModal, setShowMonthModal] = useState(false);
        const [mesesSeleccionados, setMesesSeleccionados] = useState([]);
        // NUEVO: vista institucional tipo Carta Gantt
        const [modoVista, setModoVista] = useState('curso'); // 'curso' | 'gantt'
        const [ganttMes, setGanttMes] = useState(new Date().getMonth() + 1);
        const [ganttAnio, setGanttAnio] = useState(new Date().getFullYear());
        const [ganttNivelFiltro, setGanttNivelFiltro] = useState('');

        // NUEVO: filtro de mes visible en pantalla y detalle emergente de evaluación
        const [mesVista, setMesVista] = useState('');
        const [evalDetalle, setEvalDetalle] = useState(null);

        const MESES_LARGOS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        const evalsCursoTodas = (dbData.evaluaciones || [])
            .filter(ev => ev.estado !== 'Rechazado' && ev.estado !== 'Anular' && (!selNivel || ev.nivel === selNivel) && (!selLetra || ev.letra === selLetra))
            .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

        // Si hay un mes elegido, la tabla en pantalla muestra solo ese mes
        const evalsCurso = mesVista
            ? evalsCursoTodas.filter(ev => ev.fecha && parseInt(ev.fecha.split('-')[1], 10) === parseInt(mesVista, 10))
            : evalsCursoTodas;

                // --- HELPERS COMPARTIDOS ---
        const nombreAsig = (id) => (dbData.asignaturas || []).find(a => a.id === id)?.nombre || 'General';

                const logoHtml = () => dbData.config?.schoolLogo
            ? `<img src="${dbData.config.schoolLogo}" style="max-width:75px;max-height:75px;width:auto;height:auto;object-fit:contain;display:block;" />`
            : '<div style="width:60px;height:60px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:10px;">LOGO</div>';

               // ===== MOTOR DE DESCARGA EN PDF (jsPDF + AutoTable, carga automática) =====
        const cargarLibreriaPDF = () => new Promise((resolve, reject) => {
            const listo = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
            if (listo()) return resolve();
            const cargarScript = (src) => new Promise((ok, err) => {
                const existente = document.querySelector(`script[src="${src}"]`);
                if (existente) { existente.addEventListener('load', ok); if (existente.dataset.cargado) ok(); return; }
                const s = document.createElement('script');
                s.src = src;
                s.onload = () => { s.dataset.cargado = '1'; ok(); };
                s.onerror = () => err(new Error('No se pudo cargar ' + src));
                document.head.appendChild(s);
            });
            cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
                .then(() => cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
                .then(() => listo() ? resolve() : reject(new Error('Librería PDF incompleta')))
                .catch(reject);
        });

                // Caja fija reservada para la insignia en todos los PDF (en milímetros)
        const CAJA_LOGO = { x: 14, y: 7, ancho: 22, alto: 22 };

        // Dibuja la insignia escalada proporcionalmente y centrada dentro de la caja.
        // Nunca se estira: se ajusta al lado que primero toca el borde y conserva su forma original.
        const dibujarLogoPDF = (doc, caja = CAJA_LOGO) => {
            const fuente = dbData.config?.schoolLogo;
            if (!fuente) return;
            try {
                const props = doc.getImageProperties(fuente);
                const anchoOriginal = props.width || 1;
                const altoOriginal = props.height || 1;

                // Formato real del archivo (evita deformaciones y fallos con JPG o WEBP)
                let formato = (props.fileType || 'PNG').toUpperCase();
                if (!['PNG', 'JPEG', 'JPG', 'WEBP'].includes(formato)) formato = 'PNG';
                if (formato === 'JPG') formato = 'JPEG';

                // Factor de escala: el menor de los dos, para que la imagen quepa completa
                const escala = Math.min(caja.ancho / anchoOriginal, caja.alto / altoOriginal);
                const anchoFinal = anchoOriginal * escala;
                const altoFinal = altoOriginal * escala;

                // Centrado dentro de la caja reservada
                const x = caja.x + (caja.ancho - anchoFinal) / 2;
                const y = caja.y + (caja.alto - altoFinal) / 2;

                doc.addImage(fuente, formato, x, y, anchoFinal, altoFinal, undefined, 'FAST');
            } catch (e) {
                console.warn('No fue posible incorporar la insignia al PDF:', e);
            }
        };

        // Encabezado institucional dentro del PDF (logo + títulos + línea)
        const dibujarEncabezadoPDF = (doc, titulo, subtitulo) => {
            const ancho = doc.internal.pageSize.getWidth();
            dibujarLogoPDF(doc);
                        // El texto se centra en el espacio que queda a la derecha de la insignia,
            // para que ningún título quede tapado ni descuadrado.
            const inicioTexto = CAJA_LOGO.x + CAJA_LOGO.ancho + 4;
            const centroTexto = inicioTexto + ((ancho - 14) - inicioTexto) / 2;
            const anchoUtil = (ancho - 14) - inicioTexto;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(15, 23, 42);
            doc.text('COLEGIO MARINA DE CHILE', centroTexto, 15, { align: 'center' });

            doc.setFontSize(11);
            doc.setTextColor(30, 58, 138);
            doc.text(doc.splitTextToSize(titulo, anchoUtil)[0], centroTexto, 22, { align: 'center' });

            let y = 26;
            if (subtitulo) {
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                doc.setTextColor(71, 85, 105);
                doc.text(doc.splitTextToSize(subtitulo, anchoUtil)[0], centroTexto, 27.5, { align: 'center' });
                y = 31;
            }
                        // La línea se traza siempre bajo la insignia completa, aunque el texto sea corto
            const limiteLogo = CAJA_LOGO.y + CAJA_LOGO.alto + 2;
            const yLinea = Math.max(y, limiteLogo);

            doc.setDrawColor(30, 58, 138);
            doc.setLineWidth(0.8);
            doc.line(14, yLinea, ancho - 14, yLinea);
            return yLinea + 6;
        };

        // Pie de página con numeración
        const dibujarPiePDF = (doc) => {
            const total = doc.internal.getNumberOfPages();
            const ancho = doc.internal.pageSize.getWidth();
            const alto = doc.internal.pageSize.getHeight();
            for (let i = 1; i <= total; i++) {
                doc.setPage(i);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7);
                doc.setTextColor(148, 163, 184);
                doc.text('Colegio Marina de Chile — Documento informativo generado por el sistema', 14, alto - 8);
                doc.text(`Página ${i} de ${total}`, ancho - 14, alto - 8, { align: 'right' });
            }
        };

        // Genera un PDF con uno o varios cursos (cada curso parte en página nueva)
        const generarPDFCalendarios = async (nombreArchivo, bloques) => {
            try {
                await cargarLibreriaPDF();
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
                const subtituloMes = mesVista ? `Mes: ${MESES_LARGOS[parseInt(mesVista, 10) - 1]}` : 'Año completo';

                bloques.forEach((bloque, i) => {
                    if (i > 0) doc.addPage();
                    const inicioY = dibujarEncabezadoPDF(doc, `Calendario de Evaluaciones — Curso ${bloque.curso}`, subtituloMes);
                    doc.autoTable({
                        startY: inicioY,
                        theme: 'grid',
                        head: [['Fecha', 'Asignatura', 'Instrumento', 'Contenido']],
                        body: bloque.evals.length === 0
                            ? [['—', '—', '—', 'Sin evaluaciones registradas.']]
                            : bloque.evals.map(ev => [
                                formatFechaManual(ev.fecha),
                                nombreAsig(ev.asignaturaId),
                                ev.instrumento || '-',
                                ev.contenido || '-'
                            ]),
                        styles: { fontSize: 8.5, cellPadding: 2, valign: 'top', lineColor: [148, 163, 184], lineWidth: 0.1, textColor: [15, 23, 42] },
                        headStyles: { fillColor: [30, 58, 138], textColor: 255, fontStyle: 'bold', fontSize: 8.5, halign: 'center' },
                        alternateRowStyles: { fillColor: [248, 250, 252] },
                        columnStyles: { 0: { cellWidth: 30 }, 1: { cellWidth: 35 }, 2: { cellWidth: 35 } },
                        margin: { left: 14, right: 14, bottom: 16 }
                    });
                });

                dibujarPiePDF(doc);
                doc.save(`${nombreArchivo}.pdf`);
            } catch (e) {
                console.error(e);
                alert("No fue posible generar el PDF. Revise su conexión a internet e inténtelo nuevamente.");
            }
        };

        // Construye el bloque HTML de un curso (usado para imprimir y para descargar)
        const construirHtmlCurso = (titulo, listaEvals, saltoPagina = false) => `
            <div class="${saltoPagina ? 'page-break' : ''}" style="margin-bottom: 30px;">
                <div class="header-container">
                    <div class="header-logo">${logoHtml()}</div>
                    <div class="header-text">
                        <h1>Colegio Marina de Chile</h1>
                        <h2>Calendario de Evaluaciones</h2>
                        <p style="text-align:center;margin:2px 0;"><strong>Curso:</strong> ${titulo}</p>
                        ${mesVista ? `<p style="text-align:center;margin:2px 0;font-size:9pt;"><strong>Mes:</strong> ${MESES_LARGOS[parseInt(mesVista,10)-1]}</p>` : ''}
                    </div>
                </div>
                <table>
                    <thead><tr><th style="width:120px;">Fecha</th><th style="width:130px;">Asignatura</th><th style="width:130px;">Instrumento</th><th>Contenido</th></tr></thead>
                    <tbody>
                        ${listaEvals.length === 0
                            ? '<tr><td colspan="4" style="text-align:center;font-style:italic;">Sin evaluaciones registradas.</td></tr>'
                            : listaEvals.map(ev => `<tr><td>formatFechaManual(ev.fecha)</td><td>{nombreAsig(ev.asignaturaId)}</td><td>ev.instrumento||'-'</td><td>{ev.contenido || '-'}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>`;

        // BOTÓN REPARADO: Imprimir todos los cursos (respeta nivel y mes elegidos)
        const openBulkPrintCalendarios = () => {
            const base = (dbData.evaluaciones || []).filter(ev => {
                if (!ev || !ev.fecha) return false;
                if (ev.estado === 'Rechazado' || ev.estado === 'Anular') return false;
                if (selNivel && ev.nivel !== selNivel) return false;
                if (mesVista && parseInt(ev.fecha.split('-')[1], 10) !== parseInt(mesVista, 10)) return false;
                return true;
            });

            if (base.length === 0) {
                alert("No hay evaluaciones registradas para los filtros seleccionados (nivel y/o mes).");
                return;
            }

            // Agrupar por curso evitando duplicar los electivos en un mismo día
            const grouped = {};
            base.sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).forEach(ev => {
                const key = `${ev.nivel} ${ev.letra}`;
                if (!grouped[key]) grouped[key] = [];
                const yaEsta = grouped[key].some(x =>
                    x.fecha === ev.fecha && x.asignaturaId === ev.asignaturaId && x.instrumento === ev.instrumento
                );
                if (!yaEsta) grouped[key].push(ev);
            });

            const cursosOrdenados = Object.keys(grouped).sort((a, b) => {
                const na = NIVELES_DEFAULT.findIndex(n => a.startsWith(n));
                const nb = NIVELES_DEFAULT.findIndex(n => b.startsWith(n));
                return (na - nb) || a.localeCompare(b);
            });

            let fullHtml = '';
            cursosOrdenados.forEach((key, index) => {
                fullHtml += construirHtmlCurso(key, grouped[key], index > 0);
            });

            printDocument(fullHtml, 'Consolidado_Evaluaciones', true);
        };

               // Descarga en PDF del consolidado de todos los cursos
        const descargarTodosCalendarios = async () => {
            const base = (dbData.evaluaciones || []).filter(ev => {
                if (!ev || !ev.fecha) return false;
                if (ev.estado === 'Rechazado' || ev.estado === 'Anular') return false;
                if (selNivel && ev.nivel !== selNivel) return false;
                if (mesVista && parseInt(ev.fecha.split('-')[1], 10) !== parseInt(mesVista, 10)) return false;
                return true;
            });
            if (base.length === 0) { alert("No hay evaluaciones para descargar con los filtros actuales."); return; }

            const grouped = {};
            base.sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).forEach(ev => {
                const key = `${ev.nivel} ${ev.letra}`;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(ev);
            });

                        const bloques = Object.keys(grouped)
                .sort((a, b) => {
                    const na = NIVELES_DEFAULT.findIndex(n => a.startsWith(n));
                    const nb = NIVELES_DEFAULT.findIndex(n => b.startsWith(n));
                    return (na - nb) || a.localeCompare(b);
                })
                .map(key => ({ curso: key, evals: grouped[key] }));

            const nombre = `Calendarios_selNivel||'Todoslosniveles'{mesVista ? '_' + MESES_LARGOS[parseInt(mesVista, 10) - 1] : ''}`;
            generarPDFCalendarios(nombre, bloques);
        };

                // Descarga en PDF del calendario del curso que se está observando en pantalla
        const descargarCalendarioCurso = async () => {
            if (!selNivel || !selLetra) { alert("Seleccione primero un nivel y una letra."); return; }
            if (evalsCurso.length === 0) { alert("No hay evaluaciones visibles para descargar."); return; }
            const nombre = `Calendario_${selNivel}_${selLetra}${mesVista ? '_' + MESES_LARGOS[parseInt(mesVista, 10) - 1] : ''}`;
            await generarPDFCalendarios(nombre, [{ curso: `${selNivel} ${selLetra}`, evals: evalsCurso }]);
        };


        // NUEVO: impresión del curso seleccionado, filtrando por meses elegidos
        const imprimirCursoPorMeses = (mesesFiltro = []) => {
            let evalsFiltradas = evalsCurso;
            if (mesesFiltro && mesesFiltro.length > 0) {
                evalsFiltradas = evalsCurso.filter(ev => {
                    const mesEv = parseInt(ev.fecha.split('-')[1], 10); // 1 a 12
                    return mesesFiltro.includes(mesEv);
                });
            }
            if (evalsFiltradas.length === 0) {
                alert("No hay evaluaciones registradas en los meses seleccionados para este curso.");
                return;
            }
            const logoImg = dbData.config.schoolLogo ? `<img src="${dbData.config.schoolLogo}" style="width:70px;height:70px;object-fit:contain;" />` : '<div style="width:60px;height:60px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:10px;">LOGO</div>';
            const html = `
                <div style="padding: 10px;">
                    <div class="header-container">
                        <div class="header-logo">${logoImg}</div>
                        <div class="header-text">
                            <h1>Colegio Marina de Chile</h1>
                            <h2>Calendario de Evaluaciones</h2>
                            <p style="text-align:center;"><strong>Curso:</strong> ${selNivel} ${selLetra}</p>
                            ${mesesFiltro.length > 0 ? `<p style="text-align:center;font-size:9pt;"><strong>Meses incluidos:</strong> ${mesesFiltro.map(m => ["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m]).join(', ')}</p>` : ''}
                        </div>
                    </div>
                    <table>
                        <thead><tr><th>Fecha</th><th>Asignatura</th><th>Instrumento</th><th>Contenido</th></tr></thead>
                        <tbody>
                            ${evalsFiltradas.map(ev => `<tr><td>${formatFechaManual(ev.fecha)}</td><td>dbData.asignaturas.find(a=>a.id===ev.asignaturaId)?.nombre||'General'</td><td>{ev.instrumento}</td><td>${ev.contenido}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            printDocument(html, `Calendario_${selNivel}_${selLetra}`, true);
        };

                // ===== LÓGICA CARTA GANTT INSTITUCIONAL =====
        const MESES_NOMBRES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const DIAS_LETRA = ['D','L','M','M','J','V','S'];

        const ganttDias = new Date(ganttAnio, ganttMes, 0).getDate();

        const ganttCursos = (dbData.cursos || [])
            .filter(c => !ganttNivelFiltro || c.nivel === ganttNivelFiltro)
            .sort((a, b) => (NIVELES_DEFAULT.indexOf(a.nivel) - NIVELES_DEFAULT.indexOf(b.nivel)) || (a.letra || '').localeCompare(b.letra || ''));

        const ganttEvals = (dbData.evaluaciones || []).filter(ev => {
            if (!ev.fecha) return false;
            if (ev.estado === 'Rechazado' || ev.estado === 'Anular') return false;
            const partes = ev.fecha.split('-');
            return parseInt(partes[0], 10) === ganttAnio && parseInt(partes[1], 10) === ganttMes;
        });

        const abrevAsig = (ev) => {
            const nom = (dbData.asignaturas || []).find(a => a.id === ev.asignaturaId)?.nombre || ev.asignaturaId || '';
            return nom.substring(0, 3).toUpperCase();
        };

        const getEvalsCelda = (nivel, letra, dia) => {
            const key = `ganttAnio-{String(ganttMes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
            return ganttEvals.filter(ev => ev.nivel === nivel && ev.letra === letra && ev.fecha === key);
        };

        const eventosDelMes = (dbData.calendarioEscolar || []).filter(e => {
            if (!e.fecha) return false;
            const p = e.fecha.split('-');
            return parseInt(p[0], 10) === ganttAnio && parseInt(p[1], 10) === ganttMes;
        });

                const construirHtmlGantt = () => {
            if (ganttCursos.length === 0) { alert("No hay cursos configurados para el filtro seleccionado."); return null; }

            let encabezado = '';
            for (let d = 1; d <= ganttDias; d++) {
                const dow = new Date(ganttAnio, ganttMes - 1, d).getDay();
                const bg = (dow === 0 || dow === 6) ? '#cbd5e1' : '#f1f5f9';
                encabezado += `<th style="border:1px solid #64748b;background:bg;font-size:6pt;padding:1px;">{d}<br/>${DIAS_LETRA[dow]}</th>`;
            }

            let filas = '';
            ganttCursos.forEach(c => {
                let celdas = '';
                for (let d = 1; d <= ganttDias; d++) {
                    const evs = getEvalsCelda(c.nivel, c.letra, d);
                    const dow = new Date(ganttAnio, ganttMes - 1, d).getDay();
                    let bg = '#ffffff';
                    if (dow === 0 || dow === 6) bg = '#e2e8f0';
                    else if (evs.length >= 3) bg = '#fca5a5';
                    else if (evs.length === 2) bg = '#fcd34d';
                    else if (evs.length === 1) bg = '#bbf7d0';
                    celdas += `<td style="border:1px solid #94a3b8;background:bg;font-size:5.5pt;text-align:center;padding:1px;font-weight:bold;-webkit-print-color-adjust:exact;print-color-adjust:exact;">{evs.map(e => abrevAsig(e)).join('<br/>')}</td>`;
                }
                filas += `<tr><td style="border:1px solid #64748b;padding:3px 5px;font-size:8pt;font-weight:bold;white-space:nowrap;background:#f8fafc;">${c.nivel} c.letra</td>{celdas}</tr>`;
            });

            const logo = dbData.config?.schoolLogo ? `<img src="${dbData.config.schoolLogo}" style="max-width:70px;max-height:70px;width:auto;height:auto;object-fit:contain;display:block;"/>` : '';
            const eventos = eventosDelMes.length > 0
                ? `<div style="margin-top:15px;font-size:8pt;"><strong>Actividades institucionales del mes:</strong><ul style="margin:4px 0 0 16px;padding:0;">${eventosDelMes.map(e => `<li>${formatFechaManual(e.fecha)} — e.actividad{e.cambioActividad ? ' (Cambio de actividades)' : ''}</li>`).join('')}</ul></div>`
                : '';

            const html = `
                <style>@page { size: Letter landscape; margin: 1cm; }</style>
                <div class="header-container">
                    <div class="header-logo">${logo}</div>
                    <div class="header-text">
                        <h1>Colegio Marina de Chile</h1>
                        <h3>Carta Gantt de Evaluaciones — ${MESES_NOMBRES[ganttMes - 1]} ${ganttAnio}</h3>
                        <p style="text-align:center;font-size:9pt;">${ganttNivelFiltro ? `Nivel: ${ganttNivelFiltro}` : 'Todos los niveles'} • Total de evaluaciones del mes: ${ganttEvals.length}</p>
                    </div>
                </div>
                <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
                    <thead><tr><th style="border:1px solid #64748b;background:#1e3a8a;color:#fff;font-size:8pt;width:70px;">CURSO</th>${encabezado}</tr></thead>
                    <tbody>${filas}</tbody>
                </table>
                <div style="margin-top:10px;font-size:7pt;">
                    <strong>Simbología:</strong>
                    <span style="background:#bbf7d0;padding:1px 6px;border:1px solid #94a3b8;">1 evaluación</span>
                    <span style="background:#fcd34d;padding:1px 6px;border:1px solid #94a3b8;">2 evaluaciones</span>
                    <span style="background:#fca5a5;padding:1px 6px;border:1px solid #94a3b8;">3 o más (sobrecarga)</span>
                    <span style="background:#e2e8f0;padding:1px 6px;border:1px solid #94a3b8;">Fin de semana</span>
                    &nbsp;— Cada celda muestra las tres primeras letras de la asignatura.
                </div>
                ${eventos}
            `;
                        return html;
        };

        const imprimirGantt = () => {
            const html = construirHtmlGantt();
            if (html) printDocument(html, `Carta_Gantt_${MESES_NOMBRES[ganttMes - 1]}_${ganttAnio}`, true);
        };

                const descargarGantt = async () => {
            if (ganttCursos.length === 0) { alert("No hay cursos configurados para el filtro seleccionado."); return; }
            try {
                await cargarLibreriaPDF();
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });

                const inicioY = dibujarEncabezadoPDF(
                    doc,
                    `Carta Gantt de Evaluaciones — ${MESES_NOMBRES[ganttMes - 1]} ${ganttAnio}`,
                    `${ganttNivelFiltro ? 'Nivel: ' + ganttNivelFiltro : 'Todos los niveles'}   •   Total de evaluaciones del mes: ${ganttEvals.length}`
                );

                const cabecera = ['CURSO'];
                for (let d = 1; d <= ganttDias; d++) {
                    cabecera.push(`${d}\n${DIAS_LETRA[new Date(ganttAnio, ganttMes - 1, d).getDay()]}`);
                }

                const cuerpo = ganttCursos.map(c => {
                    const fila = [`${c.nivel} ${c.letra}`];
                    for (let d = 1; d <= ganttDias; d++) {
                        fila.push(getEvalsCelda(c.nivel, c.letra, d).map(e => abrevAsig(e)).join('\n'));
                    }
                    return fila;
                });

                doc.autoTable({
                    startY: inicioY,
                    head: [cabecera],
                    body: cuerpo,
                    theme: 'grid',
                    styles: { fontSize: 4.8, cellPadding: 0.6, halign: 'center', valign: 'middle', lineColor: [148, 163, 184], lineWidth: 0.1, textColor: [15, 23, 42], overflow: 'linebreak' },
                    headStyles: { fillColor: [30, 58, 138], textColor: 255, fontStyle: 'bold', fontSize: 4.8 },
                    columnStyles: { 0: { cellWidth: 15, halign: 'left', fontStyle: 'bold', fillColor: [241, 245, 249], fontSize: 6 } },
                    margin: { left: 10, right: 10, bottom: 18 },
                    tableWidth: 'auto',
                    didParseCell: (data) => {
                        if (data.column.index === 0) return;
                        const dia = data.column.index;
                        const dow = new Date(ganttAnio, ganttMes - 1, dia).getDay();
                        const finde = (dow === 0 || dow === 6);
                        if (data.section === 'head') {
                            if (finde) { data.cell.styles.fillColor = [100, 116, 139]; }
                            return;
                        }
                        const texto = String(data.cell.raw || '').trim();
                        const cantidad = texto === '' ? 0 : texto.split('\n').length;
                        if (finde) data.cell.styles.fillColor = [226, 232, 240];
                        else if (cantidad >= 3) data.cell.styles.fillColor = [252, 165, 165];
                        else if (cantidad === 2) data.cell.styles.fillColor = [253, 211, 77];
                        else if (cantidad === 1) data.cell.styles.fillColor = [187, 247, 208];
                        if (cantidad > 0) data.cell.styles.fontStyle = 'bold';
                    }
                });

                // Simbología
                let y = (doc.lastAutoTable?.finalY || inicioY) + 6;
                const leyenda = [
                    { txt: '1 evaluación', color: [187, 247, 208] },
                    { txt: '2 evaluaciones', color: [253, 211, 77] },
                    { txt: '3 o más (sobrecarga)', color: [252, 165, 165] },
                    { txt: 'Fin de semana', color: [226, 232, 240] }
                ];
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(7);
                doc.setTextColor(15, 23, 42);
                doc.text('Simbología:', 14, y + 2.5);
                let x = 32;
                leyenda.forEach(l => {
                    doc.setFillColor(l.color[0], l.color[1], l.color[2]);
                    doc.setDrawColor(148, 163, 184);
                    doc.rect(x, y, 4, 4, 'FD');
                    doc.setFont('helvetica', 'normal');
                    doc.text(l.txt, x + 5.5, y + 3);
                    x += doc.getTextWidth(l.txt) + 14;
                });
                y += 8;
                doc.setFontSize(6.5);
                doc.setTextColor(100, 116, 139);
                doc.text('Cada celda muestra las tres primeras letras de la asignatura evaluada.', 14, y);

                // Actividades institucionales del mes
                if (eventosDelMes.length > 0) {
                    y += 7;
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8);
                    doc.setTextColor(15, 23, 42);
                    doc.text('Actividades institucionales del mes:', 14, y);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(7);
                    doc.setTextColor(51, 65, 85);
                    eventosDelMes
                        .slice()
                        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
                        .forEach(e => {
                            y += 4;
                            if (y > doc.internal.pageSize.getHeight() - 15) { doc.addPage('letter', 'landscape'); y = 20; }
                            doc.text(`•  ${formatFechaManual(e.fecha)} — e.actividad{e.cambioActividad ? ' (Cambio de actividades)' : ''}`, 16, y);
                        });
                }

                dibujarPiePDF(doc);
                doc.save(`Carta_Gantt_${MESES_NOMBRES[ganttMes - 1]}_${ganttAnio}.pdf`);
            } catch (e) {
                console.error(e);
                alert("No fue posible generar el PDF. Revise su conexión a internet e inténtelo nuevamente.");
            }
        };

        // ===== FIN LÓGICA CARTA GANTT =====

        return (
            <div className="bg-white p-8 rounded-xl border shadow-sm space-y-6">
                <h3 className="text-xl font-bold text-teal-900 border-b pb-4 flex items-center gap-2"><LucideIcon iconName="Search" size={24}/> Buscador de Calendarios de Evaluación</h3>

                {/* PESTAÑAS DE VISTA */}
                <div className="flex flex-wrap gap-2 no-print">
                    <button onClick={() => setModoVista('curso')} className={`px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-all ${modoVista === 'curso' ? 'bg-teal-700 text-white shadow-md' : 'bg-teal-50 text-teal-800 hover:bg-teal-100'}`}>
                        <LucideIcon iconName="ClipboardList" size={16}/> Calendario por Curso
                    </button>
                    <button onClick={() => setModoVista('gantt')} className={`px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-all ${modoVista === 'gantt' ? 'bg-indigo-700 text-white shadow-md' : 'bg-indigo-50 text-indigo-800 hover:bg-indigo-100'}`}>
                        <LucideIcon iconName="BarChart2" size={16}/> Carta Gantt Mensual (Todos los niveles)
                    </button>
                </div>

                                {/* MODAL DE DETALLE DE EVALUACIÓN (CARTA GANTT) */}
                {evalDetalle && (
                    <div className="modal-overlay no-print" onClick={() => setEvalDetalle(null)}>
                        <div className="bg-white p-6 rounded-xl shadow-2xl max-w-lg w-full animate-pop-in border-l-8 border-indigo-600 max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                            <div className="flex justify-between items-start border-b pb-3 mb-4">
                                <div>
                                    <h4 className="font-black text-lg text-slate-800">{evalDetalle.curso}</h4>
                                    <p className="text-xs font-bold text-indigo-600 uppercase mt-1">{formatFechaManual(evalDetalle.fecha)}</p>
                                </div>
                                <button onClick={() => setEvalDetalle(null)} className="text-gray-400 hover:text-red-500">
                                    <LucideIcon iconName="X" size={22}/>
                                </button>
                            </div>

                            <div className="space-y-4">
                                {evalDetalle.evals.map((ev, i) => (
                                    <div key={i} className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="font-black text-slate-800 text-sm uppercase">
                                                {(dbData.asignaturas || []).find(a => a.id === ev.asignaturaId)?.nombre || ev.asignaturaId}
                                            </span>
                                            <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold uppercase ${ev.estado === 'Aprobado' ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-yellow-100 text-yellow-700 border border-yellow-300'}`}>
                                                {ev.estado || 'Pendiente'}
                                            </span>
                                        </div>
                                        {ev.esElectivo && ev.nombreGrupo && (
                                            <div className="inline-block bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded mb-2 border border-purple-200">
                                                {ev.nombreGrupo}
                                            </div>
                                        )}
                                        <div className="text-xs text-slate-600 space-y-2">
                                            <div><strong className="block text-[10px] uppercase text-slate-400">Docente</strong>{ev.docente || 'No registrado'}</div>
                                            <div><strong className="block text-[10px] uppercase text-slate-400">Instrumento</strong>{ev.instrumento || '-'}</div>
                                            <div className="bg-white p-2 rounded border border-slate-200">
                                                <strong className="block text-[10px] uppercase text-slate-400 mb-1">Contenidos a evaluar</strong>
                                                <span className="whitespace-pre-wrap">{ev.contenido || 'Sin contenido especificado'}</span>
                                            </div>
                                            {ev.indicadores && ev.indicadores.length > 0 && (
                                                <div className="bg-blue-50 p-2 rounded border border-blue-100">
                                                    <strong className="block text-[10px] uppercase text-blue-500 mb-1">Indicadores</strong>
                                                    <ul className="text-[11px] text-blue-800 list-disc pl-4">
                                                        {ev.indicadores.map((ind, k) => <li key={k}>{ind}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <button onClick={() => setEvalDetalle(null)} className="mt-6 w-full bg-slate-800 text-white py-2 rounded-lg font-bold hover:bg-black transition-colors">
                                Cerrar
                            </button>
                        </div>
                    </div>
                )}

                {/* VISTA CARTA GANTT */}
                {modoVista === 'gantt' && (
                    <div className="animate-fade-in space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-indigo-50 p-4 rounded-xl border border-indigo-200 no-print">
                            <div>
                                <label className="text-[10px] font-black uppercase text-indigo-800 block mb-1">Mes</label>
                                <select className="w-full border-2 border-white p-2 rounded-lg text-sm font-bold bg-white" value={ganttMes} onChange={e => setGanttMes(parseInt(e.target.value))}>
                                    {MESES_NOMBRES.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] font-black uppercase text-indigo-800 block mb-1">Año</label>
                                <select className="w-full border-2 border-white p-2 rounded-lg text-sm font-bold bg-white" value={ganttAnio} onChange={e => setGanttAnio(parseInt(e.target.value))}>
                                    {[ganttAnio - 2, ganttAnio - 1, ganttAnio, ganttAnio + 1].filter((v, i, a) => a.indexOf(v) === i).map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] font-black uppercase text-indigo-800 block mb-1">Nivel (opcional)</label>
                                <select className="w-full border-2 border-white p-2 rounded-lg text-sm font-bold bg-white" value={ganttNivelFiltro} onChange={e => setGanttNivelFiltro(e.target.value)}>
                                    <option value="">Todos los niveles</option>
                                    {NIVELES_DEFAULT.map(n => <option key={n} value={n}>{n}</option>)}
                                </select>
                            </div>
                                                        <div className="flex items-end gap-2">
                                <button onClick={imprimirGantt} className="flex-1 bg-indigo-700 text-white px-3 py-2 rounded-lg font-bold text-xs hover:bg-indigo-800 shadow flex items-center justify-center gap-2">
                                    <LucideIcon iconName="Printer" size={16}/> Imprimir
                                </button>
                                                                <button onClick={descargarGantt} className="flex-1 bg-emerald-700 text-white px-3 py-2 rounded-lg font-bold text-xs hover:bg-emerald-800 shadow flex items-center justify-center gap-2">
                                    <LucideIcon iconName="FileDown" size={16}/> Descargar PDF
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-4 items-center text-[10px] font-bold no-print">
                            <span className="text-slate-500 uppercase">Simbología:</span>
                            <span className="flex items-center gap-1"><span className="w-4 h-4 bg-green-200 border border-slate-400 inline-block"></span> 1 evaluación</span>

        const handleSaveAsignaciones = () => { setNotification({ message: 'Asignaciones guardadas correctamente', type: 'success' }); };

        const addSello = () => { if(newSello) { setDbData(prev => ({...prev, config: {...prev.config, sellos: [...prev.config.sellos, newSello]}})); setSellos([...sellos, newSello]); setNewSello(''); }};

        const addInst = () => { if(newInst) { setDbData(prev => ({...prev, config: {...prev.config, instrumentos: [...prev.config.instrumentos, newInst]}})); setInstrumentos([...instrumentos, newInst]); setNewInst(''); }};
        const removeInst = (i) => { const nuevos = instrumentos.filter(x => x !== i); setInstrumentos(nuevos); setDbData(prev => ({...prev, config: {...prev.config, instrumentos: nuevos}})); };

        const handleLogoUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 500 * 1024) { alert("La imagen es muy grande. Por favor usa una imagen menor a 500KB."); return; }
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 150; const MAX_HEIGHT = 150;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/png');
                    setDbData(prev => ({ ...prev, config: { ...prev.config, schoolLogo: dataUrl } }));
                    setNotification({ message: 'Logo actualizado', type: 'success' });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);

            if (!unidadSelAsig || !unidadSelNivel) { alert("Seleccione Asignatura y Nivel primero."); return; }
            
            const text = bulkJsonText;
            const units = [];
            
            const parts = text.split(/UNIDAD\s+(\d+)[:\.]?/i).filter(p => p.trim());
            
            for (let i = 0; i < parts.length; i += 2) {
                const num = parts[i];
                const content = parts[i+1];
                if(!num || !content) continue;
                
                const extract = (key) => {
                    const regex = new RegExp(`${key}[:\\.]?\\s*([\\s\\S]*?)(?=(?:OA|OBJETIVOS|CONTENIDOS|ACTIVIDADES|INDICADORES|EVALUACIONES|$))`, 'i');
                    const match = content.match(regex);
                    return match ? match[1].trim() : '';
                };

                let nombre = content.split('\n')[0].replace(/[:\.]/, '').trim();
                const oa = extract('OA') || extract('OBJETIVOS');
                const contenidos = extract('CONTENIDOS');
                const actividades = extract('ACTIVIDADES');
                const indicadores = extract('INDICADORES');
                const evalsMatch = content.match(/EVALUACIONES[:\.]?\s*(\d+)/i);
                const numEvals = evalsMatch ? parseInt(evalsMatch[1]) : 1;

                units.push({
                    unidad: parseInt(num),
                    descripcion: nombre,
                    oa: oa,
                    contenidos: contenidos,
                    actividades: actividades,
                    indicadores: indicadores,
                    numEvals: numEvals
                });
            }

            if (units.length === 0) { alert("No se detectaron unidades. Use el formato:\nUNIDAD 1: Nombre\nOA: ...\nCONTENIDOS: ..."); return; }

            const year = getAcademicYear();
            const cronoKey = `unidadSelAsig-{unidadSelNivel}-${year}`;

                let newPlans = [...(prev.planificaciones || [])];

                    newPlans.push({
                        key: planKey, cronogramaKey: cronoKey, unidadNumero: item.unidad, folio: (prev.config.lastFolio || 0) + item.unidad,
                        descripcion: item.descripcion || `Unidad ${item.unidad}`, oaGlobal: item.oa || '', contenidosBase: item.contenidos || '',

                    });
                });
                return { ...prev, planificaciones: newPlans };
            });

            setBulkJsonText('');
        };

        };

        const existingPlans = (dbData.planificaciones || []).filter(p => p.cronogramaKey === `unidadSelAsig-{unidadSelNivel}-${getAcademicYear()}`).sort((a,b) => a.unidadNumero - b.unidadNumero);
        const getStatsData = () => {

                   {!isCoordinator && <button onClick={() => setTab('gestion')} className={`pb-3 font-bold border-b-2 px-4 ${tab === 'gestion' ? 'border-orange-600 text-orange-900' : 'border-transparent text-slate-400'}`}>Gestión Académica</button>}
                   <button onClick={() => setTab('reportes')} className={`pb-3 font-bold border-b-2 px-4 ${tab === 'reportes' ? 'border-orange-600 text-orange-900' : 'border-transparent text-slate-400'}`}>Reportes</button>

{/* Punto 2: Panel de Aprobación/Rechazo de Evaluaciones (ahora con aprobación masiva y ciclos corregidos) */}
{gestionTab === 'aprobaciones' && (

)}


             {/* Módulo de Materiales - Reparado: Botón inteligente y nombres de electivos completos */}
{gestionTab === 'materiales' && (() => {
    
   // Función de Eliminación Real (Segura contra colisiones en Firebase)

            // Usa arrayRemove para quitar exactamente este material directamente en la nube

                                    // Crear etiqueta visual clara y completa

                                    if (a.esElectivo) {
                                        label = `[Electivo] ${a.nombreGrupo || 'Sin Grupo'} - nombreAsignatura({a.nivel})`;
                                    } else {
                                        label = `${a.nivel} ${a.letra} - ${nombreAsignatura}`;
                                    }

                                    // Evitar duplicados
                                    if (!vistas.has(label)) {
                                        vistas.add(label);
                                        opciones.push(label);
                                    }
                                });
                                
                                return opciones.sort().map(opcion => (
                                    <label key={opcion} className={`flex items-center gap-2 cursor-pointer px-3 py-2 rounded-md border-2 transition-all ${matsSelectedLetras.includes(opcion) ? 'bg-teal-50 border-teal-500 shadow-sm' : 'bg-slate-50 border-transparent hover:border-teal-300'}`}>
                                        <input 
                                            type="checkbox" 
                                            className="w-4 h-4 accent-teal-600 cursor-pointer" 
                                            checked={matsSelectedLetras.includes(opcion)}
                                            onChange={(e) => { 
                                                if(e.target.checked) setMatsSelectedLetras([...matsSelectedLetras, opcion]); 
                                                else setMatsSelectedLetras(matsSelectedLetras.filter(l => l !== opcion)); 
                                            }}

                                        <span className={`font-bold text-xs ${matsSelectedLetras.includes(opcion) ? 'text-teal-800' : 'text-slate-600'}`}>
                                            {opcion}
                                        </span>
                                    </label>
                                ));
                            })()}

                    <div className="lg:col-span-2">

                    </div>
                    <div>
                        <label className="text-[10px] font-black block mb-1 uppercase text-slate-600">Copias</label>
                        <input id="inputMatCant" type="number" className="w-full border-2 border-slate-200 p-2 rounded text-sm text-center" />
                    </div>
                    <div>
                        <label className="text-[10px] font-black block mb-1 uppercase text-slate-600">Págs/Copia</label>
                        <input id="inputMatHojas" type="number" className="w-full border-2 border-slate-200 p-2 rounded text-sm text-center" defaultValue="1" />
                    </div>
                    
                    {/* OPCIÓN: SOLO DIGITAL */}
                    <div className="lg:col-span-4 bg-indigo-50 p-3 rounded-lg border border-indigo-200 flex items-center gap-3">
                        <input type="checkbox" id="chkDigital" className="w-6 h-6 accent-indigo-600" checked={isDigitalMaterial} onChange={(e) => setIsDigitalMaterial(e.target.checked)} />
                        <div><label htmlFor="chkDigital" className="font-bold text-indigo-900 text-sm block cursor-pointer">SOLO DIGITAL (No Imprimir)</label><p className="text-xs text-indigo-700">Se guardará en el registro del docente pero NO aparecerá en Imprenta.</p></div>
                    </div>
                    
                    <div className="lg:col-span-4 flex justify-end mt-2">
                        <button onClick={() => {
                            const d = document.getElementById('inputMatDoc').value; 
                            const uSelect = document.getElementById('inputMatUnidad'); 
                            const u = uSelect.value; 
                            const f = document.getElementById('inputMatFecha').value; 
                            const t = document.getElementById('inputMatTipo').value; 
                            const c = parseInt(document.getElementById('inputMatCant').value) || 0; 
                            const h = parseInt(document.getElementById('inputMatHojas').value) || 0; 
                            const totalCalculado = c * h;
                            
                            if(d && t && (c > 0 || isDigitalMaterial) && matsSelectedLetras.length > 0) {
                                // Al guardar, unimos los nombres completos de los cursos/electivos
                                const cursoNivelCompleto = matsSelectedLetras.sort().join(" / ");
                                const newId = "mat_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
                                const reg = { 
                                    id: newId, docente: d, unidadKey: u, tipo: t, fecha: f, 
                                    cantidad: c, hojasPorCopia: h, totalHojas: totalCalculado, 
                                    cursos: cursoNivelCompleto, 
                                    registradoPor: user.name, autorizadoPor: user.name, 
                                    estado: 'Pendiente', esDigital: isDigitalMaterial, archivado: false 
                                };
                                
                                if (typeof db !== 'undefined') {
    const baseRef = db.collection('artifacts').doc(typeof __app_id !== 'undefined' ? __app_id : 'colegio-marina-produccion').collection('public').doc('data');
    baseRef.collection('main').doc('config_general').update({
        "config.materialesUso": firebase.firestore.FieldValue.arrayUnion(reg)
    }).then(() => {
        if(setNotification) setNotification({message: 'Material ingresado sin colisiones', type: 'success'});
    });
}
                                document.getElementById('inputMatTipo').value = ''; 
                                document.getElementById('inputMatCant').value = ''; 
                                setMatsSelectedLetras([]); 
                                setIsDigitalMaterial(false);
                            } else {
                                alert("Faltan datos obligatorios o seleccionar al menos un curso.");
                            }
                        }} className="bg-teal-600 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-teal-700 transition-all flex items-center gap-2">
                            <LucideIcon iconName="Save" size={20}/> Guardar Registro
                        </button>
                    </div>
                </div>
            </div>

            {/* TABLA PRINCIPAL (Solo Activos) */}
            <h5 className="font-bold text-slate-700 text-sm uppercase border-b pb-2">Material Activo</h5>
            
            <div className="space-y-4 no-print-pdf mt-4">
                {(() => {
                    const listaActiva = (dbData.config.materialesUso || []).filter(m => !m.archivado)
                        .sort((a, b) => {
                            const fechaA = new Date(a.fecha);
                            const fechaB = new Date(b.fecha);
                            if (fechaB - fechaA !== 0) return fechaB - fechaA;
                            return a.docente.localeCompare(b.docente);
                        });

                    if (listaActiva.length === 0) return <div className="p-10 text-center text-gray-400 italic border-2 border-dashed rounded-lg">No existen registros activos.</div>;

                    const gruposPorMes = {};
                    listaActiva.forEach(m => {
                        const mesKey = m.fecha.substring(0, 7);
                        if (!gruposPorMes[mesKey]) gruposPorMes[mesKey] = [];
                        gruposPorMes[mesKey].push(m);
                    });

                    const mesesOrdenados = Object.keys(gruposPorMes).sort().reverse();
                    const mesActualKey = new Date().toISOString().substring(0, 7);

                    return mesesOrdenados.map(mesKey => {
                        const itemsMes = gruposPorMes[mesKey];
                        const nombreMes = new Date(mesKey + "-02T12:00:00").toLocaleString('es-CL', { month: 'long', year: 'numeric' }).toUpperCase();
                        const esMesActual = mesKey === mesActualKey;

                        return (
                            <details key={mesKey} open={esMesActual} className="group border border-slate-300 rounded-lg bg-white overflow-hidden shadow-sm">
                                <summary className={`cursor-pointer p-3 flex justify-between items-center select-none transition-colors ${esMesActual ? 'bg-teal-700 text-white hover:bg-teal-800' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>
                                    <div className="flex items-center gap-2 font-bold">
                                        <LucideIcon iconName={esMesActual ? "Calendar" : "Archive"} size={18} />
                                        <span>{nombreMes}</span>
                                        <span className="ml-2 text-[10px] bg-black/20 px-2 py-0.5 rounded-full text-white">{itemsMes.length} Solicitudes</span>
                                    </div>
                                    <div className="text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">
                                        {esMesActual ? 'MES EN CURSO (ABIERTO)' : 'MES PASADO (CLICK PARA VER)'}
                                        <LucideIcon iconName="ChevronDown" size={14} className="group-open:rotate-180 transition-transform"/>
                                    </div>
                                </summary>

                                <div className="overflow-x-auto border-t border-slate-200">
                                    <table className="w-full text-xs border-collapse">
                                        <thead className="bg-slate-50 text-slate-600 font-bold uppercase border-b">
                                            <tr>
                                                <th className="p-3 text-left w-24">Fecha</th>
                                                <th className="p-3 text-left">Solicitante</th>
                                                <th className="p-3 text-left">Autorizado Por</th>
                                                <th className="p-3 text-left">Detalle Material</th>
                                                <th className="p-3 text-center">Tipo</th>
                                                <th className="p-3 text-center">Copias</th>
                                                <th className="p-3 text-center bg-slate-100">Total Hojas</th>
                                                <th className="p-3 text-center">Estado</th>
                                                <th className="p-3 text-center">Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {itemsMes.map((m, idx) => (
                                                <tr key={m.id || idx} className="hover:bg-yellow-50 transition-colors">
                                                    <td className="p-3 font-medium text-slate-500">{formatFechaManual(m.fecha)}</td>
                                                    <td className="p-3"><div className="font-bold text-teal-900 uppercase">{m.docente}</div></td>
                                                    <td className="p-3 text-[10px] font-bold text-slate-500 uppercase">{m.autorizadoPor || m.registradoPor || "Sistema"}</td>
                                                    <td className="p-3">
                                                        <div className="font-bold text-slate-700">{m.tipo}</div>
                                                        <div className="text-[10px] text-teal-600 font-bold uppercase">{m.cursos}</div>
                                                    </td>
                                                    <td className="p-3 text-center">{m.esDigital ? <span className="text-indigo-600 font-bold text-[10px]">DIGITAL</span> : "PAPEL"}</td>
                                                    <td className="p-3 text-center">{m.cantidad}</td>
                                                    <td className="p-3 text-center font-bold bg-slate-50 text-slate-800">{m.totalHojas}</td>
                                                    <td className="p-3 text-center">
                                                        {m.esDigital ? <span className="text-gray-300">-</span> : (m.estado === 'Listo para Retiro' ? 
                                                            <span className="text-[9px] font-bold text-green-700 bg-green-100 px-2 py-1 rounded border border-green-200">✓ LISTO</span> : 
                                                            <span className="text-[9px] font-bold text-orange-700 bg-orange-100 px-2 py-1 rounded border border-orange-200">⌛ PENDIENTE</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <DeleteButton onClick={() => executeDeleteMaterial(m)} />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </details>
                        );
                    });
                })()}
            </div>

            {/* TABLA HISTORIAL DETALLADO DE CONSUMO */}
            <div className="mt-8 no-print-pdf animate-fade-in">
                <h5 className="font-bold text-xs uppercase text-slate-800 mb-4 border-b-2 border-slate-800 pb-1 tracking-widest">
                    Historial Detallado de Consumo
                </h5>
                
                <div className="overflow-hidden border border-slate-400 rounded-lg shadow-sm">
                    <table className="w-full text-[10px] border-collapse bg-white">
                        <thead className="bg-slate-100 text-black font-bold uppercase border-b border-slate-400">
                            <tr>
                                <th className="p-2 text-left border-r border-slate-300">Fecha</th>
                                <th className="p-2 text-left border-r border-slate-300">Docente Solicitante</th>
                                <th className="p-2 text-left border-r border-slate-300">Detalle / Nivel y Curso</th>
                                <th className="p-2 text-center border-r border-slate-300">Copias</th>
                                <th className="p-2 text-center bg-slate-200 border-r border-slate-300">Total Hojas</th>
                                <th className="p-2 text-center text-red-600 font-black">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            {(!dbData.config.materialesUso || dbData.config.materialesUso.length === 0) ? (
                                <tr><td colSpan="6" className="p-10 text-center text-gray-400 italic">No existen registros.</td></tr>
                            ) : (
                                dbData.config.materialesUso.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).map((m, idx) => (
                                    <tr key={idx} className="border-b border-slate-300 hover:bg-yellow-50 transition-colors">
                                        <td className="p-2 border-r border-slate-300">{formatFechaManual(m.fecha)}</td>
                                        <td className="p-2 font-bold uppercase border-r border-slate-300">{m.docente}</td>
                                        <td className="p-2 border-r border-slate-300">
                                            <div className="font-black uppercase">{m.tipo}</div>
                                            <div className="text-[9px] text-teal-700 font-bold mt-1 leading-tight">{m.cursos || "N/A"}</div>
                                        </td>
                                        <td className="p-2 text-center border-r border-slate-300">{m.cantidad || 0}</td>
                                        <td className="p-2 text-center font-bold bg-slate-50 border-r border-slate-300">{m.totalHojas || 0}</td>
                                        <td className="p-2 text-center flex justify-center">
                                            <DeleteButton onClick={() => executeDeleteMaterial(m)} />
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* ZONA DE IMPRESIÓN (OCULTA EN PANTALLA) */}
            <div id="print-resumen-materiales" className="hidden print:block mt-8 bg-white p-4">
                <OfficialHeader user={user} context={{ nivel: "General", letra: "Institucional" }} docTitle="Reporte de Consumo de Recursos" logoUrl={dbData.config.schoolLogo} />
                <table className="w-full text-[10px] border-collapse bg-white border border-black mt-4">
                    <thead className="bg-slate-100 font-bold uppercase">
                        <tr>
                            <th className="p-2 border border-black">Fecha</th>
                            <th className="p-2 border border-black">Docente</th>
                            <th className="p-2 border border-black">Material</th>
                            <th className="p-2 border border-black text-center">Tipo</th>
                            <th className="p-2 border border-black text-center">Total Hojas</th>
                        </tr>
                    </thead>
                    <tbody>
                        {(dbData.config.materialesUso || []).filter(m => !m.archivado).map((m, idx) => (
                            <tr key={idx}>
                                <td className="p-2 border border-black">{formatFechaManual(m.fecha)}</td>
                                <td className="p-2 border border-black font-bold">{m.docente}</td>
                                <td className="p-2 border border-black">{m.tipo} <br/><span className="text-[9px]">{m.cursos}</span></td>
                                <td className="p-2 border border-black text-center">{m.esDigital ? "DIGITAL" : "PAPEL"}</td>
                                <td className="p-2 border border-black text-center font-bold">{m.totalHojas}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
})()}


{/* --- NUEVO MÓDULO: GESTIÓN DE REQUERIMIENTOS ESPECIALES --- */}
{gestionTab === 'req_especiales' && (() => {
    const getTeacherForPlan = (plan) => {
        const asig = (dbData.asignaciones || []).find(a => {
            if (plan.nombreGrupo || plan.key.includes('GLOBAL') || plan.key.includes('GRUPO')) {
                return a.esElectivo && plan.key.includes(a.nombreGrupo || '');
            }
            const pAsigId = plan.key.split('-')[0];
            const pNivel = plan.cronogramaKey ? plan.cronogramaKey.split('-')[1] : '';
            return a.asignaturaId === pAsigId && a.nivel === pNivel && a.letra === plan.letra;
        });
        if (asig) {
            const userObj = dbData.users.find(u => u.uid === asig.docenteId);
            return userObj ? userObj.name : 'Desconocido';
        }
        return 'Desconocido';
    };

    const requerimientos = [];
    (dbData.planificaciones || []).forEach(plan => {
        const docente = getTeacherForPlan(plan);
        const asignatura = dbData.asignaturas.find(a => a.id === plan.key.split('-')[0])?.nombre || plan.key.split('-')[0];
        const curso = plan.letra ? `${plan.cronogramaKey?.split('-')[1] || ''} ${plan.letra}` : (plan.nombreGrupo || "Electivo");

        (plan.sesiones || []).forEach((sesion, sIdx) => {
            if (sesion.recursosEspeciales && sesion.recursosEspeciales.trim() !== "") {
                requerimientos.push({
                    planKey: plan.key,
                    sesionIdx: sIdx,
                    fechaSolicitud: plan.history && plan.history.length > 0 ? plan.history[plan.history.length - 1].date : 'Fecha de guardado',
                    fechaUso: sesion.fechaRecursos || '',
                    requerimiento: sesion.recursosEspeciales,
                    docente: docente,
                    curso: curso,
                    asignatura: asignatura,
                    estado: sesion.estadoRecurso || 'Pendiente',
                    unidad: plan.unidadNumero,
                    claseNum: sesion.n
                });
            }
        });
    });

    // Ordenar por fecha de uso (más próximos primero)
    requerimientos.sort((a, b) => {
        if (!a.fechaUso) return 1;
        if (!b.fechaUso) return -1;
        return new Date(a.fechaUso) - new Date(b.fechaUso);
    });

    const cambiarEstadoRequerimiento = (planKey, sesionIdx, nuevoEstado) => {
        setDbData(prev => {
            const newPlans = [...(prev.planificaciones || [])];
            const planIndex = newPlans.findIndex(p => p.key === planKey);
            if (planIndex >= 0) {
                const planCopy = { ...newPlans[planIndex] };
                const sesionesCopy = [...planCopy.sesiones];
                sesionesCopy[sesionIdx] = {
                    ...sesionesCopy[sesionIdx],
                    estadoRecurso: nuevoEstado
                };
                planCopy.sesiones = sesionesCopy;
                newPlans[planIndex] = planCopy;
            }
            return { ...prev, planificaciones: newPlans };
        });
        if(setNotification) setNotification({message: 'Estado logístico actualizado en la planificación del docente.', type: 'success'});
    };

    return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm animate-fade-in">
            <div className="flex justify-between items-center border-b pb-4 mb-6">
                <div>
                    <h4 className="font-black text-slate-800 text-xl flex items-center gap-2">
                        <LucideIcon iconName="Bus" size={28} className="text-orange-500"/> 
                        Gestión de Requerimientos Especiales y Salidas
                    </h4>
                    <p className="text-xs text-slate-500 mt-1">Extraído automáticamente de las planificaciones de los docentes.</p>
                </div>
            </div>
            
            <div className="overflow-x-auto border border-slate-200 rounded-lg">
                <table className="w-full text-sm text-left border-collapse">
                    <thead className="bg-slate-800 text-white font-bold text-xs uppercase tracking-wider">
                        <tr>
                            <th className="p-3 border-b border-slate-700">Fechas</th>
                            <th className="p-3 border-b border-slate-700">Requerimiento Especial</th>
                            <th className="p-3 border-b border-slate-700">Docente / Curso</th>
                            <th className="p-3 border-b border-slate-700 text-center w-56">Gestión (Estado)</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 bg-slate-50">
                        {requerimientos.length === 0 ? (
                            <tr>
                                <td colSpan="4" className="p-10 text-center text-slate-400 italic">No hay requerimientos especiales solicitados en este momento.</td>
                            </tr>
                        ) : (
                            requerimientos.map((req, idx) => (
                                <tr key={`req.planKey-{req.sesionIdx}`} className="hover:bg-orange-50 transition-colors">
                                    <td className="p-3">
                                        <div className="font-black text-orange-700 text-base">{req.fechaUso ? formatFechaManual(req.fechaUso) : 'Sin fecha uso'}</div>
                                        <div className="text-[10px] text-slate-500 mt-1 uppercase font-bold">Solicitado: {req.fechaSolicitud}</div>
                                    </td>
                                    <td className="p-3">
                                        <div className="font-bold text-slate-800 text-sm whitespace-pre-wrap">{req.requerimiento}</div>
                                        <div className="text-[10px] text-slate-500 mt-1 bg-slate-200 inline-block px-2 py-0.5 rounded-full font-bold">Unidad {req.unidad} - Clase {req.claseNum}</div>
                                    </td>
                                    <td className="p-3">
                                        <div className="font-bold text-teal-900 uppercase">{req.docente}</div>
                                        <div className="text-xs text-teal-600 font-bold">{req.asignatura}</div>
                                        <div className="text-[10px] text-slate-500">{req.curso}</div>
                                    </td>
                                    <td className="p-3 bg-white border-l border-slate-100">
                                        <select 
                                            value={req.estado}
                                            onChange={(e) => cambiarEstadoRequerimiento(req.planKey, req.sesionIdx, e.target.value)}
                                            className={`w-full p-2 border-2 rounded-lg text-[10px] font-black outline-none cursor-pointer transition-colors uppercase shadow-sm ${
                                                req.estado === 'Disponible para uso' ? 'bg-green-50 text-green-800 border-green-400' :
                                                req.estado === 'Solicitado al SLEP' ? 'bg-blue-50 text-blue-800 border-blue-400' :
                                                req.estado === 'Rechazada' ? 'bg-red-50 text-red-800 border-red-400' :
                                                'bg-yellow-50 text-yellow-800 border-yellow-400'
                                            }`}
                                        >
                                            <option value="Pendiente">⏳ PENDIENTE</option>
                                            <option value="Solicitado al SLEP">🏢 SOLICITADO AL SLEP</option>
                                            <option value="Disponible para uso">✅ DISPONIBLE</option>
                                            <option value="Rechazada">❌ RECHAZADA</option>
                                        </select>
                                    </td>
                                </tr>
                            ))
                        )}
                    </tbody>
                </table>
            </div>
        </div>
    );
})()}

                       {gestionTab === 'carga' && (
                           <div className="space-y-6">
                                <div className="flex gap-4 mb-4 items-center bg-orange-50 p-4 rounded-xl border border-orange-100 flex-wrap">
                                    <select className="border p-2 rounded w-full md:w-auto" onChange={e=>setCargaSelDocente(e.target.value)}><option value="">1. Docente/Coord...</option>{dbData.users.filter(u=>u.role===ROLES.DOCENTE || u.role===ROLES.COORDINADOR).map(u=><option key={u.uid} value={u.uid}>{u.name} ({u.role})</option>)}</select>
                                    <label className="flex items-center gap-1 text-sm font-bold"><input type="checkbox" checked={isElectivo} onChange={e=>setIsElectivo(e.target.checked)}/> Es Electivo?</label>{isElectivo && <input className="border p-2 rounded" placeholder="Nombre Grupo" value={nombreGrupo} onChange={e=>setNombreGrupo(e.target.value)} />}
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border mb-4">
                                    <h5 className="font-bold text-slate-600 mb-2">2. Seleccionar Asignatura</h5>
                                    <div className="flex flex-wrap gap-2">
                                        {dbData.asignaturas.map(a => (
                                            <button 
                                                key={a.id} 
                                                onClick={() => toggleAsignaturaSelection(a.id)}
                                                className={`px-4 py-2 rounded-full border text-xs font-bold transition-all ${selectedAsignaturas.includes(a.id) ? 'bg-teal-600 text-white border-teal-700 shadow-md transform scale-105' : 'bg-white text-gray-500 border-gray-200 hover:border-teal-300'}`}
                                            >
                                                {a.nombre}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                               {cargaSelDocente && selectedAsignaturas.length > 0 && (
                                    <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                                        <div className="p-3 bg-slate-100 font-bold text-slate-600 text-sm grid grid-cols-4 gap-4"><div>Nivel</div>{['A','B','C'].map(l=><div key={l} className="text-center">{l}</div>)}</div>
