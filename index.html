                                                    <span className="min-w-0">
                                                        <span className="font-bold text-slate-800 block break-words">{u.name}</span>
                                                        <span className="text-[10px] text-slate-500">{u.role}{u.depto ? ` · ${u.depto}` : ''}</span>
                                                    </span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* 2. Firmante externo */}
                                <div>
                                    <h4 className="text-xs font-black uppercase text-slate-600 mb-2">2. Agregar otra persona (opcional)</h4>
                                    <div className="flex flex-wrap gap-2">
                                        <input className="border p-2 rounded text-xs flex-1 min-w-[160px]" placeholder="Nombre completo" value={repManualNombre} onChange={e => setRepManualNombre(e.target.value)} />
                                        <input className="border p-2 rounded text-xs flex-1 min-w-[160px]" placeholder="Cargo (ej: Supervisor SLEP)" value={repManualCargo} onChange={e => setRepManualCargo(e.target.value)} />
                                        <button type="button" onClick={agregarFirmanteManual} className="bg-teal-600 text-white px-4 rounded text-xs font-bold hover:bg-teal-700">Agregar</button>
                                    </div>
                                </div>

                                {/* 3. Orden y cargo */}
                                <div>
                                    <h4 className="text-xs font-black uppercase text-slate-600 mb-2">3. Orden y cargo de las firmas ({repFirmantes.length})</h4>
                                    {repFirmantes.length === 0 ? (
                                        <p className="text-xs italic text-slate-400 border-2 border-dashed rounded-lg p-3 text-center">Aún no hay firmantes seleccionados.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {repFirmantes.map((f, idx) => (
                                                <div key={f.id} className="flex flex-wrap items-center gap-2 bg-white border rounded-lg p-2">
                                                    <span className="text-[10px] font-black bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center shrink-0">{idx + 1}</span>
                                                    <span className="text-xs font-bold text-slate-800 flex-1 min-w-[140px] break-words">{f.nombre}</span>
                                                    <input className="border p-1.5 rounded text-xs flex-1 min-w-[160px]" value={f.cargo} onChange={e => actualizarCargo(f.id, e.target.value)} placeholder="Cargo que aparecerá bajo la firma" />
                                                    <div className="flex gap-1 shrink-0">
                                                        <button type="button" onClick={() => moverFirmante(idx, -1)} className="p-1 border rounded hover:bg-slate-100" title="Subir"><LucideIcon iconName="ArrowUp" size={14}/></button>
                                                        <button type="button" onClick={() => moverFirmante(idx, 1)} className="p-1 border rounded hover:bg-slate-100" title="Bajar"><LucideIcon iconName="ArrowDown" size={14}/></button>
                                                        <button type="button" onClick={() => quitarFirmante(f.id)} className="p-1 border border-red-200 text-red-500 rounded hover:bg-red-50" title="Quitar"><LucideIcon iconName="X" size={14}/></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                                                {/* 4. Opciones */}
                                <div className="space-y-2">
                                    <h4 className="text-xs font-black uppercase text-slate-600">4. Opciones del informe</h4>
                                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer">
                                        <input type="checkbox" checked={repIncluirVacios} onChange={e => setRepIncluirVacios(e.target.checked)} /> Incluir instrumentos y cursos aún sin registro (sin documento)
                                    </label>
                                    {/* NUEVO: respaldo de la retroalimentación entregada */}
                                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer">
                                        <input type="checkbox" checked={repIncluirComentarios} onChange={e => setRepIncluirComentarios(e.target.checked)} /> Incluir los comentarios dejados a los docentes (respaldo)
                                    </label>
                                    <textarea className="w-full border p-2 rounded text-xs h-20 resize-none" placeholder="Observaciones generales del monitoreo (opcional)..." value={repObservaciones} onChange={e => setRepObservaciones(e.target.value)} />
                                </div>

                                {repError && (
                                    <div className="text-xs font-bold text-red-700 bg-red-50 border border-red-200 rounded p-2">{repError}</div>
                                )}
                            </div>

                            <div className="p-4 border-t bg-slate-50 flex justify-end gap-2 shrink-0">
                                <button type="button" onClick={() => setShowReporte(false)} disabled={repGenerando} className="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-bold text-sm hover:bg-gray-300 disabled:opacity-50">Cancelar</button>
                                <button type="button" onClick={generarReportePDF} disabled={repGenerando} className="px-5 py-2 rounded-lg bg-teal-600 text-white font-bold text-sm hover:bg-teal-700 disabled:opacity-50 flex items-center gap-2">
                                    <LucideIcon iconName="FileDown" size={16}/> {repGenerando ? 'Generando...' : 'Generar PDF'}
                                </button>
                            </div>
                        </div>
                    </div>,
                    document.body
                )}

                {/* VISOR DEL INSTRUMENTO: se abre siempre al centro de la pantalla */}
                {visor && ReactDOM.createPortal(
                    <div className="modal-overlay" style={{ zIndex: 80 }} onClick={() => setVisor(null)}>
                        <div className="bg-white rounded-xl shadow-2xl flex flex-col animate-pop-in overflow-hidden" style={{ width: '95vw', maxWidth: '1100px', height: '90vh' }} onClick={e => e.stopPropagation()}>
                            <div className="p-4 border-b flex justify-between items-start gap-3 shrink-0">
                                <div className="min-w-0">
                                    <h3 className="font-black text-lg text-slate-800 break-words">
                                        {visor.item.tipo === 'crono' ? 'Cronograma anual' : `Unidad ${visor.item.numero}: ${visor.item.nombre}`}
                                    </h3>
                                    <p className="text-xs text-slate-500 font-bold uppercase break-words">{visor.fila.docente.name} · {visor.fila.asignatura} · {visor.fila.curso}</p>
                                    <div className="mt-2 flex gap-2 flex-wrap">
                                        <span className={`text-[10px] px-2 py-0.5 rounded border font-bold uppercase ${estadoVisual(visor.item).clase}`}>{estadoVisual(visor.item).texto}</span>
                                        {visor.item.registro?.monitoreado && (
                                            <span className="text-[10px] px-2 py-0.5 rounded border border-teal-300 bg-teal-50 text-teal-800 font-bold">
                                                ✓ Monitoreado por {visor.item.registro.monitoreadoPor} ({visor.item.registro.fechaMonitoreo})
                                            </span>
                                        )}
                                    </div>
                                </div>
                                <button onClick={() => setVisor(null)} className="text-gray-400 hover:text-red-500 shrink-0"><LucideIcon iconName="X" size={24}/></button>
                            </div>

                            <div className="flex gap-1 px-4 pt-2 border-b bg-slate-50 shrink-0 overflow-x-auto">
                                {visor.item.registro?.documentoExterno && botonPestana('drive', '📎 Documento en Drive')}
                                {visor.item.hayContenido && botonPestana('plataforma', '🗂️ Registro en la plataforma')}
                                {botonPestana('comentarios', `💬 Comentarios (${(visor.item.registro?.comments || []).length})`)}
                            </div>

                            <div className="flex-1 min-h-0 overflow-y-auto p-4">
                                {pestanaVisor === 'drive' && visor.item.registro?.documentoExterno && (
                                    <div className="h-full flex flex-col gap-2">
                                        <div className="flex justify-between items-center gap-2 flex-wrap">
                                            <span className="text-xs font-bold text-sky-900 truncate min-w-0">📎 {visor.item.registro.documentoExterno.nombreOriginal || visor.item.registro.documentoExterno.nombre}</span>
                                            <a href={visor.item.registro.documentoExterno.url} target="_blank" rel="noopener noreferrer" className="bg-green-600 text-white px-3 py-1 rounded text-[11px] font-bold shrink-0">Abrir en Drive</a>
                                        </div>
                                        {visor.item.registro.documentoExterno.fileId ? (
                                            <iframe
                                                title="Vista previa del documento"
                                                src={`https://drive.google.com/file/d/${visor.item.registro.documentoExterno.fileId}/preview`}
                                                className="w-full flex-1 rounded border"
                                                style={{ minHeight: '380px' }}
                                            ></iframe>
                                        ) : (
                                            <p className="text-xs italic text-slate-400">No hay vista previa disponible. Use "Abrir en Drive".</p>
                                        )}
                                        <p className="text-[10px] text-slate-400">Si la vista previa no carga, presione "Abrir en Drive" con su cuenta institucional.</p>
                                    </div>
                                )}

                                {pestanaVisor === 'plataforma' && renderContenidoPlataforma(visor.item)}

                                {pestanaVisor === 'comentarios' && (
                                    (visor.item.registro?.comments || []).length === 0 ? (
                                        <p className="text-xs italic text-slate-400">Aún no hay comentarios.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {visor.item.registro.comments.map((c, i) => (
                                                <div key={i} className="bg-yellow-50 border border-yellow-200 p-2 rounded text-xs break-words">
                                                    <strong>{c.author}</strong> <span className="text-gray-400">({c.date})</span>: {c.text}
                                                </div>
                                            ))}
                                        </div>
                                    )
                                )}
                            </div>

                            <div className="p-4 border-t bg-slate-50 shrink-0">
                                                               {puedeMonitorear ? (
                                    <>
                                        {!visor.item.hayContenido && (
                                            <p className="text-[11px] font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded p-2 mb-2">
                                                Este instrumento aún no tiene documento. Puede dejar un comentario para orientar al docente; no quedará marcado como monitoreado.
                                            </p>
                                        )}
                                        <textarea className="w-full border p-2 rounded text-xs mb-3 h-12 resize-none" placeholder={visor.item.hayContenido ? 'Comentario breve para el docente (opcional)...' : 'Escriba aquí el comentario para el docente...'} value={comentario} onChange={e => setComentario(e.target.value)} />
                                        <div className="flex flex-wrap gap-2 justify-end">
                                            <button onClick={() => ejecutarDesdeVisor('Comentar')} className="bg-amber-500 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-amber-600">💬 Solo comentar</button>
                                            {visor.item.hayContenido && (
                                                <>
                                                    <button onClick={() => ejecutarDesdeVisor('Visto')} className="bg-teal-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-teal-700">✓ Marcar monitoreado</button>
                                                    <button onClick={() => ejecutarDesdeVisor('Aprobado')} className="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-700">Aprobar</button>
                                                    <button onClick={() => ejecutarDesdeVisor('Modificar')} className="bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-orange-600">Solicitar modificación</button>
                                                    <button onClick={() => ejecutarDesdeVisor('Rechazado')} className="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-red-700">Rechazar</button>
                                                </>
                                            )}
                                            <button onClick={() => setVisor(null)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-300">Cerrar</button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-500 italic">Vista de solo lectura.</span>
                                        <button onClick={() => setVisor(null)} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold">Cerrar</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>,
                    document.body
                )}
            </div>
        );
    };

    // ==========================================
    // NUEVO: GESTIÓN DE EVALUACIONES POR CICLO (con aprobación masiva)
    // ==========================================
    const GestionEvaluacionesCiclo = ({ user, dbData, setDbData, setNotification }) => {
        const [ciclo, setCiclo] = useState('c1');
        const [seleccion, setSeleccion] = useState([]);
        const [motivoMasivo, setMotivoMasivo] = useState('');
        const [procesando, setProcesando] = useState(false);
        const [dialogo, setDialogo] = useState(null);
        const [mensajeError, setMensajeError] = useState('');

        const normalizar = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const getCicloDeNivel = (nivel) => {
            const n = normalizar(nivel);
            const num = parseInt((n.match(/\d+/) || [])[0], 10);
            if (!num) return 'otro';
            if (n.includes('basic')) return num <= 4 ? 'c1' : (num <= 8 ? 'c2' : 'otro');
            if (n.includes('medio')) return num <= 4 ? 'm' : 'otro';
            return 'otro';
        };
        const fechaOrden = (f) => { const t = new Date(String(f || '').substring(0, 10) + 'T12:00:00').getTime(); return isNaN(t) ? 0 : t; };
        const refEvaluaciones = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('data_evaluaciones');

        const todas = (dbData.evaluaciones || []).filter(ev => ev && typeof ev === 'object' && ev.id);
        const esPendiente = (ev) => !ev.estado || ev.estado === 'Pendiente';

        const agruparElectivos = (evals) => {
            const unicas = [];
            const vistas = new Set();
            evals.forEach(ev => {
                if (ev.esElectivo && ev.nombreGrupo) {
                    const key = `ev.fecha-{ev.asignaturaId}-${ev.nombreGrupo}`;
                    if (vistas.has(key)) return;
                    vistas.add(key);
                    const txt = (Array.isArray(ev.nivelesAplicables) && Array.isArray(ev.letrasAplicables))
                        ? `ev.nivelesAplicables.join(',')({ev.letrasAplicables.join(', ')})` : 'Múltiples cursos';
                    unicas.push({ ...ev, textoCursosAgrupados: txt });
                } else {
                    unicas.push({ ...ev, textoCursosAgrupados: `${ev.nivel || ''} ${ev.letra || ''}`.trim() || 'Curso no indicado' });
                }
            });
            return unicas;
        };

        const idsRelacionados = (ev) => (ev.esElectivo && ev.nombreGrupo)
            ? todas.filter(e => e.esElectivo && e.nombreGrupo === ev.nombreGrupo && e.fecha === ev.fecha && e.asignaturaId === ev.asignaturaId).map(e => e.id)
            : [ev.id];

        const CICLOS = [
            { id: 'c1', nombre: '1° a 4° Básico' },
            { id: 'c2', nombre: '5° a 8° Básico' },
            { id: 'm', nombre: 'Enseñanza Media' },
            { id: 'otro', nombre: 'Sin clasificar' }
        ];
        const conteoPendientes = { c1: 0, c2: 0, m: 0, otro: 0 };
        const conteoTotal = { c1: 0, c2: 0, m: 0, otro: 0 };
        agruparElectivos(todas).forEach(ev => {
            const c = getCicloDeNivel(ev.nivel);
            conteoTotal[c]++;
            if (esPendiente(ev)) conteoPendientes[c]++;
        });

        const evalsCiclo = todas.filter(ev => getCicloDeNivel(ev.nivel) === ciclo);
        const pendientes = agruparElectivos(evalsCiclo.filter(esPendiente)).sort((a, b) => fechaOrden(a.fecha) - fechaOrden(b.fecha));
        const historialRaw = agruparElectivos(evalsCiclo.filter(ev => !esPendiente(ev))).sort((a, b) => fechaOrden(b.fecha) - fechaOrden(a.fecha));

        const historialPorMes = {};
        historialRaw.forEach(ev => {
            const mk = /^\d{4}-\d{2}/.test(String(ev.fecha || '')) ? String(ev.fecha).substring(0, 7) : 'sin-fecha';
            if (!historialPorMes[mk]) historialPorMes[mk] = [];
            historialPorMes[mk].push(ev);
        });
        const mesesOrdenados = Object.keys(historialPorMes).sort().reverse();
        const mesActual = new Date().toISOString().substring(0, 7);
        const nombreMes = (mk) => {
            if (mk === 'sin-fecha') return 'SIN FECHA REGISTRADA';
            const d = new Date(mk + '-02T12:00:00');
            return isNaN(d.getTime()) ? mk : d.toLocaleString('es-CL', { month: 'long', year: 'numeric' }).toUpperCase();
        };

        const seleccionadas = [...pendientes, ...historialRaw].filter(ev => seleccion.includes(ev.id));
        const toggleSel = (id) => setSeleccion(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
        const toggleLista = (lista) => {
            const ids = lista.map(e => e.id);
            const yaTodas = ids.length > 0 && ids.every(id => seleccion.includes(id));
            setSeleccion(prev => yaTodas ? prev.filter(id => !ids.includes(id)) : [...new Set([...prev, ...ids])]);
        };

                // Guarda el nuevo estado en la nube (conserva todos los datos de la evaluación)
        const aplicarEstado = async (ids, nuevoEstado, motivo = '') => {
            if (typeof db === 'undefined') throw new Error('No hay conexión con la base de datos.');
            const porId = {};
            todas.forEach(e => { porId[e.id] = e; });
            for (let i = 0; i < ids.length; i += 400) {
                const batch = db.batch();
                ids.slice(i, i + 400).forEach(id => {
                    const original = JSON.parse(JSON.stringify(porId[id] || { id }));
                    batch.set(refEvaluaciones().doc(String(id)), {
                        ...original,
                        estado: nuevoEstado,
                        autoriza: user?.name || 'UTP / Dirección',
                        motivoRechazo: motivo || ''
                    }, { merge: true });
                });
                await batch.commit();
            }
        };

        const ejecutar = async (ids, nuevoEstado, motivo, cantidadVisible, alTerminar) => {
            setProcesando(true);
            setMensajeError('');
            try {
                await aplicarEstado(ids, nuevoEstado, motivo);
                setSeleccion(prev => prev.filter(id => !ids.includes(id)));
                if (alTerminar) alTerminar();
                if (setNotification) setNotification({ message: `${cantidadVisible} evaluación(es) actualizadas a: ${nuevoEstado}`, type: 'success' });
            } catch (err) {
                console.error(err);
                setMensajeError('No se pudo cambiar el estado: ' + (err && err.message ? err.message : 'error desconocido'));
                if (setNotification) setNotification({ message: 'No se pudo cambiar el estado', type: 'error' });
            } finally {
                setProcesando(false);
            }
        };

        // Cambio individual desde la lista desplegable
        const handleCambioEstado = (e, ev, nuevoEstado) => {
            if (e) e.stopPropagation();
            if ((ev.estado || 'Pendiente') === nuevoEstado) return;
            const ids = idsRelacionados(ev);

            if (nuevoEstado === 'Anular') {
                setDialogo({
                    id: Date.now(),
                    titulo: 'Anular y borrar evaluación',
                    mensaje: `Se eliminará "${ev.instrumento || 'la evaluación'}" de ev.docente||'estedocente'({ev.textoCursosAgrupados || ''}).\nEsta acción no se puede deshacer.`,
                    requiereTexto: 'ELIMINAR',
                    textoBoton: 'Anular y borrar',
                    color: 'red',
                    alConfirmar: async () => {
                        try {
                            if (typeof db !== 'undefined') {
                                await Promise.all(ids.map(id => refEvaluaciones().doc(String(id)).delete()));
                            }
                            setDbData(prev => ({ ...prev, evaluaciones: (prev.evaluaciones || []).filter(x => !ids.includes(x.id)) }));
                            setSeleccion(prev => prev.filter(id => !ids.includes(id)));
                            if (setNotification) setNotification({ message: 'Evaluación anulada y eliminada.', type: 'success' });
                        } catch (err) {
                            setMensajeError('No se pudo anular: ' + err.message);
                        }
                    }
                });
                return;
            }

            if (nuevoEstado === 'Rechazado') {
                setDialogo({
                    id: Date.now(),
                    titulo: 'Rechazar evaluación',
                    mensaje: `Se rechazará "${ev.instrumento || 'la evaluación'}" de ${ev.docente || 'este docente'}.`,
                    conMotivo: true,
                    motivoInicial: motivoMasivo,
                    textoBoton: 'Rechazar',
                    color: 'red',
                    alConfirmar: (motivo) => ejecutar(ids, 'Rechazado', motivo || 'Rechazado por Coordinación/UTP', 1)
                });
                return;
            }

            ejecutar(ids, nuevoEstado, '', 1);
        };

        // Cambio masivo (seleccionadas o una lista entregada, por ejemplo "todas las pendientes")
        const cambiarEstadoMasivo = (nuevoEstado, lista = null) => {
            const objetivo = lista || seleccionadas;
            if (objetivo.length === 0) {
                setMensajeError('Primero marque al menos una evaluación con la casilla de la izquierda.');
                return;
            }
            setMensajeError('');
            const ids = [...new Set(objetivo.flatMap(ev => idsRelacionados(ev)))];
            const etiqueta = { Aprobado: 'Aprobar', Rechazado: 'Rechazar', Pendiente: 'Volver a pendiente' }[nuevoEstado];
            const color = { Aprobado: 'green', Rechazado: 'red', Pendiente: 'yellow' }[nuevoEstado];
            setDialogo({
                id: Date.now(),
                titulo: `${etiqueta}: ${objetivo.length} evaluación(es)`,
                mensaje: `Se cambiará el estado de objetivo.lengthevaluación(es)a"{nuevoEstado}".`,
                conMotivo: nuevoEstado === 'Rechazado',
                motivoInicial: motivoMasivo,
                textoBoton: etiqueta,
                color,
                alConfirmar: (motivo) => ejecutar(
                    ids,
                    nuevoEstado,
                    nuevoEstado === 'Rechazado' ? (motivo || 'Rechazado por Coordinación/UTP') : '',
                    objetivo.length,
                    () => { if (!lista) setSeleccion([]); setMotivoMasivo(''); }
                )
            });
        };

        const resetearTodo = () => {
            setDialogo({
                id: Date.now(),
                titulo: '⚠️ Borrar TODAS las evaluaciones',
                mensaje: 'Esto borrará todas las evaluaciones de todos los cursos y docentes. No se puede deshacer.',
                requiereTexto: 'RESETEAR',
                textoBoton: 'Borrar todo',
                color: 'red',
                alConfirmar: async () => {
                    try {
                        if (typeof db !== 'undefined') {
                            await Promise.all(todas.map(ev => refEvaluaciones().doc(String(ev.id)).delete()));
                        }
                        setDbData(prev => ({ ...prev, evaluaciones: [] }));
                        setSeleccion([]);
                        if (setNotification) setNotification({ message: 'Todas las evaluaciones fueron eliminadas.', type: 'success' });
                    } catch (err) {
                        setMensajeError('No se pudo completar el borrado: ' + err.message);
                    }
                }
            });
        };

        const renderSelectEstado = (ev, esPend) => (
            <select
                value={ev.estado || 'Pendiente'}
                onChange={(e) => handleCambioEstado(e, ev, e.target.value)}
                className={`border-2 p-1.5 rounded-lg text-[10px] font-bold w-full cursor-pointer outline-none ${esPend ? 'border-yellow-400 bg-yellow-50 text-yellow-800' : (ev.estado === 'Aprobado' ? 'bg-green-50 text-green-800 border-green-400' : 'bg-red-50 text-red-800 border-red-400')}`}
            >
                <option value="Pendiente">⏳ PENDIENTE</option>
                <option value="Aprobado">✅ APROBADO</option>
                <option value="Rechazado">❌ RECHAZADO</option>
                <option value="Anular">🗑️ ANULAR Y BORRAR</option>
            </select>
        );

        const renderTabla = (lista, esPend) => {
            const todasMarcadas = lista.length > 0 && lista.every(ev => seleccion.includes(ev.id));
            return (
                <table className="w-full text-sm text-left border-collapse">
                    <thead className={`font-bold border-b ${esPend ? 'bg-orange-50 text-orange-800 border-orange-200' : 'bg-slate-50 text-slate-500'}`}>
                        <tr>
                            <th className="p-3 w-10 text-center no-print-pdf">
                                <input type="checkbox" className="w-4 h-4 accent-teal-600 cursor-pointer" checked={todasMarcadas} onChange={() => toggleLista(lista)} title="Seleccionar todas" />
                            </th>
                            <th className="p-3">Fecha</th>
                            <th className="p-3">Docente / Curso</th>
                            <th className="p-3">Evaluación</th>
                            <th className="p-3 text-center no-print-pdf w-48">Estado</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                        {lista.map(ev => (
                            <tr key={ev.id} className={`transition-colors ${seleccion.includes(ev.id) ? 'bg-teal-50' : 'hover:bg-slate-50'}`}>
                                <td className="p-3 text-center no-print-pdf">
                                    <input type="checkbox" className="w-4 h-4 accent-teal-600 cursor-pointer" checked={seleccion.includes(ev.id)} onChange={() => toggleSel(ev.id)} />
                                </td>
                                <td className={`p-3 text-xs font-bold ${esPend ? 'text-orange-700' : 'text-slate-700'}`}>{formatFechaManual(ev.fecha) || 'Sin fecha'}</td>
                                <td className="p-3 text-xs">
                                    <div className="font-bold text-slate-800">{ev.docente || 'Docente no indicado'}</div>
                                    <div className={`mt-0.5 ${ev.esElectivo ? 'text-purple-700 font-bold' : 'text-slate-600'}`}>
                                        {ev.esElectivo ? `${ev.nombreGrupo}: ${ev.textoCursosAgrupados}` : ev.textoCursosAgrupados}
                                    </div>
                                </td>
                                <td className="p-3 text-[11px] text-slate-700">
                                    <span className="bg-slate-100 px-2 py-0.5 rounded font-bold border border-slate-200">{ev.instrumento || '-'}</span>
                                    <div className="mt-1 italic max-w-sm">{ev.contenido || ''}</div>
                                </td>
                                <td className="p-3 text-center no-print-pdf">
                                    {renderSelectEstado(ev, esPend)}
                                    {!esPend && ev.motivoRechazo && ev.estado === 'Rechazado' && <div className="text-[9px] text-red-600 mt-1 italic">Motivo: {ev.motivoRechazo}</div>}
                                    {!esPend && <div className="text-[8px] text-slate-400 mt-1 uppercase">Por: {ev.autoriza || 'Sistema'}</div>}
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            );
        };

        return (
                        <div className="space-y-6 animate-fade-in" id="print-seccion-evaluaciones">
                {dialogo && <DialogoConfirmacion key={dialogo.id} datos={dialogo} onCerrar={() => setDialogo(null)} />}
                <div className="hidden print:block mb-6">
                    <OfficialHeader user={user} context={{ year: getAcademicYear() }} docTitle="Informe de Estado de Evaluaciones" logoUrl={dbData.config.schoolLogo} />
                </div>

                <div className="flex justify-between items-center border-b-2 border-orange-200 pb-2 mb-4 no-print">
                    <h4 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                        <LucideIcon iconName="CheckSquare" size={24} className="text-orange-500"/> Gestión de Evaluaciones por Ciclo
                    </h4>
                    <div className="flex gap-2">
                        <button onClick={resetearTodo} className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-red-700 shadow-sm no-print-pdf">
                            <LucideIcon iconName="AlertTriangle" size={14}/> Empezar de Cero (Borrar Todas)
                        </button>
                        <button onClick={() => printDocument('print-seccion-evaluaciones', 'Reporte_Evaluaciones')} className="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-slate-700 shadow-sm no-print-pdf">
                            <LucideIcon iconName="Printer" size={14}/> Imprimir Todo
                        </button>
                    </div>
                </div>

                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div className="flex flex-wrap gap-1 mb-6 border-b-2 border-orange-300 no-print-pdf">
                        {CICLOS.filter(c => c.id !== 'otro' || conteoTotal.otro > 0).map(c => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => { setCiclo(c.id); setSeleccion([]); }}
                                className={`px-5 py-3 rounded-t-lg font-bold text-sm transition-all -mb-[2px] border-t border-l border-r flex items-center gap-2 ${ciclo === c.id ? 'bg-white text-orange-600 border-orange-300 border-b-white relative z-10' : 'bg-slate-100 text-slate-500 border-transparent hover:bg-slate-200'}`}
                            >
                                {c.nombre}
                                {conteoPendientes[c.id] > 0 && <span className="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-full">{conteoPendientes[c.id]}</span>}
                            </button>
                        ))}
                    </div>

                    <h3 className="font-black text-xl text-slate-800 uppercase flex items-center gap-2 bg-orange-50 p-3 rounded-lg border border-orange-100 mb-4">
                        <LucideIcon iconName="FolderOpen" size={24} className="text-orange-500"/>
                        Viendo: {CICLOS.find(c => c.id === ciclo)?.nombre} ({conteoTotal[ciclo]} evaluaciones)
                    </h3>
                    {ciclo === 'otro' && (

</div>

  // --- ESTE COMPONENTE ES NECESARIO PARA QUE NO QUEDE EN BLANCO ---

    // --- MÓDULO DE RESULTADOS ACTUALIZADO ---
  // --- MÓDULO DE RESULTADOS ACTUALIZADO (CON VINCULACIÓN AL CALENDARIO) ---
// --- MÓDULO DE RESULTADOS AVANZADO (ASISTENTE PEDAGÓGICO) ---
// --- MÓDULO DE RESULTADOS FINAL (VISUALMENTE ATRACTIVO + ÍCONOS DINÁMICOS + NOTA DE CÁLCULO) ---
const ResultadosModule = ({ context, dbData, setDbData, setNotification, readOnly }) => {
    // Definir claves únicas
    const cronogramaKey = context.esElectivo 
        ? `context.asignaturaId-GLOBAL-{context.year}-${context.nombreGrupo}`
        : `context.asignaturaId-{context.nivel}-context.letra-{context.year}`;
    
    const [unidadSel, setUnidadSel] = useState(1);
    
    // Identificar si es un electivo mixto (1, 2 o 3)
    const esElectivoMixto = context.esElectivo && 
        ['Electivo 1', 'Electivo 2', 'Electivo 3', 'Electivo 01', 'Electivo 02', 'Electivo 03'].some(g => context.nombreGrupo.includes(g));

    const resultadoKey = `cronogramaKey-U{unidadSel}-Resultados`;
    
    const [data, setData] = useState({ 
        instrumentos: [], 
        analisisIA: '', 
        nivelLogroGlobal: '',
        interpretacionPedagogica: '',
        porcentajeLogro: 0,
        contenidosEvaluados: [],
        indicadoresEvaluados: [],
        fortalezasContenidos: '',
        debilidadesContenidos: '',
        sugerenciasEspecificas: ''
    });

    // --- CARGA DE DATOS ---
    useEffect(() => {
        const existing = (dbData.resultados || []).find(r => r.key === resultadoKey);
        
        if (existing) { 
            setData(existing); 
        } else {
            const planKey = context.esElectivo 
                ? `context.asignaturaId-GLOBAL-{context.year}-context.nombreGrupo-U{unidadSel}`
                : `context.asignaturaId-{context.nivel}-context.year-U{unidadSel}`;
            
            const plan = (dbData.planificaciones || []).find(p => p.key === planKey);
            const mesesPorUnidad = { 1: [2, 3, 4], 2: [4, 5, 6], 3: [7, 8, 9], 4: [9, 10, 11] };

            let evaluacionesReales = (dbData.evaluaciones || []).filter(ev => {
                if (ev.estado === 'Rechazado') return false;
                const fechaEv = new Date(ev.fecha);
                const matchUnidad = mesesPorUnidad[unidadSel] ? mesesPorUnidad[unidadSel].includes(fechaEv.getMonth()) : true;
                if (!matchUnidad) return false;

                if (context.esElectivo) {
                    if (esElectivoMixto) {
                        return ev.esElectivo === true && ev.nombreGrupo === context.nombreGrupo && ev.asignaturaId === context.asignaturaId;
                    } else {
                        return ev.esElectivo === true && ev.nombreGrupo === context.nombreGrupo && ev.asignaturaId === context.asignaturaId && ev.nivel === context.nivel; 
                    }
                } else {
                    return ev.nivel === context.nivel && ev.letra === context.letra && ev.asignaturaId === context.asignaturaId;
                }
            });

            const unicas = [];
            const map = new Map();
            for (const item of evaluacionesReales) {
                const identifier = `item.fecha-{item.instrumento}-${item.contenido}`;
                if(!map.has(identifier)){ map.set(identifier, true); unicas.push(item); }
            }
            evaluacionesReales = unicas.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

            let initialInstrumentos = [];
            if (evaluacionesReales.length > 0) {
                initialInstrumentos = evaluacionesReales.map(ev => ({
                    id: ev.id, 
                    nombre: `ev.instrumento({formatFechaManual(ev.fecha)})`, 
                    insuf:0, suf:0, acept:0, bueno:0, 
                    pInsuf:0, pSuf:0, pAcept:0, pBueno:0,
                    contenidoRef: ev.contenido 
                }));
            } else {
                const numEvalsPlan = plan ? parseInt(plan.numEvals) : 1;
                for(let i=1; i<=numEvalsPlan; i++) { 
                    initialInstrumentos.push({ id: Date.now()+i, nombre: `Evaluación N°${i}`, insuf:0, suf:0, acept:0, bueno:0, pInsuf:0, pSuf:0, pAcept:0, pBueno:0 }); 
                }
            }
            
            let contenidosEvaluados = [];
            if (plan) contenidosEvaluados = plan.contenidosBase ? plan.contenidosBase.split('\n').filter(c => c.trim()) : [];
            else if (evaluacionesReales.length > 0) contenidosEvaluados = evaluacionesReales.map(e => e.contenido).filter(Boolean);
            
            setData({ 
                instrumentos: initialInstrumentos, 
                analisisIA: '', nivelLogroGlobal: '', interpretacionPedagogica: '', porcentajeLogro: 0,
                contenidosEvaluados, indicadoresEvaluados: [], fortalezasContenidos: '', debilidadesContenidos: '', sugerenciasEspecificas: ''
            });
        }
    }, [unidadSel, resultadoKey, dbData.resultados, dbData.evaluaciones]); 

    // --- CÁLCULOS ---
    const calcularPorcentajes = (inst) => {
        const total = (parseInt(inst.insuf)||0) + (parseInt(inst.suf)||0) + (parseInt(inst.acept)||0) + (parseInt(inst.bueno)||0);
        if (total === 0) return { pInsuf: 0, pSuf: 0, pAcept: 0, pBueno: 0, logroTotal: 0 };
        const pSuf = Math.round(((parseInt(inst.suf)||0) / total) * 100);
        const pAcept = Math.round(((parseInt(inst.acept)||0) / total) * 100);
        const pBueno = Math.round(((parseInt(inst.bueno)||0) / total) * 100);
        return {
            pInsuf: Math.round(((parseInt(inst.insuf)||0) / total) * 100),
            pSuf, pAcept, pBueno,
            logroTotal: pSuf + pAcept + pBueno
        };
    };

    const generarAnalisisIA = () => {
        const hayDatos = data.instrumentos.some(i => (parseInt(i.insuf)||0) + (parseInt(i.suf)||0) + (parseInt(i.acept)||0) + (parseInt(i.bueno)||0) > 0);
        if(!hayDatos) { alert("Por favor, ingrese los resultados numéricos de las evaluaciones."); return; }

        let totalAlumnosTotal = 0;
        let sumaLogroTotal = 0;
        
        const instrumentosProcesados = data.instrumentos.map(i => {
            const stats = calcularPorcentajes(i);
            const total = (parseInt(i.insuf)||0) + (parseInt(i.suf)||0) + (parseInt(i.acept)||0) + (parseInt(i.bueno)||0);
            if (total > 0) {
                totalAlumnosTotal += 1;
                sumaLogroTotal += stats.logroTotal;
            }
            return {...i, ...stats};
        });

        const sortedInst = [...instrumentosProcesados].filter(i => (parseInt(i.insuf)||0) + (parseInt(i.suf)||0) > 0).sort((a,b) => b.logroTotal - a.logroTotal);
        const mejorInst = sortedInst[0];
        const peorInst = sortedInst[sortedInst.length - 1];
        
        const porcLogro = totalAlumnosTotal > 0 ? Math.round(sumaLogroTotal / totalAlumnosTotal) : 0;

        let nivel = "", definicionNivel = "";
        if (porcLogro >= 85) {
            nivel = "ADECUADO";
            definicionNivel = "Los estudiantes han adquirido los conocimientos y habilidades de manera consistente. Son capaces de aplicarlos en situaciones variadas.";
        } else if (porcLogro >= 60) {
            nivel = "ELEMENTAL";
            definicionNivel = "Los estudiantes han adquirido parcialmente los conocimientos. Logran resolver situaciones directas, pero presentan dificultades en contextos complejos.";
        } else {
            nivel = "INSUFICIENTE";
            definicionNivel = "Los estudiantes no demuestran haber adquirido los conocimientos elementales. Muestran escasa comprensión de conceptos básicos.";
        }

        let interpretacionHTML = `
            <p style="margin-bottom:12px; font-size:10pt;">
                El curso ha obtenido un Nivel de Aprendizaje Global <strong>nivel({porcLogro}%)</strong>. De acuerdo a los estándares institucionales, esto significa que: <em>${definicionNivel}</em>
            </p>
        `;

        if (mejorInst && peorInst && mejorInst.id !== peorInst.id) {
            interpretacionHTML += `
                <div style="background-color:#f8fafc; padding:10px; border-radius:6px; border:1px solid #e2e8f0; margin-bottom:12px;">
                    <strong style="color:#334155; font-size:10pt; display:block; margin-bottom:6px;">Análisis Comparativo de Aprendizajes:</strong>
                    <ul style="list-style-type:disc; padding-left:20px; font-size:10pt; color:#475569;">
                        <li style="margin-bottom:6px;">
                            <strong>Fortaleza Principal:</strong> Se evidencia un dominio sólido en <em>"mejorInst.contenidoRef||mejorInst.nombre"</em>,alcanzandoun<strong>{mejorInst.logroTotal}% de logro</strong>. Esto sugiere que las estrategias didácticas utilizadas para este contenido fueron efectivas y lograron movilizar los saberes del grupo.
                        </li>
                        <li>
                            <strong>Foco de Atención:</strong> Los resultados más descendidos se concentran en <em>"peorInst.contenidoRef||peorInst.nombre"</em>,conun<strong>{peorInst.logroTotal}% de logro</strong>. Esta disparidad indica una brecha específica en la apropiación de este contenido que requiere intervención.
                        </li>
                    </ul>
                </div>
                <p style="font-size:10pt;">
                    Esta heterogeneidad en los resultados sugiere la necesidad de diferenciar las estrategias de refuerzo, capitalizando las habilidades demostradas en "mejorInst.contenidoRef||'elcontenidofuerte'"paraapalancarlamejoraen"{peorInst.contenidoRef || 'el contenido débil'}".
                </p>
            `;
        } else if (mejorInst) {
            interpretacionHTML += `
                <p style="font-size:10pt;">
                    El desempeño del grupo es homogéneo en torno al <strong>porcLogro%</strong>.Seobservauncomportamientoconsistentefrentealosinstrumentosaplicados,loquesugierequeelritmodeaprendizajeestáalineadoconlametodologíageneral,aunquesedebeverificarsiestenivel({nivel}) cumple con las expectativas anuales.
                </p>
            `;
        }

        let fortalezasHTML = "No se detectaron fortalezas claras.";
        let debilidadesHTML = "No se detectaron debilidades críticas.";
        let sugerenciasHTML = "Mantener el monitoreo constante.";

        if (mejorInst) {
            fortalezasHTML = `
                <ul style="list-style:none; padding:0; font-size:9pt;">
                    <li style="margin-bottom:6px;">✓ Alta apropiación de <strong>${mejorInst.contenidoRef || mejorInst.nombre}</strong>.</li>
                    <li>✓ El grupo responde bien a instrumentos tipo <strong>${mejorInst.nombre.split('(')[0]}</strong>.</li>
                </ul>
            `;
        }
        if (peorInst) {
            debilidadesHTML = `
                <ul style="list-style:none; padding:0; font-size:9pt;">
                    <li style="margin-bottom:6px;">⚠ Brechas significativas en <strong>${peorInst.contenidoRef || peorInst.nombre}</strong>.</li>
                    <li>⚠ Un <strong>${peorInst.pInsuf}%</strong> del curso no alcanza los aprendizajes mínimos en este eje.</li>
                </ul>
            `;
            sugerenciasHTML = `
                <div style="font-size:9pt;">
                    <strong>Para "${peorInst.contenidoRef || 'el contenido débil'}":</strong><br/>
                    ${peorInst.pInsuf > 50 
                        ? "Se requiere <strong>re-enseñanza urgente</strong> variando la metodología (ej: uso de material concreto o visualización) antes de avanzar." 
                        : "Implementar guías de refuerzo diferenciadas y tutorías entre pares durante la próxima unidad."}
                    <br/><br/>
                    <strong>Estrategia General:</strong><br/>
                    Utilizar la confianza ganada en "${mejorInst ? (mejorInst.contenidoRef || mejorInst.nombre) : 'los contenidos logrados'}" para introducir progresivamente la complejidad de los temas descendidos.
                </div>
            `;
        }

        let htmlDetalle = `<div style="margin-bottom: 20px;">`;
        instrumentosProcesados.forEach((inst, idx) => {
             const nI = parseInt(inst.insuf)||0; const nS = parseInt(inst.suf)||0; const nA = parseInt(inst.acept)||0; const nB = parseInt(inst.bueno)||0;
             htmlDetalle += `
                <div style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #cbd5e1; page-break-inside: avoid;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:5px;">
                        <span style="font-weight:800; color:#1e3a8a; font-size:11pt;">${idx + 1}. ${inst.nombre}</span>
                        <span style="font-weight:bold; color:inst.logroTotal>=60?'#059669':'#dc2626';font-size:10pt;">{inst.logroTotal}% Logro</span>
                    </div>
                    <div style="font-size:9pt; color:#64748b; font-style:italic; margin-bottom:10px;">
                        Contenido evaluado: <strong>${inst.contenidoRef || 'General'}</strong>
                    </div>
                    <div style="display: flex; height: 20px; width: 100%; background-color: #f1f5f9; border-radius: 4px; overflow: hidden; border:1px solid #e2e8f0; margin-bottom:8px; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                        <div style="width: ${inst.pInsuf}%; background-color: #ef4444; -webkit-print-color-adjust: exact; print-color-adjust: exact;" title="Insuficiente"></div>
                        <div style="width: ${inst.pSuf}%; background-color: #f59e0b; -webkit-print-color-adjust: exact; print-color-adjust: exact;" title="Suficiente"></div>
                        <div style="width: ${inst.pAcept}%; background-color: #3b82f6; -webkit-print-color-adjust: exact; print-color-adjust: exact;" title="Aceptable"></div>
                        <div style="width: ${inst.pBueno}%; background-color: #10b981; -webkit-print-color-adjust: exact; print-color-adjust: exact;" title="Destacado"></div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; font-size:8pt; text-align:center;">
                        <tr>
                            <td style="width:25%; color:#991b1b; font-weight:bold;">Insuficiente</td>
                            <td style="width:25%; color:#92400e; font-weight:bold;">Suficiente</td>
                            <td style="width:25%; color:#1e40af; font-weight:bold;">Aceptable</td>
                            <td style="width:25%; color:#166534; font-weight:bold;">Destacado</td>
                        </tr>
                        <tr>
                            <td style="font-weight:800; font-size:10pt;">inst.pInsuf%<spanstyle="font-weight:normal;color:#666;">({nI})</span></td>
                            <td style="font-weight:800; font-size:10pt;">inst.pSuf%<spanstyle="font-weight:normal;color:#666;">({nS})</span></td>
                            <td style="font-weight:800; font-size:10pt;">inst.pAcept%<spanstyle="font-weight:normal;color:#666;">({nA})</span></td>
                            <td style="font-weight:800; font-size:10pt;">inst.pBueno%<spanstyle="font-weight:normal;color:#666;">({nB})</span></td>
                        </tr>
                    </table>
                </div>
             `;
        });
        htmlDetalle += `</div>`;

        setData(prev => ({
            ...prev,
            instrumentos: instrumentosProcesados,
            porcentajeLogro: porcLogro,
            nivelLogroGlobal: nivel,
            interpretacionPedagogica: interpretacionHTML,
            analisisIA: htmlDetalle,
            fortalezasContenidos: fortalezasHTML,
            debilidadesContenidos: debilidadesHTML,
            sugerenciasEspecificas: sugerenciasHTML
        }));
        
        setNotification({ message: 'Análisis pedagógico profundo generado', type: 'success' });
    };

    const handleSave = () => { 
        const regFinal = { ...data, key: resultadoKey, cronogramaKey, unidad: unidadSel, letra: context.letra, esElectivo: context.esElectivo, nombreGrupo: context.nombreGrupo, esGrupoMixto: esElectivoMixto }; 
        const otros = (dbData.resultados || []).filter(r => r.key !== resultadoKey); 
        setDbData(prev => ({...prev, resultados: [...otros, regFinal]})); 
        setNotification({ message: 'Resultados guardados correctamente', type: 'success' }); 
    };

    const updateInstrumento = (idx, field, val) => { 
        const newInst = [...data.instrumentos]; newInst[idx][field] = val; setData(prev => ({...prev, instrumentos: newInst})); 
    };

    const colorFondo = data.nivelLogroGlobal === "ADECUADO" ? "bg-emerald-50 border-emerald-500" : 
                       data.nivelLogroGlobal === "ELEMENTAL" ? "bg-amber-50 border-amber-500" : 
                       "bg-rose-50 border-rose-500";
    
    const colorTexto = data.nivelLogroGlobal === "ADECUADO" ? "text-emerald-900" : 
                       data.nivelLogroGlobal === "ELEMENTAL" ? "text-amber-900" : 
                       "text-rose-900";
    
    // CAMBIO: Icono dinámico según nivel
    let NivelIcon = LucideIcon; // Fallback
    if (data.nivelLogroGlobal === "ADECUADO") NivelIcon = "Award";
    else if (data.nivelLogroGlobal === "ELEMENTAL") NivelIcon = "TrendingUp";
    else NivelIcon = "AlertTriangle";

    return (
        <div className="space-y-10 animate-fade-in">
            <div className="bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 no-print-pdf shadow-sm">
                <div className="flex justify-between items-center mb-6">
                    <h3 className="font-black text-slate-800 uppercase flex items-center gap-2">
                        <LucideIcon iconName="ClipboardCheck" size={24} className="text-teal-600"/> 
                        {context.esElectivo ? `Resultados: ${context.nombreGrupo}` : 'Carga de Calificaciones'}
                    </h3>
                    <select className="p-2 border-2 border-orange-400 rounded-lg font-bold" value={unidadSel} onChange={e=>setUnidadSel(parseInt(e.target.value))}>
                        {[1,2,3,4].map(u=><option key={u} value={u}>Unidad {u}</option>)}
                    </select>
                </div>
                {data.instrumentos.length === 0 && <p className="text-center text-gray-500 italic p-4">No hay evaluaciones agendadas en el calendario.</p>}
                <div className="space-y-4">
                    {data.instrumentos.map((inst, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-xl border grid grid-cols-1 lg:grid-cols-12 gap-4 items-center shadow-sm">
                            <div className="lg:col-span-4">
                                <label className="text-[10px] font-black text-gray-400 uppercase block mb-1">Instrumento & Contenido</label>
                                <input className="w-full border p-2 rounded font-bold text-sm bg-gray-50 mb-1" value={inst.nombre} readOnly/>
                                <div className="text-[9px] text-teal-600 truncate font-medium">{inst.contenidoRef || "Contenido no especificado"}</div>
                            </div>
                            {['insuf', 'suf', 'acept', 'bueno'].map((f, i) => (
                                <div key={f} className="lg:col-span-2">
                                    <label className="text-[9px] font-black text-center block uppercase text-gray-400 mb-1">
                                        {['Insuficiente (I)', 'Suficiente (S)', 'Aceptable (A)', 'Destacado (D)'][i]}
                                    </label>
                                    <input type="number" className="w-full border-2 border-slate-100 p-2 rounded text-center font-bold focus:border-blue-400 outline-none" 
                                        value={inst[f]} onChange={e=>updateInstrumento(idx, f, e.target.value)}/>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
                <div className="mt-8 flex justify-center">
                    <button onClick={generarAnalisisIA} className="bg-gradient-to-r from-purple-700 to-indigo-700 text-white px-8 py-3 rounded-full font-black shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center gap-3">
                        <LucideIcon iconName="Brain" size={24}/> GENERAR ANÁLISIS PEDAGÓGICO IA
                    </button>
                </div>
            </div>

            {data.analisisIA && (
                <div id="printable-reporte-completo" className="bg-white p-10 border-2 border-black shadow-2xl rounded-sm max-w-5xl mx-auto">
                    <OfficialHeader user={{name: context.docenteName}} context={context} docTitle="Informe Técnico de Resultados" logoUrl={dbData.config.schoolLogo} />
                    
                    <div className={`mt-8 p-6 border-l-8 rounded-r-xl mb-10 shadow-sm ${colorFondo} flex items-center justify-between`}>
                        <div>
                            <h6 className={`text-xs font-black uppercase tracking-widest opacity-60 mb-1 ${colorTexto}`}>Nivel de Logro Global</h6>
                            <h2 className={`text-5xl font-black uppercase ${colorTexto}`}>{data.nivelLogroGlobal}</h2>
                            <div className={`text-2xl font-bold opacity-80 mt-1 ${colorTexto}`}>{data.porcentajeLogro}% de Aprobación</div>
                        </div>
                        <div className="hidden md:block opacity-20">
                            <LucideIcon iconName={NivelIcon} size={80} className={colorTexto}/>
                        </div>
                    </div>

                    <div className="mb-8">
                        <h4 className="font-bold text-sm uppercase text-slate-500 border-b border-slate-200 pb-2 mb-4 tracking-wider">I. Interpretación y Análisis de Aprendizajes</h4>
                        <div className="text-sm text-slate-800 text-justify leading-relaxed bg-slate-50 p-6 rounded-lg border border-slate-100">
                            <div dangerouslySetInnerHTML={{ __html: data.interpretacionPedagogica }} />
                        </div>
                    </div>

                    <div className="mb-8">
                        <div dangerouslySetInnerHTML={{ __html: data.analisisIA }} />
                    </div>

                    <div className="mb-10 page-break-inside-avoid">
                        <h4 className="font-bold text-sm uppercase text-slate-500 border-b border-slate-200 pb-2 mb-6 tracking-wider">II. Plan de Acción y Toma de Decisiones</h4>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-5 rounded-xl border border-green-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
                                <div className="flex items-center gap-2 mb-3 text-green-700 font-bold text-xs uppercase">
                                    <LucideIcon iconName="TrendingUp" size={16}/> Fortalezas (Potenciar)
                                </div>
                                <div className="text-xs text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: data.fortalezasContenidos }} />
                            </div>
                            
                            <div className="bg-white p-5 rounded-xl border border-red-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-red-500"></div>
                                <div className="flex items-center gap-2 mb-3 text-red-700 font-bold text-xs uppercase">
                                    <LucideIcon iconName="AlertCircle" size={16}/> Focos de Atención
                                </div>
                                <div className="text-xs text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: data.debilidadesContenidos }} />
                            </div>
                            
                            <div className="bg-white p-5 rounded-xl border border-blue-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                                <div className="flex items-center gap-2 mb-3 text-blue-700 font-bold text-xs uppercase">
                                    <LucideIcon iconName="Lightbulb" size={16}/> Sugerencias Pedagógicas
                                </div>
                                <div className="text-xs text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: data.sugerenciasEspecificas }} />
                            </div>
                        </div>
                    </div>

                    <div className="mt-12 break-inside-avoid">
                        <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-8">
                            <h6 className="font-bold text-[10px] text-slate-400 uppercase mb-3 text-center">Referencia Técnica: Niveles de Logro (Estándar Agencia de Calidad)</h6>
                            <div className="grid grid-cols-3 gap-4 text-[9px] text-slate-500">
                                <div><strong className="text-green-700">ADECUADO:</strong> Logro consistente de conocimientos y habilidades complejos. Capacidad de transferencia a nuevos contextos.</div>
                                <div><strong className="text-amber-600">ELEMENTAL:</strong> Logro parcial. Cumple lo básico pero falta profundidad en la aplicación y justificación.</div>
                                <div><strong className="text-red-600">INSUFICIENTE:</strong> No alcanza los saberes mínimos del nivel. Requiere remediales urgentes y diferenciados.</div>
                            </div>
                            <div className="mt-3 pt-3 border-t border-slate-300 text-[9px] text-slate-500 italic text-center">
                                <strong>Nota Metodológica de Cálculo:</strong> El porcentaje de aprobación (Logro) se calcula sumando la cantidad de estudiantes en los niveles Suficiente, Aceptable y Destacado, dividido por el total de estudiantes evaluados en el instrumento.
                            </div>
                        </div>

                        <div className="flex justify-around pt-10">
                            <div className="text-center w-48">
                                <div className="border-t border-black mb-2"></div>
                                <p className="text-[10px] font-bold uppercase">{context.docenteName}</p>
                                <p className="text-[9px] text-gray-500">Docente Responsable</p>
                            </div>
                            <div className="text-center w-48">
                                <div className="border-t border-black mb-2"></div>
                                <p className="text-[10px] font-bold uppercase">UTP / Dirección Académica</p>
                                <p className="text-[9px] text-gray-500">V°B° y Revisión</p>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            <div className="flex justify-center gap-4 no-print-pdf pt-6 border-t">
                <button onClick={handleSave} className="bg-green-600 text-white px-8 py-2 rounded-full font-bold shadow hover:bg-green-700">GUARDAR RESULTADOS</button>
                {data.analisisIA && <button onClick={() => printDocument('printable-reporte-completo', 'Reporte_Resultados_Detallado')} className="bg-slate-800 text-white px-8 py-2 rounded-full font-bold shadow flex items-center gap-2 hover:bg-black"><LucideIcon iconName="Printer" size={18}/> IMPRIMIR INFORME</button>}
            </div>
        </div>
    );
};





    const CronogramaModule = ({ context, dbData, setDbData, readOnly, currentUser, setNotification }) => {
        const cronogramaKey = `context.asignaturaId-{context.nivel}-${context.year}`;
        
        // Agregamos oa: '' a la estructura inicial
        const cronogramaExistente = (dbData.cronogramas || []).find(c => c.key === cronogramaKey) || { key: cronogramaKey, year: context.year, unidades: [1,2,3,4].map(u => ({ numero: u, nombre: `Unidad ${u}`, oa: '', meses: [], sesiones: 0 })), letrasValidas: [], folio: null, estado: 'Borrador', comments: [] };
        
        // NUEVO: mismo mecanismo de protección que en Planificación.
const userHasEditedCronoRef = useRef(false);

const [unidades, setUnidades] = useState(cronogramaExistente.unidades);
const [letrasValidas, setLetrasValidas] = useState(cronogramaExistente.letrasValidas || []);
const [folio, setFolio] = useState(cronogramaExistente.folio);
const [cronoData, setCronoData] = useState(cronogramaExistente);
        const [modalUnidadIdx, setModalUnidadIdx] = useState(null);
        const [modalData, setModalData] = useState({ nombre: '', oa: '' });
        const [nuevoOACrono, setNuevoOACrono] = useState('');
        // --- NUEVOS ESTADOS Y LÓGICA PARA IMPORTAR CRONOGRAMAS ---
        const [showImportModal, setShowImportModal] = useState(false);

                // Identifica al docente dueño de un cronograma a partir de las asignaciones
        const getDocenteDeCronograma = (c) => {
            const asig = (dbData.asignaciones || []).find(a => {
                if (a.asignaturaId !== c.asignaturaId) return false;
                if (c.key && c.key.includes('GLOBAL')) {
                    return a.esElectivo && a.nombreGrupo && c.key.includes(a.nombreGrupo);
                }
                return a.nivel === c.nivel;
            });
            if (!asig) return null;
            return (dbData.users || []).find(u => u.uid === asig.docenteId) || null;
        };

        const miDepto = currentUser?.depto || '';

        // Se muestran: (a) cronogramas de la misma asignatura y (b) cronogramas de colegas del mismo departamento
        const cronogramasImportables = (dbData.cronogramas || [])
            .filter(c => c.key !== cronogramaKey)
            .map(c => {
                const owner = getDocenteDeCronograma(c);
                const mismoDepto = !!(owner && miDepto && owner.depto === miDepto);
                return {
                    ...c,
                    __autor: owner ? owner.name : (c.approver || 'UTP / Base Institucional'),
                    __depto: owner ? (owner.depto || 'Sin depto.') : 'Institucional',
                    __mismoDepto: mismoDepto,
                    __asignaturaNombre: (dbData.asignaturas || []).find(a => a.id === c.asignaturaId)?.nombre || c.asignaturaId,
                    __mismaAsignatura: c.asignaturaId === context.asignaturaId
                };
            })
            .filter(c => c.__mismaAsignatura || c.__mismoDepto)
            .sort((a, b) => (b.year || 0) - (a.year || 0)
                || (b.__mismaAsignatura ? 1 : 0) - (a.__mismaAsignatura ? 1 : 0)
                || (a.__asignaturaNombre || '').localeCompare(b.__asignaturaNombre || '')
                || (a.nivel || '').localeCompare(b.nivel || ''));

        const handleImportarCronograma = (cronoCopiar) => {
            // Clonación profunda (Deep Copy) para que sean 100% independientes
            const unidadesCopiadas = JSON.parse(JSON.stringify(cronoCopiar.unidades || []));
            
            const mergedUnidades = unidades.map(u => {
                const importada = unidadesCopiadas.find(imp => imp.numero === u.numero);

        // Al cambiar de curso/asignatura, es un contexto nuevo: se permite recargar.
useEffect(() => {

                oa: u.oa || base.oaGlobal || ''
            };
        });
        setUnidades(mergedUnidades);
        setLetrasValidas(c.letrasValidas || []); 
        setFolio(c.folio); 
        setCronoData(c); 
    } else { 
        const initialUnidades = [1,2,3,4].map(u => {
            const base = getBaseData(u);
            return { 
                numero: u, 
                nombre: base.descripcion || `Unidad ${u}`, 
                oa: base.oaGlobal || '', 
                meses: [], 
                sesiones: 0 
            };
        });
        setUnidades(initialUnidades); 
        setLetrasValidas([]); 
        setFolio(null); 
    }
}, [cronogramaKey, dbData.cronogramas, dbData.planificaciones]);

        const handleSave = () => {
            let currentFolio = folio;

            const obtenerNuevoFolio = (config) => {
                const añoActual = getAcademicYear();

                return { lastFolio: (config.lastFolio || 0) + 1, lastFolioYear: añoActual };
            };

            if (!currentFolio) { 
                const nuevoFolioData = obtenerNuevoFolio(newConfig);
                newConfig.lastFolio = nuevoFolioData.lastFolio;
                newConfig.lastFolioYear = nuevoFolioData.lastFolioYear;
                currentFolio = newConfig.lastFolio; 
                setFolio(currentFolio); 
            }
            const nuevoCrono = { ...cronoData, key: cronogramaKey, year: context.year, asignaturaId: context.asignaturaId, nivel: context.nivel, letrasValidas, unidades, folio: currentFolio };
            const otros = (dbData.cronogramas || []).filter(c => c.key !== cronogramaKey);
            setDbData(prev => ({...prev, config: newConfig, cronogramas: [...otros, nuevoCrono]}));
            setNotification({ message: 'Cronograma guardado correctamente', type: 'success' });
userHasEditedCronoRef.current = false;
        };

const updateSesiones = (idx, val) => { if(readOnly) return; userHasEditedCronoRef.current = true; const newU = [...unidades]; newU[idx].sesiones = parseInt(val)||0; setUnidades(newU); };
const toggleLetra = (l) => { if(readOnly) return; userHasEditedCronoRef.current = true; setLetrasValidas(prev => prev.includes(l) ? prev.filter(x=>x!==l) : [...prev, l]); };
        
        // NUEVA FUNCIÓN: Para actualizar textos de Nombre de Unidad y OA

};

        // NUEVO: registra en la nube el documento externo (Drive) del cronograma
        const guardarDocumentoExternoCrono = async (docInfo) => {
            if (typeof db === 'undefined') { alert("Sistema desconectado: no se pudo registrar el documento."); return false; }
            try {
                const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                const existente = (dbData.cronogramas || []).find(c => c.key === cronogramaKey);
                const datos = { key: cronogramaKey, year: context.year, asignaturaId: context.asignaturaId, nivel: context.nivel, documentoExterno: docInfo };

                    datos.letrasValidas = letrasValidas;

                <button

        {MESES.map(m=><td key={m} className={`p-1 text-center border cursor-pointer transition-colors ${(u.meses || []).includes(m) ? 'bg-orange-50' : 'hover:bg-slate-100'}`} title={`Marcar/Desmarcar ${m}`} onClick={() => toggleMes(idx, m)}><input type="checkbox" className="no-print-pdf hidden" checked={(u.meses || []).includes(m)} readOnly />{(u.meses || []).includes(m) && (<div className="flex flex-col items-center justify-center pt-1"><span className="font-black text-sm text-center block text-orange-600 leading-none">X</span><span className="text-[8px] font-bold text-orange-500 mt-1 leading-none uppercase">{m}</span></div>)}</td>)}
        <td className="p-1 border text-center"><input type="number" className="w-full text-center bg-transparent outline-none font-bold text-slate-700" value={u.sesiones} onChange={(e) => updateSesiones(idx, e.target.value)} disabled={readOnly}/></td>
    </tr>
))}</tbody></table><FooterFirma docenteName="Firma Docente" isApproved={cronoData.estado === 'Aprobado'} approverName={cronoData.approver} /></div>
            
            {/* VENTANA EMERGENTE PARA EDITAR LA UNIDAD */}
            {modalUnidadIdx !== null && (
                <div className="modal-overlay" onClick={() => setModalUnidadIdx(null)}>
                    <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col animate-pop-in" onClick={e => e.stopPropagation()}>
                        
                        {/* Cabecera del Modal */}

                                />

                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">

                                                                    <textarea

                                                                    />
                                                                    <button 
                                                                        onClick={() => {
                                                                            if(nuevoOACrono.trim()) {
                                                                                const newText = modalData.oa ? modalData.oa + '\n\n' + nuevoOACrono.trim() : nuevoOACrono.trim();
                                                                                setModalData({...modalData, oa: newText});
                                                                                setNuevoOACrono('');
                                                                            }
                                                                        }} 
                                                                        className="bg-teal-600 text-white px-4 rounded-lg font-bold text-sm hover:bg-teal-700 transition-colors"
                                                                    >
                                                                        Agregar

                                                                </div>
                                                            </div>
                        </div>
                        
                        {/* Footer del Modal (Botones Guardar) */}
                        <div className="mt-6 border-t pt-4 flex justify-end gap-3">
                            <button onClick={() => setModalUnidadIdx(null)} className="px-5 py-2.5 rounded-lg font-bold text-sm bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
                                Cancelar
                            </button>
                            <button onClick={saveUnidadModal} className="px-6 py-2.5 rounded-lg font-bold text-sm bg-teal-600 text-white hover:bg-teal-700 shadow-md flex items-center gap-2 transition-transform active:scale-95">
                                <LucideIcon iconName="CheckCircle" size={18}/> Aplicar a la Unidad
                            </button>
                        </div>
                    </div>
                </div>
            )}
{/* --- MODAL DE IMPORTACIÓN DE CRONOGRAMAS --- */}
                {showImportModal && (
                    <div className="modal-overlay" onClick={() => setShowImportModal(false)}>
                        <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-3xl max-h-[85vh] overflow-y-auto animate-pop-in" onClick={e => e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-4 border-b pb-3">
                                <h3 className="font-black text-xl text-indigo-800 flex items-center gap-2">
                                    <LucideIcon iconName="Download" size={28} className="text-indigo-600"/>

                                <button onClick={() => setShowImportModal(false)} className="text-gray-400 hover:text-red-500 transition-colors">
                                    <LucideIcon iconName="X" size={28}/>

                                <br/><strong>Nota:</strong> Se creará una copia independiente. No se guardará en el sistema hasta que presiones el botón "Guardar" principal.
                            </p>
                            
                            {cronogramasImportables.length === 0 ? (
                                <div className="p-10 text-center text-gray-400 italic border-2 border-dashed rounded-xl bg-slate-50">
                                    <LucideIcon iconName="FolderSearch" size={48} className="mx-auto text-slate-300 mb-3" />
                                    <span className="font-bold text-slate-500 block">No hay cronogramas disponibles.</span>
                                    No existen otros registros previos para esta asignatura.
                                </div>
                            ) : (
                                <ul className="space-y-4">
                                                                        {cronogramasImportables.map(c => {

                                        return (
                                            <li key={c.key} className="p-5 border border-slate-200 rounded-xl hover:bg-indigo-50 hover:border-indigo-400 transition-all flex flex-col md:flex-row md:items-center justify-between gap-6 shadow-sm hover:shadow-md">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3 mb-2 flex-wrap">
                                                        <span className="bg-indigo-600 text-white font-black text-[10px] px-3 py-1 rounded shadow-sm uppercase tracking-wide">Año {c.year || 'N/A'}</span>

                                                            </span>
                                                        )}

                                                >
