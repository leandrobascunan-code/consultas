<script type="text/babel">

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "AIzaSyCJaHUFqE5pzIX96UUDFMwuGeiBhFjjPYs",
        authDomain: "acompanamientoaula.firebaseapp.com",

        // ==========================================
    // CONEXIÓN CON GOOGLE DRIVE (vía Google Apps Script) - SUBIDA POR PARTES, SIN LÍMITE DE TAMAÑO
    // ==========================================
    const DRIVE_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbwF63Hq7124zmgmL416abc1Bk8ISISLX9QzXlrKKBm8XShArgFR70bejTF5RJVneZGs/exec";
    const DRIVE_CARPETA_URL = "https://drive.google.com/drive/folders/1P3toYPpbobD1Iij45nJCQOV2vWCvOnK_?usp=drive_link";
    const DRIVE_TAMANO_PARTE = 8 * 1024 * 1024; // 8 MB por parte (múltiplo de 256 KB, exigido por Drive)

    const leerParteBase64 = (blob) => new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onload = () => resolve(String(lector.result).split(',')[1] || '');
        lector.onerror = () => reject(new Error('No se pudo leer el archivo seleccionado.'));
        lector.readAsDataURL(blob);
    });

    const llamarServicioDrive = async (datos, intentos = 3) => {
        let ultimoError = null;
        for (let i = 1; i <= intentos; i++) {
            try {
                const resp = await fetch(DRIVE_UPLOAD_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(datos),
                    redirect: 'follow'
                });
                const texto = await resp.text();
                let json;
                try { json = JSON.parse(texto); }
                catch (e) { throw new Error('El servicio de Drive no respondió correctamente. Revise que el Apps Script esté implementado con acceso para "Cualquier persona".'); }
                if (!json.ok) throw new Error(json.error || 'Error desconocido en Drive.');
                return json;
            } catch (err) {
                ultimoError = (err instanceof TypeError)
                    ? new Error('No fue posible conectar con Google Drive. Revise su conexión a internet y que el Apps Script tenga acceso para "Cualquier persona".')
                    : err;
                if (i < intentos) await new Promise(r => setTimeout(r, 1500 * i));
            }
        }
        throw ultimoError;
    };

    const subirArchivoADrive = async (file, meta = {}, onProgreso) => {
        if (!DRIVE_UPLOAD_URL || DRIVE_UPLOAD_URL.indexOf('/exec') === -1) {
            throw new Error('La conexión con Google Drive no está configurada.');
        }
        if (!file || !file.size) throw new Error('El archivo está vacío.');
        const tipoMime = file.type || 'application/octet-stream';

        // 1) Se abre la sesión de subida
        const inicio = await llamarServicioDrive({ accion: 'iniciar', ...meta, tipoMime, tamano: file.size });

        // 2) Se envía el archivo por partes
        let desde = 0;
        let resultado = null;
        if (onProgreso) onProgreso(0);
        while (desde < file.size) {
            const hasta = Math.min(desde + DRIVE_TAMANO_PARTE, file.size);
            const contenidoBase64 = await leerParteBase64(file.slice(desde, hasta));
            resultado = await llamarServicioDrive({ accion: 'subir', sesion: inicio.sesion, desde, hasta, total: file.size, contenidoBase64 });
            desde = hasta;
            if (onProgreso) onProgreso(Math.round((desde * 100) / file.size));
        }
        if (!resultado || !resultado.completo) throw new Error('Drive no confirmó la recepción completa del archivo.');
        return resultado;
    };

        // ==========================================
    // NUEVO: VENTANAS EMERGENTES SIEMPRE FRENTE AL USUARIO
    // Google Sites muestra la plataforma en un marco muy alto; sin esto, las ventanas
    // quedan en el centro del marco y no donde el usuario está mirando.
    // ==========================================
    let ultimoPuntoY = null;
    const registrarPunto = (e) => {
        const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
        if (p && typeof p.clientY === 'number') ultimoPuntoY = p.clientY;
    };
    document.addEventListener('pointerdown', registrarPunto, true);
    document.addEventListener('touchstart', registrarPunto, { capture: true, passive: true });

    const alturaVisibleReal = () => {
        const altoMarco = window.innerHeight;
        const altoPantalla = (window.screen && window.screen.availHeight) ? window.screen.availHeight - 110 : altoMarco;
        return Math.max(320, Math.min(altoMarco, altoPantalla));
    };
    const marcoMuyAlto = () => window.innerHeight > alturaVisibleReal() + 60;

    // Evita que una animación o efecto de un contenedor "atrape" la ventana y la desplace
    const liberarAncestros = (nodo) => {
        let p = nodo.parentElement;
        while (p && p !== document.body && p !== document.documentElement) {
            const cs = window.getComputedStyle(p);
            const atrapa = (cs.transform && cs.transform !== 'none') || (cs.filter && cs.filter !== 'none') ||
                (cs.backdropFilter && cs.backdropFilter !== 'none') || (cs.webkitBackdropFilter && cs.webkitBackdropFilter !== 'none') ||
                (cs.perspective && cs.perspective !== 'none') || /transform|filter|perspective/.test(cs.willChange || '') ||
                /paint|layout|strict|content/.test(cs.contain || '');
            if (atrapa) {
                p.style.animation = 'none';
                p.style.transform = 'none';
                p.style.filter = 'none';
                p.style.backdropFilter = 'none';
                p.style.webkitBackdropFilter = 'none';
                p.style.perspective = 'none';
                p.style.willChange = 'auto';
                p.style.contain = 'none';
            }
            p = p.parentElement;
        }
    };

    const ubicarVentanaEmergente = (capa) => {
        if (!capa || capa.dataset.ubicada) return;
        capa.dataset.ubicada = '1';
        liberarAncestros(capa);
        if (!marcoMuyAlto()) return; // En una ventana normal, el centrado habitual funciona bien
        const caja = capa.firstElementChild;
        const visible = alturaVisibleReal();
        const y = ultimoPuntoY == null ? visible / 2 : ultimoPuntoY;
        let inicio = Math.max(8, Math.min(y - visible / 2, window.innerHeight - visible));
        capa.style.boxSizing = 'border-box';
        capa.style.alignItems = 'flex-start';
        capa.style.paddingTop = inicio + 'px';
        if (caja) {
            caja.style.maxHeight = (visible - 16) + 'px';
            if (String(caja.style.height || '').includes('vh')) caja.style.height = (visible - 16) + 'px';
            if (window.getComputedStyle(caja).overflowY === 'visible') caja.style.overflowY = 'auto';
            requestAnimationFrame(() => { try { caja.scrollIntoView({ block: 'nearest' }); } catch (e) {} });
        }
    };

    const ubicarAviso = (aviso) => {
        if (!aviso || aviso.dataset.ubicado) return;
        aviso.dataset.ubicado = '1';
        if (!marcoMuyAlto() || ultimoPuntoY == null) return;
        aviso.style.top = Math.max(10, Math.min(ultimoPuntoY - 100, window.innerHeight - 120)) + 'px';
    };

    new MutationObserver((cambios) => {
        cambios.forEach(c => c.addedNodes.forEach(n => {
            if (n.nodeType !== 1) return;
            if (n.classList.contains('modal-overlay')) ubicarVentanaEmergente(n);
            if (n.classList.contains('aviso-flotante')) ubicarAviso(n);
            n.querySelectorAll('.modal-overlay').forEach(ubicarVentanaEmergente);
            n.querySelectorAll('.aviso-flotante').forEach(ubicarAviso);
        }));
    }).observe(document.documentElement, { childList: true, subtree: true });

    // Los avisos simples del navegador están bloqueados en Google Sites: se reemplazan por un aviso propio
    const mostrarAvisoFlotante = (mensaje) => {
        const capa = document.createElement('div');
        capa.className = 'modal-overlay';
        capa.style.zIndex = '200';
        capa.innerHTML = `
            <div style="background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.25);max-width:440px;width:calc(100% - 32px);padding:20px;border-top:6px solid #ea580c;font-family:Inter,sans-serif;">
                <div style="font-weight:800;color:#1e293b;margin-bottom:8px;font-size:16px;">Aviso</div>
                <div class="aviso-texto" style="white-space:pre-line;font-size:14px;color:#475569;margin-bottom:16px;line-height:1.5;"></div>
                <div style="text-align:right;"><button type="button" style="background:#ea580c;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Entendido</button></div>
            </div>`;
        capa.querySelector('.aviso-texto').textContent = String(mensaje == null ? '' : mensaje);
        const cerrar = () => { capa.remove(); document.removeEventListener('keydown', teclado); };
        const teclado = (e) => { if (e.key === 'Escape' || e.key === 'Enter') cerrar(); };
        capa.querySelector('button').onclick = cerrar;
        capa.addEventListener('click', (e) => { if (e.target === capa) cerrar(); });
        document.addEventListener('keydown', teclado);
        document.body.appendChild(capa);
        capa.querySelector('button').focus();
    };
    window.alert = (mensaje) => mostrarAvisoFlotante(mensaje);

    // Carga bajo demanda de la librería para generar PDF
    const cargarJsPDF = () => new Promise((resolve, reject) => {
        const listo = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
        if (listo()) return resolve();
        const cargarScript = (src) => new Promise((ok, err) => {
            const existente = document.querySelector(`script[src="${src}"]`);
            if (existente) { if (existente.dataset.cargado) ok(); else existente.addEventListener('load', ok); return; }
            const s = document.createElement('script');
            s.src = src;
            s.onload = () => { s.dataset.cargado = '1'; ok(); };
            s.onerror = () => err(new Error('No se pudo cargar ' + src));
            document.head.appendChild(s);
        });
        cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
            .then(() => cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
            .then(() => listo() ? resolve() : reject(new Error('Librería PDF incompleta')))
            .catch(reject);
    });

    let db;
    let auth;
    
    try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
        
        // Habilitar persistencia para evitar errores si cae internet
        db.enablePersistence({ synchronizeTabs: true }).catch(err => {
            console.log("Persistencia no habilitada (posiblemente múltiples pestañas abiertas)", err.code);
        });

        console.log("Firebase SDK inicializado: Modo Colecciones Separadas");
    } catch (error) {
        console.error("Error crítico inicializando Firebase:", error);
    }

    // --- UTILS ---
    const toCamelCase = (s) => s.replace(/-./g, x => x[1].toUpperCase());
    const mapAttributes = (attrs) => {
        const newAttrs = {};
        for (const key in attrs) {
            if (key === 'class') newAttrs.className = attrs[key];
            else if (key.startsWith('stroke-') || key === 'stroke-width') newAttrs[toCamelCase(key)] = attrs[key];
            else newAttrs[key] = attrs[key];
        }
        return newAttrs;
    };

    const LucideIcon = ({ iconName, size = 24, className, ...props }) => {
        const iconDef = lucide.icons[iconName];
        if (!iconDef) return null;
        let tag = 'svg';
        let attrs = { xmlns: "http://www.w3.org/2000/svg", width: 24, height: 24, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
        let children = [];
        if (Array.isArray(iconDef)) {
            if (typeof iconDef[0] === 'string') { tag = iconDef[0]; attrs = { ...attrs, ...iconDef[1] }; children = iconDef[2]; } 
            else { children = iconDef; }
        }
        const createSvgElement = (childDef, index) => {
            const [childTag, childAttrs, childChildren] = childDef;
            return React.createElement(childTag, { ...mapAttributes(childAttrs), key: index }, childChildren ? childChildren.map(createSvgElement) : null);
        };
        return React.createElement(tag, { ...mapAttributes(attrs), width: size, height: size, className: className, ...props }, children && children.map(createSvgElement));
    };

    const { useState, useEffect, useRef } = React;

    const getAcademicYear = () => {
        const d = new Date();
        if (d.getMonth() === 11 && d.getDate() >= 20) return d.getFullYear() + 1;
        return d.getFullYear();
    };
        const formatFechaManual = (fechaStr) => {
    if (!fechaStr) return "";
    // El "T12:00:00" evita que la fecha cambie de día por la zona horaria
    const fecha = new Date(String(fechaStr).substring(0, 10) + "T12:00:00");
    if (isNaN(fecha.getTime())) return String(fechaStr); // Fecha mal escrita: se muestra tal cual, sin romper la página
    const opciones = { day: 'numeric', month: 'long', year: 'numeric' };
    try {
        return new Intl.DateTimeFormat('es-CL', opciones).format(fecha);
    } catch (e) {
        return String(fechaStr);
    }
    };


    // ==========================================
    // SISTEMA DE IMPRESIÓN
    // ==========================================
   const preparePrintContent = (element) => {
    const clone = element.cloneNode(true);
    const toRemove = clone.querySelectorAll('button, .no-print, .no-print-pdf, .modal-overlay, input[type="file"]');
    toRemove.forEach(el => el.remove());

        // NO eliminar el calendario de evaluaciones
    const calendario = clone.querySelector('.bg-white.rounded-xl.shadow-md.border.overflow-hidden');
    if (calendario && user) {
        // Obtener el nombre del docente actual (user está disponible en el contexto global)
        const docenteActual = user.name;
        
        // Eliminar todas las evaluaciones que no sean del docente actual
        const evaluaciones = calendario.querySelectorAll('.bg-green-100, .bg-indigo-50');
        evaluaciones.forEach(ev => {
            // Buscar el texto que identifica al docente - las evaluaciones muestran "EVALUACIÓN" o el nombre
            const textoEv = ev.textContent || '';
            // Si la evaluación no contiene el nombre del docente, eliminarla
            if (!textoEv.toLowerCase().includes(docenteActual.toLowerCase())) {
                ev.remove();
            }
        });
        
        // También limpiar días vacíos
        const dias = calendario.querySelectorAll('.bg-white.min-h-[100px]');
        dias.forEach(dia => {
            const tieneEvaluaciones = dia.querySelector('.bg-green-100, .bg-indigo-50');
            if (!tieneEvaluaciones) {
                // Limpiar el contenido del día excepto el número
                const numDia = dia.querySelector('span.text-xs');
                if (numDia) {
                    dia.innerHTML = '';
                    dia.appendChild(numDia);
                }
            }
        });
    }


    const inputs = clone.querySelectorAll('input, textarea, select');
    inputs.forEach(input => {
        const span = document.createElement('div');
        let val = input.value;
        
        if (input.type === 'checkbox') {
            val = input.checked ? '☒' : '☐';
            span.style.fontSize = '14pt';
            span.style.display = 'inline-block';
        } else if (input.tagName === 'SELECT') {
            val = input.options[input.selectedIndex]?.text || '-';
        } else if (input.type === 'date' && val) {
            // CAMBIO CLAVE: Formatear fecha del input al imprimir
            val = formatFechaManual(val);
        } else if (!val || val.trim() === '') {
            val = '____________________'; 
        }
        
        span.innerText = val;
        span.style.whiteSpace = 'pre-wrap';
        span.style.wordBreak = 'break-word';
        span.style.fontFamily = "'Times New Roman', serif";
        if (input.tagName === 'TEXTAREA' || input.type === 'text' || input.type === 'date') {
            span.style.border = 'none'; 
            span.style.padding = '0';
        }
        if(input.parentNode) {
            input.parentNode.replaceChild(span, input);
        }
    });
    
    return clone.innerHTML;
};



    const printDocument = (sourceId, title = 'Documento', isHtmlString = false) => {
        let contentHtml = '';
        if (isHtmlString) {
            contentHtml = sourceId; 
        } else {
            const element = document.getElementById(sourceId);
            if (!element) { alert("Error: No se encuentra el contenido para imprimir."); return; }
            contentHtml = preparePrintContent(element);
        }
        const printWindow = window.open('', '_blank', 'width=900,height=800');
        if (!printWindow) { alert("Por favor, permite las ventanas emergentes para descargar el documento."); return; }
        const doc = printWindow.document;
        doc.open();
        doc.write(`
            <html>
            <head>

                    @page { size: Letter; margin: 1.5cm; }
                    body { 
                        font-family: 'Times New Roman', serif; 
                        font-size: 11pt; 
                        line-height: 1.4;
                        color: #1e293b; 
                        background: #fff;
                    }
                    .pdf-session-card {
                        border: 1px solid #cbd5e1;
                        border-radius: 6px;
                        margin-bottom: 20px;
                        page-break-inside: avoid;
                        overflow: hidden;
                    }
                    .pdf-session-header {
                        background-color: #f8fafc;
                        padding: 10px 15px;
                        border-bottom: 2px solid #1e3a8a;
                        color: #1e3a8a;
                        display: flex;
                        justify-content: space-between;
                        font-weight: 800;
                        font-size: 11pt;
                        text-transform: uppercase;
                    }
                    .pdf-grid-row {
                        display: flex;
                        border-bottom: 1px solid #e2e8f0;
                    }
                    .pdf-grid-row:last-child { border-bottom: none; }
                    .pdf-cell-label {
                        width: 140px;
                        background-color: #f1f5f9;
                        padding: 8px 12px;
                        font-weight: bold;
                        font-size: 10pt;
                        border-right: 1px solid #cbd5e1;
                        display: flex;
                        align-items: center;
                        color: #475569;
                    }
                    .pdf-cell-content {
                        flex: 1;
                        padding: 8px 12px;
                        font-size: 10.5pt;

        }, [value]);

        // Si es HTML y no está en edición, mostrar vista previa
        if (isHtml && !isEditing && value && value.includes('<div')) {
            return (
                <div className="relative">
                    <div 
                        className={`${className} border border-gray-300 rounded p-2 bg-white overflow-auto`}

                            type="button"

                            Editar HTML

        }

        return ( 
            <textarea 
                ref={textareaRef}

    };
    const DeleteButton = ({ onClick }) => {
        // Agregamos un estado local para controlar la visibilidad del modal

    const ConfirmationModal = ({ isOpen, message, onConfirm, onCancel }) => { if (!isOpen) return null; return ( <div className="modal-overlay"> <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center border-2 border-red-500"> <LucideIcon iconName="AlertTriangle" size={48} className="text-red-500 mx-auto mb-4" /> <h3 className="text-lg font-bold text-gray-800 mb-2">¿Estás seguro?</h3> <p className="text-sm text-gray-600 mb-6">{message}</p> <div className="flex justify-center gap-4"> <button onClick={onCancel} className="px-4 py-2 rounded bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">Cancelar</button> <button onClick={onConfirm} className="px-4 py-2 rounded bg-red-600 text-white font-bold hover:bg-red-700">Sí, Eliminar</button> </div> </div> </div> ); };
    const UTPFeedbackControl = ({ data, onChange, currentUser, isApprover }) => {

        const updateStatus = (status) => {

    onChange({ 
        ...data, 
        estado: status, 
        approver: status === 'Aprobado' ? currentUser.name : (data.approver || ''),
        // Vincular los campos de auditoría

        monitoreadoPor: isNowMonitored ? currentUser.name : (data.monitoreadoPor || ''),

};
        return (
            <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mt-4 no-print-pdf"><h4 className="font-bold text-sm text-yellow-800 mb-2 flex items-center gap-2"><LucideIcon iconName="MessageSquare" size={16}/> Retroalimentación y Estado UTP</h4><div className="mb-3"><span className={`px-2 py-1 rounded text-xs font-bold uppercase border ${data.estado === 'Aprobado' ? 'bg-green-100 text-green-800 border-green-300' : data.estado === 'Rechazado' ? 'bg-red-100 text-red-800 border-red-300' : data.estado === 'Modificar' ? 'bg-orange-100 text-orange-800 border-orange-300' : 'bg-gray-100 text-gray-800'}`}>Estado Actual: {data.estado || 'Pendiente'}</span></div>{isApprover && (<div className="flex gap-2 mb-4"><button onClick={() => updateStatus('Aprobado')} className="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-green-700">Aprobar</button><button onClick={() => updateStatus('Modificar')} className="bg-orange-500 text-white px-3 py-1 rounded text-xs font-bold hover:bg-orange-600">Solicitar Modificación</button><button onClick={() => updateStatus('Rechazado')} className="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-red-700">Rechazar</button></div>)}<div className="space-y-2 mb-3 max-h-40 overflow-y-auto">{(data.comments || []).map((c, idx) => (<div key={idx} className="bg-white p-2 rounded border text-xs"><span className="font-bold text-slate-700">{c.author}</span> <span className="text-gray-400">({c.date})</span>:<p>{c.text}</p></div>))}</div><div className="flex gap-2"><input className="flex-1 border p-2 rounded text-xs" placeholder="Escribir comentario..." value={comment} onChange={e => setComment(e.target.value)} /><button onClick={addComment} className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">Comentar</button></div></div>
        );
    };
    const StatsGraph = ({ data, title }) => { const maxVal = Math.max(...data.map(d => d.value), 1); const barHeight = 20; const gap = 10; const width = 300; return ( <div className="border rounded p-4 bg-white shadow-sm"><h5 className="font-bold text-xs text-center mb-2 uppercase">{title}</h5><svg width="100%" height={data.length * (barHeight + gap)} viewBox={`0 0 ${width} ${data.length * (barHeight + gap)}`}>{data.map((d, i) => (<g key={i}><text x="0" y={i * (barHeight + gap) + 15} fontSize="10" fill="#333" width="100">{d.label.substring(0, 15)}</text><rect x="100" y={i * (barHeight + gap)} width={(d.value / maxVal) * (width - 130)} height={barHeight} fill={d.color || "#3b82f6"} rx="4" /><text x={105 + (d.value / maxVal) * (width - 130)} y={i * (barHeight + gap) + 15} fontSize="10" fill="#666">{d.value}</text></g>))}</svg></div> ); };

          // ==========================================
    // NUEVO: CONFIRMACIÓN PROPIA (funciona dentro de Google Sites, donde las ventanas del navegador están bloqueadas)
    // ==========================================
    const DialogoConfirmacion = ({ datos, onCerrar }) => {
        const [texto, setTexto] = useState('');
        const [motivo, setMotivo] = useState(datos?.motivoInicial || '');
        const [trabajando, setTrabajando] = useState(false);
        if (!datos) return null;

        const bloqueado = !!datos.requiereTexto && texto.trim().toUpperCase() !== datos.requiereTexto;

            yellow: 'bg-yellow-500 hover:bg-yellow-600',

        const confirmar = async () => {
            if (bloqueado || trabajando) return;

        return ReactDOM.createPortal(
            <div className="modal-overlay" style={{ zIndex: 90 }} onClick={() => !trabajando && onCerrar()}>

                    <h3 className="font-black text-lg text-slate-800 mb-2">{datos.titulo}</h3>

                    {datos.conMotivo && (

                        <div className="mb-4">
                            <label className="text-xs font-bold text-slate-500 block mb-1">Para confirmar, escriba <strong className="text-red-600">{datos.requiereTexto}</strong></label>
                            <input className="w-full border-2 border-slate-200 rounded-lg p-2 text-sm font-bold uppercase" value={texto} onChange={e => setTexto(e.target.value)} autoFocus />

                        <button type="button" onClick={onCerrar} disabled={trabajando} className="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-bold text-sm hover:bg-gray-300 disabled:opacity-50">Cancelar</button>
                        <button type="button" onClick={confirmar} disabled={bloqueado || trabajando} className={`px-4 py-2 rounded-lg text-white font-bold text-sm disabled:opacity-40 ${colores[datos.color] || colores.teal}`}>
                            {trabajando ? 'Procesando...' : (datos.textoBoton || 'Confirmar')}

                    </div>
                </div>
            </div>,
            document.body
        );
    };

    // ==========================================
    // CARGA DE DOCUMENTOS EXTERNOS A GOOGLE DRIVE (SIN LÍMITE DE TAMAÑO, CON BARRA DE AVANCE)
    // ==========================================
    const DocumentoExternoUploader = ({ titulo, descripcionAyuda, documento, disabled, meta = {}, onGuardar, setNotification }) => {
                const [subiendo, setSubiendo] = useState(false);
        const [progreso, setProgreso] = useState(0);
        const [nombreEnCurso, setNombreEnCurso] = useState('');
        const [error, setError] = useState('');
        const [dialogo, setDialogo] = useState(null);
        const inputRef = useRef(null);

        // NUEVO: permite vincular un archivo que ya está en Drive, sin volver a subirlo
        const [mostrarEnlace, setMostrarEnlace] = useState(false);
        const [enlaceManual, setEnlaceManual] = useState('');
        const [nombreEnlace, setNombreEnlace] = useState('');
        const [guardandoEnlace, setGuardandoEnlace] = useState(false);

        const limpiarTexto = (t) => String(t || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');

                const formatoTamano = (b) => {
            if (!b) return '';
            if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            return Math.max(1, Math.round(b / 1024)) + ' KB';
        };

        // NUEVO: obtiene el identificador del archivo desde la dirección de Drive (para la vista previa)
        const extraerIdDrive = (direccion) => {
            const t = String(direccion || '');
            const m = t.match(/\/d\/([a-zA-Z0-9_-]{15,})/)
                || t.match(/[?&]id=([a-zA-Z0-9_-]{15,})/)
                || t.match(/\/file\/d\/([a-zA-Z0-9_-]{15,})/);
            return m ? m[1] : '';
        };

        // NUEVO: vincula un archivo que ya está en Drive usando solo su enlace
        const guardarEnlaceManual = async () => {
            const direccion = enlaceManual.trim();
            setError('');
            if (!direccion) { setError('Pegue el enlace del archivo que está en Drive.'); return; }
            if (!/^https?:\/\//i.test(direccion)) { setError('El enlace debe comenzar con https://'); return; }

            const nombre = nombreEnlace.trim() || 'Documento enlazado desde Drive';
            const info = {
                fileId: extraerIdDrive(direccion),
                url: direccion,
                esEnlace: true,
                nombre,
                nombreOriginal: nombre,
                tipoMime: '',
                tamano: 0,
                fechaSubida: new Date().toLocaleString('es-CL'),
                subidoPor: meta.usuario || meta.docente || ''
            };

            setGuardandoEnlace(true);
            try {
                const ok = await onGuardar(info);
                if (ok === false) {
                    setError('No se pudo vincular el enlace a la plataforma. Intente nuevamente.');
                } else {
                    setEnlaceManual('');
                    setNombreEnlace('');
                    setMostrarEnlace(false);
                    if (setNotification) setNotification({ message: 'Enlace de Drive vinculado correctamente', type: 'success' });
                }
            } catch (err) {
                console.error(err);
                setError('No se pudo vincular el enlace. ' + (err && err.message ? err.message : ''));
            } finally {
                setGuardandoEnlace(false);
            }
        };

        const handleArchivo = async (e) => {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            setError('');
            if (!file.size) { setError('El archivo seleccionado está vacío.'); return; }

            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const fecha = new Date().toISOString().slice(0, 10);
            const nombreArchivo = [meta.tipo, meta.asignatura, meta.curso, meta.unidad ? `U${meta.unidad}` : '', meta.docente, fecha]
                .filter(Boolean).map(limpiarTexto).join('_') + (ext ? `.${ext}` : '');

            setSubiendo(true);
            setProgreso(0);
            setNombreEnCurso(`file.name({formatoTamano(file.size)})`);
            try {
                const r = await subirArchivoADrive(file, {
                    nombreArchivo,
                    docente: meta.docente || 'Sin docente',
                    anio: meta.anio || getAcademicYear(),
                    carpeta: meta.carpeta || 'Planificaciones',
                    descripcion: `${meta.tipo || ''} - ${meta.asignatura || ''} - meta.curso||''{meta.unidad ? ' - Unidad ' + meta.unidad : ''}`
                }, (p) => setProgreso(p));

                const info = {
                    fileId: r.fileId,
                    url: r.url,
                    nombre: r.nombre || nombreArchivo,
                    nombreOriginal: file.name,
                    tipoMime: file.type || '',
                    tamano: file.size,
                    fechaSubida: new Date().toLocaleString('es-CL'),
                    subidoPor: meta.usuario || meta.docente || ''
                };
                const ok = await onGuardar(info);
                if (ok === false) {
                    setError('El archivo quedó guardado en Drive, pero no se pudo vincular a la plataforma. Intente nuevamente.');
                } else if (setNotification) {
                    setNotification({ message: 'Documento guardado en Drive y vinculado a la plataforma', type: 'success' });
                }
            } catch (err) {
                console.error(err);
                setError('No fue posible subir el documento. ' + (err && err.message ? err.message : ''));
            } finally {
                setSubiendo(false);
            }
        };

        const handleQuitar = () => {
            setDialogo({
                id: Date.now(),
                titulo: 'Desvincular documento',
                mensaje: 'El documento dejará de verse en la plataforma, pero seguirá guardado en la carpeta de Drive.',
                textoBoton: 'Desvincular',
                color: 'red',
                alConfirmar: async () => {
                    const ok = await onGuardar(null);
                    if (ok !== false && setNotification) setNotification({ message: 'Documento desvinculado', type: 'success' });
                }
            });
        };

        return (
            <div className="bg-sky-50 border-2 border-sky-200 rounded-xl p-4 no-print-pdf">
                {dialogo && <DialogoConfirmacion key={dialogo.id} datos={dialogo} onCerrar={() => setDialogo(null)} />}

                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div className="flex items-start gap-3 min-w-0">
                        <div className="bg-white p-2 rounded-lg border border-sky-200 shrink-0">
                            <LucideIcon iconName="UploadCloud" size={22} className="text-sky-600"/>
                        </div>
                        <div className="min-w-0">
                            <h4 className="font-bold text-sky-900 text-sm">{titulo}</h4>
                            <p className="text-[11px] text-sky-700">{descripcionAyuda}</p>
                        </div>
                    </div>
                                        {!disabled && (
                        <div className="flex gap-2 shrink-0 flex-wrap">
                            <input ref={inputRef} type="file" className="hidden" onChange={handleArchivo} />
                            <button type="button" onClick={() => inputRef.current && inputRef.current.click()} disabled={subiendo} className="bg-sky-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-sky-700 flex items-center gap-2 disabled:opacity-60">
                                {subiendo
                                    ? <><div className="spinner" style={{ width: 16, height: 16, borderWidth: 2 }}></div> Subiendo {progreso}%</>
                                    : <><LucideIcon iconName="Upload" size={14}/> {documento ? 'Reemplazar documento' : 'Cargar documento'}</>}
                            </button>
                            <button type="button" onClick={() => { setMostrarEnlace(v => !v); setError(''); }} disabled={subiendo} className="bg-white border-2 border-sky-300 text-sky-800 px-4 py-2 rounded-lg text-xs font-bold hover:bg-sky-100 flex items-center gap-2 disabled:opacity-60">
                                <LucideIcon iconName="Link" size={14}/> {mostrarEnlace ? 'Cerrar enlace' : 'Pegar enlace'}
                            </button>
                        </div>
                    )}
                </div>

                {/* NUEVO: vincular un archivo que ya está en Drive con solo su enlace */}
                {!disabled && mostrarEnlace && (
                    <div className="mt-3 bg-white border-2 border-sky-200 rounded-lg p-3">
                        <p className="text-[11px] text-sky-800 font-bold mb-2">
                            Si el documento ya está en Drive, pegue aquí su enlace. No es necesario volver a subirlo.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input
                                className="flex-1 border-2 border-slate-200 p-2 rounded text-xs"
                                placeholder="https://drive.google.com/file/d/..."
                                value={enlaceManual}
                                onChange={e => setEnlaceManual(e.target.value)}
                            />
                            <input
                                className="flex-1 border-2 border-slate-200 p-2 rounded text-xs"
                                placeholder="Nombre del documento (opcional)"
                                value={nombreEnlace}
                                onChange={e => setNombreEnlace(e.target.value)}
                            />
                            <button type="button" onClick={guardarEnlaceManual} disabled={guardandoEnlace} className="bg-sky-700 text-white px-4 py-2 rounded text-xs font-bold hover:bg-sky-800 disabled:opacity-50 shrink-0">
                                {guardandoEnlace ? 'Vinculando...' : 'Vincular enlace'}
                            </button>
                        </div>
                        <p className="text-[10px] text-slate-500 mt-2">
                            Importante: el archivo debe estar compartido con el colegio para que UTP pueda abrirlo.
                        </p>
                    </div>
                )}

                {subiendo && (
                    <div className="mt-3 bg-white border border-sky-200 rounded-lg p-3">
                        <div className="flex justify-between text-[11px] font-bold text-sky-800 mb-1 gap-2">
                            <span className="truncate">{nombreEnCurso}</span>
                            <span className="shrink-0">{progreso}%</span>
                        </div>
                        <div className="w-full h-3 bg-sky-100 rounded-full overflow-hidden">
                            <div className="h-full bg-sky-600 transition-all duration-300" style={{ width: `${progreso}%` }}></div>
                        </div>
                        <p className="text-[10px] text-slate-500 mt-1">No cierre esta ventana hasta que termine la carga.</p>
                    </div>
                )}

                {error && (
                    <div className="mt-3 bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 text-xs font-bold flex justify-between gap-2">
                        <span>{error}</span>
                        <button type="button" onClick={() => setError('')} className="shrink-0 text-red-500 hover:text-red-800">✕</button>
                    </div>
                )}

                {documento ? (
                    <div className="mt-3 bg-white border border-sky-200 rounded-lg p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                <div className="min-w-0">
                            <div className="text-xs font-bold text-slate-800 truncate">{documento.esEnlace ? '🔗' : '📎'} {documento.nombreOriginal || documento.nombre}</div>
                            <div className="text-[10px] text-slate-500">
                                {documento.esEnlace ? 'Enlace vinculado el ' : 'Subido el '}{documento.fechaSubida}{documento.subidoPor ? ` por ${documento.subidoPor}` : ''}{documento.tamano ? ` · ${formatoTamano(documento.tamano)}` : ''}{documento.esEnlace ? ' · Enlace de Drive' : ''}
                            </div>
                        </div>
                        <div className="flex gap-2 shrink-0">
                            <a href={documento.url} target="_blank" rel="noopener noreferrer" className="bg-green-600 text-white px-3 py-1.5 rounded text-[11px] font-bold hover:bg-green-700 flex items-center gap-1">
                                <LucideIcon iconName="ExternalLink" size={12}/> Abrir en Drive

                                <button type="button" onClick={handleQuitar} className="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded text-[11px] font-bold hover:bg-red-100">
                                    Desvincular
                                </button>
                            )}
                        </div>
                    </div>
                ) : (
                    !subiendo && <p className="mt-3 text-[11px] italic text-slate-500">Aún no se ha cargado un documento para esta sección.</p>
                )}
            </div>
        );
    };

    // ==========================================
    // NUEVO: PANEL DE SEGUIMIENTO (CRONOGRAMAS Y UNIDADES)
    // UTP / Coordinación pueden monitorear. Docentes solo ven el estado.
    // ==========================================
    const MonitoreoSeguimientoPanel = ({ dbData, setDbData, currentUser, docentes, puedeMonitorear, setNotification, titulo }) => {
        const [busqueda, setBusqueda] = useState('');
        const [filtroEstado, setFiltroEstado] = useState('todos');
        const [ocultarVacios, setOcultarVacios] = useState(true);
                const [visor, setVisor] = useState(null);
        const [comentario, setComentario] = useState('');
                const [pestanaVisor, setPestanaVisor] = useState('plataforma');

        // NUEVO: separación del monitoreo por ciclo
        const [filtroCiclo, setFiltroCiclo] = useState('todos');
        const CICLOS_MONITOREO = [
            { id: 'todos', nombre: 'Todos los ciclos' },
            { id: 'c1', nombre: '1° a 4° Básico' },
            { id: 'c2', nombre: '5° a 8° Básico' },
            { id: 'm', nombre: 'Enseñanza Media' },
            { id: 'otro', nombre: 'Sin clasificar' }
        ];
        const cicloDeNivel = (nivel) => {
            const n = String(nivel || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            const num = parseInt((n.match(/\d+/) || [])[0], 10);
            if (!num) return 'otro';
            if (n.includes('basic')) return num <= 4 ? 'c1' : (num <= 8 ? 'c2' : 'otro');
            if (n.includes('medio')) return num <= 4 ? 'm' : 'otro';
            return 'otro';
        };

               // NUEVO: reporte PDF con firmas
        const [showReporte, setShowReporte] = useState(false);
        const [repFirmantes, setRepFirmantes] = useState([]);
        const [repIncluirVacios, setRepIncluirVacios] = useState(false);
        const [repIncluirComentarios, setRepIncluirComentarios] = useState(true); // NUEVO: respaldo de comentarios en el PDF
        const [repObservaciones, setRepObservaciones] = useState('');
        const [repVerTodos, setRepVerTodos] = useState(false);

                        head: [['Docente', 'Asignatura / Curso', 'Instrumento', 'Fecha', 'Registrado por', 'Comentario']],
                        body: comentariosPDF,
                        styles: { fontSize: 7.5, cellPadding: 1.8, valign: 'top', lineColor: [148, 163, 184], lineWidth: 0.1, textColor: [15, 23, 42], overflow: 'linebreak' },
                        headStyles: { fillColor: [180, 83, 9], textColor: 255, fontStyle: 'bold', halign: 'center' },
                        alternateRowStyles: { fillColor: [254, 252, 232] },
                        columnStyles: {
                            0: { cellWidth: 42 }, 1: { cellWidth: 45 }, 2: { cellWidth: 26 },
                            3: { cellWidth: 20, halign: 'center' }, 4: { cellWidth: 32 }, 5: { cellWidth: 'auto' }
                        },
                        margin: { left: 14, right: 14, bottom: 16 }
                    });
                    yFin = (doc.lastAutoTable?.finalY || yFin) + 8;
                }

                // Observaciones
                if (repObservaciones.trim()) {
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
                    const lineas = doc.splitTextToSize(repObservaciones.trim(), ancho - 28);
                    const altoObs = 7 + lineas.length * 4.2;
                    if (yFin + altoObs > alto - 20) { doc.addPage(); yFin = 20; }
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(15, 23, 42);
                    doc.text('Observaciones del monitoreo:', 14, yFin);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(51, 65, 85);
                    doc.text(lineas, 14, yFin + 5);
                    yFin += altoObs + 4;
                }

                // Firmas
                const porFila = Math.min(3, repFirmantes.length);
                const anchoFirma = (ancho - 28) / porFila;
                const altoBloque = 34;
                if (yFin + 8 + altoBloque > alto - 16) { doc.addPage(); yFin = 20; }
                doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(15, 23, 42);
                doc.text('Firmas de responsables del monitoreo', 14, yFin);
                yFin += 4;
                repFirmantes.forEach((f, k) => {
                    const col = k % porFila;
                    if (col === 0 && k > 0) yFin += altoBloque;
                    if (col === 0 && yFin + altoBloque > alto - 16) { doc.addPage(); yFin = 20; }
                    const cxF = 14 + col * anchoFirma + anchoFirma / 2;
                    const yLinea = yFin + 20;
                    doc.setDrawColor(71, 85, 105); doc.setLineWidth(0.3);
                    doc.line(cxF - 32, yLinea, cxF + 32, yLinea);
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(15, 23, 42);
                    const lineasNombre = doc.splitTextToSize(String(f.nombre || '').toUpperCase(), anchoFirma - 10);
                    doc.text(lineasNombre, cxF, yLinea + 4.5, { align: 'center' });
                    if (f.cargo) {
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(71, 85, 105);
                        doc.text(doc.splitTextToSize(f.cargo, anchoFirma - 10), cxF, yLinea + 4.5 + lineasNombre.length * 3.8, { align: 'center' });
                    }
                });

                // Pie de página
                const total = doc.internal.getNumberOfPages();
                for (let i = 1; i <= total; i++) {
                    doc.setPage(i);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(148, 163, 184);
                    doc.text('Colegio Marina de Chile - Informe de monitoreo generado por la plataforma de gestión', 14, alto - 8);
                    doc.text(`Página ${i} de ${total}`, ancho - 14, alto - 8, { align: 'right' });
                }

                doc.save(`Informe_Monitoreo_${new Date().toISOString().slice(0, 10)}.pdf`);
                setShowReporte(false);
                if (setNotification) setNotification({ message: 'Reporte PDF del monitoreo generado', type: 'success' });
            } catch (err) {
                console.error(err);
                setRepError('No fue posible generar el PDF. Revise su conexión a internet e inténtelo nuevamente.');
            } finally {
                setRepGenerando(false);
            }
        };

                const renderTarjeta = (fila, item) => {
            const ev = estadoVisual(item);
            const mon = !!item.registro?.monitoreado;
            const etiqueta = item.tipo === 'crono' ? 'Cronograma' : `Unidad ${item.numero}`;
            return (
                <div key={`item.tipo-{item.numero}`} className={`rounded-lg border p-2 text-[10px] flex flex-col gap-1 min-w-0 overflow-hidden ${ev.clase}`} title={item.nombre}>
                    <div className="flex items-center justify-between gap-1 min-w-0">
                        <span className="font-black uppercase truncate">{etiqueta}</span>
                        <span className="flex items-center gap-0.5 shrink-0">
                            {item.registro?.documentoExterno && <span title="Tiene documento en Drive">📎</span>}
                            {(item.registro?.comments || []).length > 0 && <span title="Comentarios para el docente">💬{(item.registro?.comments || []).length}</span>}
                            {mon && <span title={`Monitoreado por ${item.registro.monitoreadoPor || '-'} el ${item.registro.fechaMonitoreo || '-'}`}>👁️</span>}
                        </span>
                    </div>
                    <div className="font-bold uppercase truncate">{ev.texto}</div>
                    <div className={`text-[9px] truncate ${item.hayContenido ? (mon ? 'text-teal-700 font-bold' : 'opacity-70') : 'opacity-60'}`}>
                        {item.hayContenido ? (mon ? '✓ Monitoreado' : 'Sin monitorear') : 'Sin documento'}
                    </div>
                                        {(item.hayContenido || puedeMonitorear || (item.registro?.comments || []).length > 0) && (
                        <div className="flex flex-wrap gap-1 mt-auto pt-1">
                            {item.hayContenido ? (
                                <button type="button" onClick={() => abrirVisor(fila, item)} className="flex-1 min-w-[44px] bg-white/80 border border-slate-300 text-slate-700 rounded px-1 py-0.5 font-bold hover:bg-white">Ver</button>
                            ) : (
                                <button type="button" onClick={() => abrirVisor(fila, item)} className="flex-1 min-w-[44px] bg-white/80 border border-amber-400 text-amber-800 rounded px-1 py-0.5 font-bold hover:bg-amber-50" title="Dejar o leer comentarios para el docente">
                                    💬 {puedeMonitorear ? 'Comentar' : 'Ver'}
                                </button>
                            )}
                            {puedeMonitorear && item.hayContenido && (
                                <button
                                    type="button"
                                    onClick={() => aplicarAccion(item, mon ? 'QuitarVisto' : 'Visto')}
                                    className={`flex-1 min-w-[44px] rounded px-1 py-0.5 font-bold border ${mon ? 'bg-teal-600 text-white border-teal-700' : 'bg-white border-teal-500 text-teal-700 hover:bg-teal-50'}`}
                                    title={mon ? 'Quitar marca de monitoreo' : 'Marcar como monitoreado'}
                                >
                                    {mon ? '✓ Visto' : 'Visto'}
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const renderContenidoPlataforma = (item) => {
            const r = item.registro;
            if (!r) return <p className="text-xs italic text-slate-400">No hay registro en la plataforma.</p>;
            if (item.tipo === 'crono') {
                return (
                    <div className="overflow-x-auto">
                        <table className="w-full text-xs border-collapse">
                            <thead className="bg-slate-100">
                                <tr>
                                    <th className="border p-2 text-left">Unidad</th>
                                    <th className="border p-2 text-left">OA</th>
                                    <th className="border p-2 text-center">Meses</th>
                                    <th className="border p-2 text-center">Ses.</th>
                                </tr>
                            </thead>
                            <tbody>
                                {(r.unidades || []).map(u => (
                                    <tr key={u.numero}>
                                        <td className="border p-2 font-bold">U{u.numero}: {u.nombre || '-'}</td>
                                        <td className="border p-2 whitespace-pre-wrap">{u.oa || '-'}</td>
                                        <td className="border p-2 text-center">{(u.meses || []).join(', ') || '-'}</td>
                                        <td className="border p-2 text-center">{u.sesiones || 0}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                );
            }
            const sesiones = r.sesiones || [];
            const conContenido = sesiones.filter(s => s.contenido || s.objetivoClase).length;
            return (
                <div className="space-y-3">
                    <div className="text-xs"><strong>Unidad:</strong> {r.descripcion || '-'}</div>
                    <div className="bg-slate-50 p-3 rounded border text-xs whitespace-pre-wrap">{r.oaGlobal || 'Sin OA registrados.'}</div>
                    {r.documentoExterno ? (
                        <div className="text-xs font-bold text-teal-700 bg-teal-50 border border-teal-200 rounded p-2">
                            ✓ Unidad completa por documento adjunto{r.sesionesDocumento ? ` (${r.sesionesDocumento} sesiones)` : ''}. Clases escritas en la plataforma: {conContenido} de {sesiones.length}.
                        </div>
                    ) : (
                        <div className="text-xs font-bold text-slate-600">Clases con contenido: {conContenido} de {sesiones.length}</div>
                    )}
                    <div className="max-h-72 overflow-y-auto border rounded divide-y">
                        {sesiones.length === 0 && <p className="p-3 text-xs italic text-slate-400">Sin clases registradas.</p>}
                        {sesiones.map((s, i) => (
                            <div key={i} className="p-2 text-xs">
                                <strong>Clase {s.n}{s.esEvaluacion ? ' (Evaluación)' : ''}:</strong> {s.objetivoClase || s.contenido || <em className="text-slate-400">Sin planificar</em>}
                                {s.actividadCentral && (
                                    <div className="text-slate-500 mt-1">{s.actividadCentral.substring(0, 220)}{s.actividadCentral.length > 220 ? '…' : ''}</div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        return (
            <div className="bg-white p-6 rounded-xl border-2 border-teal-100 shadow-xl no-print-pdf">
                <div className="flex flex-col md:flex-row justify-between md:items-center gap-3 mb-4">
                    <h4 className="font-black text-teal-900 flex items-center gap-2 text-lg">
                        <LucideIcon iconName="ListChecks" size={24} className="text-teal-600"/>

                    </h4>
                    {!puedeMonitorear && (

                    <div className="bg-teal-50 p-3 rounded-xl border border-teal-100 text-center"><div className="text-[10px] font-bold uppercase text-teal-600">Monitoreados</div><div className="text-2xl font-black text-teal-700">{totalMonitoreados}</div></div>

                    <div className="bg-sky-50 p-3 rounded-xl border border-sky-100 text-center"><div className="text-[10px] font-bold uppercase text-sky-600">En Drive 📎</div><div className="text-2xl font-black text-sky-700">{totalDrive}</div></div>

                                {/* NUEVO: monitoreo separado por ciclo */}
                <div className="flex flex-wrap gap-1 mb-3 border-b-2 border-teal-200">

                            key={c.id}
                            type="button"
                            onClick={() => setFiltroCiclo(c.id)}

                        >
                            {c.nombre}
                            <span className={`text-[10px] px-2 py-0.5 rounded-full ${filtroCiclo === c.id ? 'bg-teal-600 text-white' : 'bg-slate-300 text-slate-700'}`}>
                                {conteoCiclos[c.id] || 0}
                            </span>
                        </button>
                    ))}
                </div>

                <div className="flex flex-wrap gap-3 items-center mb-4 bg-slate-50 p-3 rounded-lg border">
                    <input className="border p-2 rounded text-sm flex-1 min-w-[200px]" placeholder="Buscar docente, asignatura o curso..." value={busqueda} onChange={e => setBusqueda(e.target.value)} />
                    <select className="border p-2 rounded text-sm font-bold" value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)}>
                        <option value="todos">Todos</option>
                        <option value="pendientes">Con instrumentos por monitorear</option>
                        <option value="monitoreados">Todo monitoreado</option>
                        <option value="drive">Con documento en Drive</option>
                    </select>
                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer">
                        <input type="checkbox" checked={ocultarVacios} onChange={e => setOcultarVacios(e.target.checked)} /> Ocultar cursos sin registros
                    </label>
                                        <a href={DRIVE_CARPETA_URL} target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-sky-700 underline flex items-center gap-1">
                        <LucideIcon iconName="FolderOpen" size={14}/> Carpeta de Drive
                    </a>
                    {puedeMonitorear && (
                        <button type="button" onClick={abrirReporte} className="ml-auto bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-black flex items-center gap-2 shadow">
                            <LucideIcon iconName="FileDown" size={14}/> Reporte PDF con firmas
                        </button>
                    )}
                </div>

                                <div className="space-y-3">
                    {filasVisibles.length === 0 ? (
                        <div className="p-8 text-center italic text-slate-400 border-2 border-dashed rounded-xl">No hay registros para los filtros seleccionados.</div>
                    ) : filasVisibles.map(f => (
                        <div key={f.id} className="border border-slate-200 rounded-xl p-3 bg-white hover:border-teal-300 transition-colors">
                            <div className="flex flex-wrap items-start justify-between gap-x-4 gap-y-1 mb-2">
                                <div className="min-w-0 flex-1">
                                    <div className="font-black text-slate-800 uppercase text-xs break-words">{f.docente.name}</div>
                                    <div className="text-[10px] text-slate-400 font-bold">{f.docente.depto || ''}</div>
                                </div>
                                <div className="min-w-0 flex-1 text-left sm:text-right">
                                    <div className="font-bold text-teal-800 text-sm break-words">{f.asignatura}</div>
                                    <div className="text-[10px] text-slate-500 font-black uppercase break-words">{f.curso}</div>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                                {renderTarjeta(f, f.crono)}
                                {f.unidades.map(u => renderTarjeta(f, u))}
                            </div>
                        </div>
                    ))}
                </div>

                {/* NUEVO: VENTANA DEL REPORTE PDF CON FIRMAS */}
                {showReporte && ReactDOM.createPortal(
                    <div className="modal-overlay" style={{ zIndex: 85 }} onClick={() => !repGenerando && setShowReporte(false)}>
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl mx-4 flex flex-col animate-pop-in overflow-hidden" style={{ maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
                            <div className="p-4 border-b flex justify-between items-start gap-3 shrink-0">
                                <div className="min-w-0">
                                    <h3 className="font-black text-lg text-slate-800 flex items-center gap-2">
                                        <LucideIcon iconName="FileDown" size={22} className="text-teal-600"/> Reporte PDF del monitoreo
                                    </h3>
                                    <p className="text-xs text-slate-500">Se incluirán {filasReporte.length} curso(s) según los filtros aplicados{repIncluirVacios ? ', incluidos los que aún no tienen registros' : ''}.</p>
                                </div>
                                <button onClick={() => setShowReporte(false)} disabled={repGenerando} className="text-gray-400 hover:text-red-500 shrink-0"><LucideIcon iconName="X" size={24}/></button>
                            </div>

                            <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-5">
                                {/* 1. Seleccionar firmantes */}
                                <div>
                                    <div className="flex justify-between items-center mb-2 gap-2 flex-wrap">
                                        <h4 className="text-xs font-black uppercase text-slate-600">1. Personas que firman el reporte</h4>
                                        <label className="flex items-center gap-2 text-[11px] font-bold text-slate-500 cursor-pointer">
                                            <input type="checkbox" checked={repVerTodos} onChange={e => setRepVerTodos(e.target.checked)} /> Mostrar todos los funcionarios
                                        </label>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto border rounded-lg p-2 bg-slate-50">
                                        {candidatosFirma.length === 0 && <p className="text-xs italic text-slate-400 p-2">No hay funcionarios disponibles.</p>}
                                        {candidatosFirma.map(u => {

                                            return (
                                                <label key={u.uid} className={`flex items-start gap-2 p-2 rounded border cursor-pointer text-xs ${marcado ? 'bg-teal-50 border-teal-400' : 'bg-white border-slate-200 hover:border-teal-300'}`}>
