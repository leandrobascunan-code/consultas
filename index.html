<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Asistente IA Educativa · SLEP Andalién Sur</title>
  <meta name="description" content="Chat de consultas para diseñar material con IA de forma ética, basado en los manuales del SLEP Andalién Sur, orientaciones MINEDUC y la Ley 21.719.">

  <!-- Aplicación instalable (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0071ea">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Asistente IA">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <!-- ========== BARRA LATERAL ========== -->
    <aside class="sidebar" id="sidebar" aria-label="Temas y fuentes">
      <div class="franja" aria-hidden="true"></div>
      <div class="brand">
        <img src="logo-slep.png" alt="Servicio Local de Educación Pública Andalién Sur" class="brand-logo">
        <button class="icon-btn only-mobile" id="btnCerrarMenu" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="btn-nueva" id="btnNueva">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nueva conversación
      </button>

      <button class="btn-wizard" id="btnWizard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4 5 5L9 20H4v-5z"/><path d="m13 6 5 5"/></svg>
        Diseñar material con IA
      </button>

      <a class="btn-biblioteca" href="manuales.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        Biblioteca: manuales y documentos
      </a>

      <button class="perfil" id="perfil" type="button" data-accion="perfil-iniciar" data-valor="x"></button>

      <nav class="temas" id="temas" aria-label="Temas por manual"></nav>

      <button class="btn-instalar" id="btnInstalar" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Instalar como aplicación
      </button>

      <div class="modo" id="modo"></div>
    </aside>
    <div class="overlay" id="overlay" hidden></div>

    <!-- ========== ZONA PRINCIPAL ========== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btnMenu" aria-label="Abrir menú de temas">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <img src="icon-192.png" alt="" class="topbar-icono" aria-hidden="true">
        <div class="topbar-title">
          <h1>Asistente IA Educativa</h1>
          <p>Diseña material con IA de forma ética y segura</p>
        </div>
        <button class="icon-btn" id="btnInstalarTop" aria-label="Instalar como aplicación" title="Instalar como aplicación" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="icon-btn" id="btnTema" aria-label="Cambiar tema claro/oscuro" title="Tema claro/oscuro">
          <svg class="ico-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-luna" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <!-- Pantalla de bienvenida -->
        <div class="bienvenida" id="bienvenida">
          <!-- La presentación la hace el robot en el primer mensaje del chat (app.js) -->
          <div class="sugerencias" id="sugerencias"></div>
        </div>

        <div class="mensajes" id="mensajes"></div>

        <!-- Créditos al final de la portada (bajo las preguntas iniciales) -->
        <section class="elaborado" id="elaborado" aria-label="Elaborado por">
          <span>Manuales elaborados por</span>
          <img src="logos-establecimientos.jpg" alt="Colegio Marina de Chile, Colegio República del Brasil, Escuela Balmaceda Saavedra y Colegio John F. Kennedy" loading="lazy">
        </section>
      </section>

      <footer class="composer">
        <form id="formulario" class="composer-box">
          <label for="entrada" class="sr-only">Escribe tu consulta</label>
          <textarea id="entrada" rows="1" placeholder="Escribe tu consulta…" maxlength="4000"></textarea>
          <button type="submit" id="btnEnviar" class="btn-enviar" aria-label="Enviar consulta">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <p class="composer-nota">Las respuestas se basan en propuestas técnicas, no en lineamientos vigentes. Verifica siempre la información y la normativa en fuentes oficiales.</p>
      </footer>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="conocimiento.js"></script>
  <script src="establecimientos.js"></script>
  <script src="app.js"></script>
</body>
</html>
