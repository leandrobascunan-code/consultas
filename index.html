                                                        <td className="border border-black p-2 text-center font-bold text-orange-700">{monitoreados > 0 ? `✓ ${monitoreados}` : '-'}</td>
                                                    </tr>
                                                );
                                            }) : (<tr><td colSpan="5" className="p-4 text-center italic">Cargando datos del profesorado...</td></tr>)}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* SOLUCIÓN 3: NUEVAS VISTAS AGREGADAS */}
                        {reporteType === 'carga_oficial' && (
                            <div id="reporte-carga-oficial" className="bg-white p-6 rounded-xl border shadow-sm animate-fade-in">
                                <div className="flex justify-between items-center mb-4 no-print-pdf">
                                    <h4 className="font-bold text-teal-800 text-lg">Nómina Oficial de Carga Académica</h4>
                                    <button onClick={() => printDocument('reporte-carga-oficial', 'Reporte_Carga_Oficial')} className="bg-blue-800 text-white px-4 py-2 rounded-lg font-bold flex gap-2 text-xs shadow hover:bg-blue-900 transition-all">
                                        <LucideIcon iconName="Printer" size={14}/> Imprimir Nómina
                                    </button>
                                </div>
                                <OfficialHeader user={user} context={{year: getAcademicYear()}} docTitle="Nómina Oficial de Carga Académica" logoUrl={dbData.config.schoolLogo} />
                                <div className="mt-6">
                                    <table className="w-full text-sm border-collapse border border-black">
                                        <thead className="bg-slate-100 uppercase font-black">
                                            <tr>
                                                <th className="border border-black p-2 text-left">Docente</th>
                                                <th className="border border-black p-2 text-left">Asignatura</th>
                                                <th className="border border-black p-2 text-center">Nivel y Curso</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {docentes.map(doc => {
                                                const asigs = (dbData.asignaciones || []).filter(a => a.docenteId === doc.uid);
                                                if(asigs.length === 0) return null;
                                                return asigs.map((asig, idx) => (
                                                    <tr key={asig.id}>
                                                        {idx === 0 && <td rowSpan={asigs.length} className="border border-black p-2 font-bold align-top">{doc.name}</td>}
                                                        <td className="border border-black p-2">{dbData.asignaturas.find(a=>a.id===asig.asignaturaId)?.nombre || asig.asignaturaId}</td>
                                                        <td className="border border-black p-2 text-center">{asig.esElectivo ? `GRUPO: asig.nombreGrupo`:`{asig.nivel} ${asig.letra}`}</td>
                                                    </tr>
                                                ));
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {reporteType === 'cronogramas_masivo' && (
                            <div className="bg-white p-10 rounded-xl border shadow-sm text-center animate-fade-in no-print-pdf">
                                <LucideIcon iconName="CalendarDays" size={64} className="mx-auto text-teal-200 mb-4" />
                                <h3 className="font-bold text-2xl text-teal-800 mb-2">Exportación Masiva de Cronogramas</h3>
                                <p className="text-slate-500 mb-6 max-w-lg mx-auto">Esta acción generará un documento oficial consolidado con todos los cronogramas anuales registrados en la plataforma por los docentes.</p>
                                <button onClick={printAllCronogramas} className="bg-teal-600 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-teal-700 transition-all inline-flex items-center gap-2">
                                    <LucideIcon iconName="Printer" size={20}/> Generar e Imprimir Documento
                                </button>
                            </div>
                        )}

                        {/* --- INICIA REEMPLAZO REPORTE INDIVIDUAL --- */}
                        {reporteType === 'individual' && (
                            <div className="bg-white p-6 md:p-10 rounded-xl border shadow-sm animate-fade-in no-print-pdf">
                                <div className="text-center mb-8">
                                    <LucideIcon iconName="UserCircle" size={64} className="mx-auto text-indigo-200 mb-4" />
                                    <h3 className="font-bold text-2xl text-indigo-800 mb-2">Portafolio Individual y Ficha Docente</h3>
                                    <p className="text-slate-500 mb-6">Seleccione un docente para ingresar revisiones de libro, acompañamientos al aula y revisar su estado.</p>
                                    <select className="border-2 border-indigo-200 p-3 rounded-lg bg-white w-full max-w-md mx-auto outline-none focus:border-indigo-500 font-bold text-indigo-800" value={reporteSelDocente} onChange={e => setReporteSelDocente(e.target.value)}>
                                        <option value="">Seleccione un docente...</option>
                                        {docentes.map(d => <option key={d.uid} value={d.uid}>{d.name}</option>)}
                                    </select>
                                </div>

                                {reporteSelDocente && (
                                    <div className="mt-8 text-left border-t border-slate-200 pt-8">
                                        <PortafolioIndividual 
                                            targetUserId={reporteSelDocente} 
                                            dbData={dbData} 
                                            setDbData={setDbData} 
                                            readOnly={false} 
                                            currentUser={user} 
                                            setNotification={setNotification} 
                                        />
                                    </div>
                                )}
                            </div>
                        )}
                        {/* --- TERMINA REEMPLAZO REPORTE INDIVIDUAL --- */}
                    </div>
                )}


               {tab === 'estadisticas' && (
                   <div className="space-y-6"><div className="bg-white p-4 rounded border"><h4 className="font-bold mb-4">Estadísticas de Evaluación por Docente</h4><select className="border p-2 rounded mb-4" onChange={e => setStatDocente(e.target.value)}><option value="">Seleccione Docente...</option>{docentes.map(d => <option key={d.uid} value={d.uid}>{d.name}</option>)}</select>{statDocente ? (<div className="grid grid-cols-1 md:grid-cols-2 gap-8"><StatsGraph data={statsData} title="Tipos de Instrumentos Utilizados" /><div><h5 className="font-bold mb-2">Detalle</h5><ul className="list-disc pl-5 text-sm">{statsData.map((d,i) => <li key={i}>{d.label}: {d.value}</li>)}</ul></div></div>) : <p className="text-gray-400 italic">Seleccione un docente para ver gráficos.</p>}</div></div>
               )}

               {tab === 'config' && (
                   <div className="space-y-6">
                       <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                           <h4 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><LucideIcon iconName="Database" size={24}/> Base de Conocimientos (Reglamento / Protocolos)</h4>
                           <p className="text-sm text-gray-500 mb-2">Pegue aquí el texto de los reglamentos o protocolos (formato JSON o Texto Plano) para que la IA los consulte.</p>
                            <textarea className="w-full h-64 border p-4 rounded font-mono text-sm" placeholder='[{"pregunta": "...", "respuesta": "..."}] o Texto libre...' value={knowledgeBaseText} onChange={e => setKnowledgeBaseText(e.target.value)}></textarea>
                            <button onClick={saveKnowledgeBase} className="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-blue-700 flex items-center gap-2"><LucideIcon iconName="Save" size={16}/> Guardar Base de Conocimientos</button>
                       </div>
                       
                       <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 mt-6">
                           <h4 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><LucideIcon iconName="Image" size={24}/> Logo Institucional</h4>
                           <div className="flex flex-col items-center gap-4 p-6 bg-white rounded border border-dashed border-slate-300">
                               {dbData.config.schoolLogo ? <img src={dbData.config.schoolLogo} alt="Logo Actual" className="h-32 object-contain border p-2" /> : <div className="h-32 w-32 bg-slate-100 flex items-center justify-center text-slate-400 rounded-full border-2 border-dashed">Sin Logo</div>}
                               <div className="text-center"><p className="text-sm text-slate-500 mb-3">Sube una imagen (JPG/PNG, máx 500KB).</p><input type="file" accept="image/*" ref={fileInputRef} onChange={handleLogoUpload} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" /></div>
                               <div className="flex gap-4 mt-4">{dbData.config.schoolLogo && (<button onClick={() => setDbData(prev => ({ ...prev, config: { ...prev.config, schoolLogo: "" } }))} className="text-red-500 text-xs font-bold underline">Eliminar Logo</button>)}<button onClick={handleSaveConfig} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-blue-700 flex items-center gap-2">
    <LucideIcon iconName="Cloud" size={16}/> Guardar Logo en Nube
</button>
                                </div>
                            </div>

                        </div>

                        {/* Punto 6: Panel de Mensajes Institucionales Personalizados */}
                        <div className="bg-white p-6 rounded-xl border border-teal-200 mt-6 shadow-sm animate-fade-in">
                            <h4 className="font-bold text-teal-900 mb-2 flex items-center gap-2">
                                <LucideIcon iconName="MessageSquare" size={20}/> Mensajes Institucionales para Reportes
                            </h4>
                            <p className="text-[10px] text-gray-500 mb-4 uppercase font-bold tracking-wider">
                                Define los textos con sustento pedagógico que aparecerán en los reportes docentes
                            </p>
                            
                            <div className="flex flex-col gap-2 mb-6">
                                <textarea 
                                    id="nuevoMensajePedagogico" 
                                    className="w-full border p-3 rounded-lg text-sm h-24 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition-all" 
                                    placeholder="Escriba aquí el mensaje institucional (Ej: El uso eficiente de recursos resguarda el medioambiente...)"
                                ></textarea>
                                <button 
                                    onClick={() => {
                                        const txt = document.getElementById('nuevoMensajePedagogico').value;
                                        if(txt.trim()) {
                                            setDbData(prev => ({...prev, config: {...prev.config, mensajesEstandar: [...(prev.config.mensajesEstandar || []), txt]}}));
                                            document.getElementById('nuevoMensajePedagogico').value = '';
                                            setNotification({message: 'Mensaje institucional guardado', type: 'success'});
                                        }
                                    }} 
                                    className="bg-teal-700 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-teal-800 self-end transition-transform active:scale-95"
                                >
                                    Guardar Mensaje
                                </button>
                            </div>

                            <div className="space-y-3">
                                <h5 className="font-bold text-xs text-slate-400 uppercase tracking-widest">Mensajes Activos:</h5>
                                {(dbData.config.mensajesEstandar || []).length === 0 ? (
                                    <p className="text-sm text-slate-300 italic p-4 text-center border-2 border-dashed rounded-lg">No hay mensajes configurados aún.</p>
                                ) : (
                                    (dbData.config.mensajesEstandar || []).map((m, i) => (
                                        <div key={i} className="group p-3 bg-teal-50/50 border border-teal-100 rounded-lg flex justify-between items-start gap-4 hover:bg-teal-50 transition-colors">
                                            <p className="text-xs text-teal-900 leading-relaxed italic">"{m}"</p>
                                            <button 
                                                onClick={() => setDbData(prev => ({...prev, config: {...prev.config, mensajesEstandar: prev.config.mensajesEstandar.filter((_, idx) => idx !== i)}}))} 
                                                className="text-red-400 hover:text-red-600 p-1 rounded-full hover:bg-red-50 transition-all"
                                            >
                                                <LucideIcon iconName="Trash2" size={14}/>
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

// --- DASHBOARD MULTICOPIADO (NUEVO) ---
    // --- DASHBOARD MULTICOPIADO (CORREGIDO: FILTRO DIGITAL Y ARCHIVADO) ---
const MulticopiadoDashboard = ({ user, dbData, setDbData }) => {
    const materiales = dbData.config.materialesUso || [];
    
    // 1. FILTRO MAESTRO: Solo mostrar lo que NO es digital Y NO está archivado
    // Esto asegura que el encargado de copias nunca vea material digital ni borrado
    const materialesImpresion = materiales.filter(m => !m.esDigital && !m.archivado);
    
    // 2. Clasificación
    const pendientes = materialesImpresion.filter(m => !m.estado || m.estado === 'Pendiente').sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
    const listos = materialesImpresion.filter(m => m.estado === 'Listo para Retiro').sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

    // 3. Totales
    const totalHojasHistorico = materialesImpresion.reduce((acc, curr) => acc + (parseInt(curr.totalHojas)||0), 0);
    const hojasPendientes = pendientes.reduce((acc, curr) => acc + (parseInt(curr.totalHojas)||0), 0);

    // FUNCIÓN DE MOVIMIENTO
    const moverAListos = (item) => {
        const nuevoArray = dbData.config.materialesUso.map(m => {
            // Comparación por ID o por contenido si es antiguo
            if ((m.id && item.id && m.id === item.id) || (!m.id && m.fecha === item.fecha && m.tipo === item.tipo && m.docente === item.docente)) {
                return { ...m, estado: 'Listo para Retiro' };
            }
            return m;
        });

        setDbData(prev => ({
            ...prev,
            config: { ...prev.config, materialesUso: nuevoArray }
        }));
    };

    return (
        <div className="min-h-screen bg-slate-200 p-4 font-sans">
            {/* Header Resumen */}
            <div className="flex flex-col md:flex-row gap-4 mb-6 max-w-7xl mx-auto">
                <div className="bg-slate-800 text-white p-4 rounded-lg shadow-lg flex-1">
                    <div className="text-xs font-bold uppercase text-slate-400">Total Impreso (Año)</div>
                    <div className="text-3xl font-black">{totalHojasHistorico.toLocaleString()}</div>
                </div>
                <div className="bg-orange-600 text-white p-4 rounded-lg shadow-lg flex-1">
                    <div className="text-xs font-bold uppercase text-orange-200">Trabajos Pendientes</div>
                    <div className="text-3xl font-black">{pendientes.length}</div>
                </div>
                <div className="bg-white text-slate-800 p-4 rounded-lg shadow-lg flex-1 border-l-4 border-red-500">
                    <div className="text-xs font-bold uppercase text-slate-400">Hojas en Cola</div>
                    <div className="text-3xl font-black text-red-600">{hojasPendientes.toLocaleString()}</div>
                </div>
            </div>

            {/* AREA DE TRABAJO */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-7xl mx-auto h-[80vh]">
                
                {/* COLUMNA IZQUIERDA: PENDIENTES */}
                <div className="bg-white rounded-xl shadow-xl flex flex-col overflow-hidden border border-orange-200">
                    <div className="bg-orange-100 p-4 border-b border-orange-200 flex justify-between items-center">
                        <h3 className="font-black text-orange-800 uppercase flex items-center gap-2">
                            <LucideIcon iconName="Printer" size={20}/> Cola de Impresión
                        </h3>
                        <span className="bg-orange-600 text-white text-xs font-bold px-2 py-1 rounded-full">{pendientes.length}</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                        {pendientes.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center text-gray-300">
                                <LucideIcon iconName="CheckCircle" size={48} className="mb-2 opacity-20"/>
                                <p>Todo al día</p>
                            </div>
                        )}
                        {pendientes.map((m, i) => (
                            <div key={m.id || i} className="bg-white p-4 rounded-lg border-l-4 border-orange-500 shadow-sm hover:shadow-md transition-all group">
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <span className="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded text-slate-500">{formatFechaManual(m.fecha)}</span>
                                        <h4 className="font-bold text-lg text-slate-800 mt-1">{m.docente}</h4>
                                        <p className="text-xs text-slate-500 uppercase font-bold">{m.cursos}</p>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-2xl font-black text-slate-700">{m.cantidad}</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400">Copias</div>
                                    </div>
                                </div>
                                <div className="bg-orange-50 p-2 rounded text-xs text-slate-700 mb-3 font-medium border border-orange-100">
                                    {m.tipo}
                                </div>
                                <button 
                                    onClick={() => moverAListos(m)}
                                    className="w-full bg-slate-800 text-white py-3 rounded font-bold text-sm flex items-center justify-center gap-2 hover:bg-green-600 transition-colors active:scale-95 shadow-lg"
                                >
                                    MOVER A LISTO <LucideIcon iconName="ArrowRight" size={18}/>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>

                {/* COLUMNA DERECHA: LISTOS */}
                <div className="bg-white rounded-xl shadow-xl flex flex-col overflow-hidden border border-green-200 opacity-90">
                    <div className="bg-green-100 p-4 border-b border-green-200 flex justify-between items-center">
                        <h3 className="font-black text-green-800 uppercase flex items-center gap-2">
                            <LucideIcon iconName="CheckCircle" size={20}/> Listos para Retiro
                        </h3>
                        <span className="bg-green-600 text-white text-xs font-bold px-2 py-1 rounded-full">{listos.length}</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50">
                        {listos.map((m, i) => (
                            <div key={m.id || i} className="bg-white p-3 rounded border border-green-100 flex justify-between items-center opacity-60 hover:opacity-100 transition-opacity">
                                <div>
                                    <div className="font-bold text-sm text-slate-700">{m.docente}</div>
                                    <div className="text-[10px] text-slate-500">{m.tipo}</div>
                                </div>
                                <div className="text-right">
                                    <span className="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-1 rounded">LISTO</span>
                                    <div className="text-[9px] text-gray-400 mt-1">{formatFechaManual(m.fecha)}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

            </div>
        </div>
    );
};

// ==========================================
// MÓDULO DE GESTIÓN DE FOLIOS OFICIALES
// ==========================================
const GestionFoliosModule = ({ user, dbData, setDbData }) => {
    const [filtroTipo, setFiltroTipo] = useState('todos');
    const [filtroEstado, setFiltroEstado] = useState('activos');
    const [filtroAnio, setFiltroAnio] = useState(getAcademicYear());
    const [busqueda, setBusqueda] = useState('');
    
    // Función para extraer todos los documentos con folio del sistema
    const obtenerDocumentosConFolio = () => {
        const documentos = [];
        
        // 1. Planificaciones (tienen folio)
        (dbData.planificaciones || []).forEach(p => {
            if (p.folio) {
                documentos.push({
                    id: p.key,
                    folio: p.folio,
                    tipo: 'PLANIFICACIÓN',
                    descripcion: `${p.descripcion || 'Sin descripción'} - Unidad ${p.unidadNumero}`,
                    asignatura: p.key.split('-')[0],
                    nivel: p.key.split('-')[1] || '',
                    estado: p.estado || 'Borrador',
                    fecha: p.history && p.history.length > 0 ? p.history[p.history.length-1].date : 'Sin fecha',
                    eliminado: false,
                    year: p.year || filtroAnio,
                    responsable: p.responsable || 'Docente'
                });
            }
        });
        
        // 2. Cronogramas (tienen folio)
        (dbData.cronogramas || []).forEach(c => {
            if (c.folio) {
                documentos.push({
                    id: c.key,
                    folio: c.folio,
                    tipo: 'CRONOGRAMA',
                    descripcion: `Cronograma ${c.asignaturaId} - ${c.nivel}`,
                    asignatura: c.asignaturaId,
                    nivel: c.nivel,
                    estado: c.estado || 'Borrador',
                    fecha: 'No disponible',
                    eliminado: false,
                    year: c.year || filtroAnio,
                    responsable: c.approver || 'UTP'
                });
            }
        });
        
        // 3. Evaluaciones (no tienen folio pero las incluimos para registro)
        (dbData.evaluaciones || []).forEach(e => {
            if (e.id) {
                documentos.push({
                    id: e.id,
                    folio: `EV-${e.id.substring(e.id.length-6)}`,
                    tipo: 'EVALUACIÓN',
                    descripcion: `${e.instrumento} - ${e.contenido?.substring(0,50)}...`,
                    asignatura: e.asignaturaId,
                    nivel: e.nivel,
                    estado: e.estado || 'Pendiente',
                    fecha: e.fecha,
                    eliminado: false,
                    year: new Date(e.fecha).getFullYear() || filtroAnio,
                    responsable: e.docente
                });
            }
        });
        
        // 4. Documentos específicos (si existen en dbData.documents)
        (dbData.documents || []).forEach(d => {
            if (d.folio) {
                documentos.push({
                    id: d.id,
                    folio: d.folio,
                    tipo: d.tipo || 'DOCUMENTO',
                    descripcion: d.nombre || 'Documento oficial',
                    asignatura: d.asignatura || 'General',
                    nivel: d.nivel || 'General',
                    estado: d.estado || 'Activo',
                    fecha: d.fecha || 'Sin fecha',
                    eliminado: d.eliminado || false,
                    year: d.year || filtroAnio,
                    responsable: d.responsable || 'Sistema'
                });
            }
        });
        
        return documentos.sort((a, b) => b.folio - a.folio);
    };
    
    // Función para formatear folio con ceros a la izquierda
    const formatearFolio = (numero) => {
        return String(numero).padStart(8, '0');
    };
    
    // Función para generar reporte oficial en PDF
    const generarReporteFolios = () => {
        const documentos = obtenerDocumentosConFolio();
        const documentosFiltrados = aplicarFiltros(documentos);
        
        let html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Registro Oficial de Folios - Colegio Marina de Chile</title>
                <style>
                    @page { size: Letter; margin: 1.5cm; }
                    body { 
                        font-family: 'Times New Roman', serif; 
                        font-size: 11pt; 
                        line-height: 1.3;
                        color: #000;
                        background: #fff;
                    }
                    .header-container { 
                        border: 2px solid #000; 
                        padding: 15px; 
                        margin-bottom: 30px;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    }
                    .header-logo img { 
                        width: 80px; 
                        height: 80px; 
                        object-fit: contain; 
                    }
                    .header-text { 
                        flex: 1; 
                        padding: 0 20px; 
                        text-align: center; 
                    }
                    .header-text h1 { 
                        margin: 0; 
                        font-size: 18pt; 
                        text-transform: uppercase; 
                        letter-spacing: 2px;
                    }
                    .header-text h3 { 
                        margin: 5px 0; 
                        font-size: 12pt; 
                        text-transform: uppercase;
                        color: #555;
                    }
                    .header-meta { 
                        text-align: right; 
                        font-size: 10pt; 
                        min-width: 150px; 
                    }
                    table { 
                        width: 100%; 
                        border-collapse: collapse; 
                        margin-top: 20px;
                        font-size: 10pt;
                    }
                    th, td { 
                        border: 1px solid #000; 
                        padding: 8px; 
                        text-align: left;
                        vertical-align: top;
                    }
                    th { 
                        background-color: #f0f0f0; 
                        font-weight: bold; 
                        text-align: center;
                    }
                    .folio-num { 
                        font-family: monospace; 
                        font-weight: bold; 
                        letter-spacing: 1px;
                        color: #1e40af;
                    }
                    .estado-activo { 
                        background-color: #dcfce7; 
                        color: #166534;
                        padding: 2px 6px;
                        border-radius: 3px;
                        font-size: 9pt;
                        font-weight: bold;
                    }
                    .estado-eliminado { 
                        background-color: #fee2e2; 
                        color: #991b1b;
                        padding: 2px 6px;
                        border-radius: 3px;
                        font-size: 9pt;
                        font-weight: bold;
                        text-decoration: line-through;
                    }
                    .footer {
                        margin-top: 40px;
                        text-align: center;
                        font-size: 9pt;
                        color: #666;
                        border-top: 1px solid #ccc;
                        padding-top: 10px;
                    }
                    .resumen {
                        background-color: #f8fafc;
                        padding: 10px;
                        border-radius: 5px;
                        margin-bottom: 20px;
                        border-left: 4px solid #3b82f6;
                    }
                </style>
            </head>
            <body>
                <div class="header-container">
                    <div class="header-logo">
                        ${dbData.config.schoolLogo ? 
                            `<img src="${dbData.config.schoolLogo}" alt="Logo" />` : 
                            '<div style="width:80px;height:80px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:10px;">LOGO</div>'
                        }
                    </div>
                    <div class="header-text">
                        <h1>Colegio Marina de Chile</h1>
                        <h3>Registro Oficial de Folios Documentales</h3>
                        <p style="margin:5px 0; font-size:10pt;">Año Académico: ${filtroAnio}</p>
                    </div>
                    <div class="header-meta">
                        <p><strong>Fecha de Emisión:</strong> ${new Date().toLocaleDateString('es-CL', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                        <p><strong>Generado por:</strong> ${user.name}</p>
                        <p><strong>Total Documentos:</strong> ${documentosFiltrados.length}</p>
                    </div>
                </div>
                
                <div class="resumen">
                    <h4 style="margin:0 0 10px 0; color:#1e40af;">RESUMEN DE FOLIOS</h4>
                    <p style="margin:0; font-size:10pt;">
                        Este registro contiene todos los documentos oficiales emitidos por el sistema de gestión curricular. 
                        Cada folio es único e irrepetible dentro del año académico ${filtroAnio}.
                    </p>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th width="100">Folio Oficial</th>
                            <th width="120">Tipo Documento</th>
                            <th>Descripción</th>
                            <th width="100">Asignatura</th>
                            <th width="80">Nivel</th>
                            <th width="100">Estado</th>
                            <th width="120">Responsable</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        documentosFiltrados.forEach(doc => {
            const folioFormateado = typeof doc.folio === 'number' ? formatearFolio(doc.folio) : doc.folio;
            const estadoClase = doc.eliminado ? 'estado-eliminado' : 'estado-activo';
            const estadoTexto = doc.eliminado ? 'ELIMINADO' : doc.estado;
            
            html += `
                <tr>
                    <td class="folio-num" style="text-align:center;">${folioFormateado}</td>
                    <td style="text-align:center;">${doc.tipo}</td>
                    <td>${doc.descripcion}</td>
                    <td style="text-align:center;">${doc.asignatura}</td>
                    <td style="text-align:center;">${doc.nivel}</td>
                    <td style="text-align:center;"><span class="estadoClase">{estadoTexto}</span></td>
                    <td>${doc.responsable}</td>
                </tr>
            `;
        });
        
        html += `
                    </tbody>
                </table>
                
                <div class="footer">
                    © ${new Date().getFullYear()} Colegio Marina de Chile - Sistema de Gestión Curricular<br>
                    <small>Los folios se reinician cada 1 de enero. Folios del ${filtroAnio}: ${documentosFiltrados.length} documentos registrados.</small>
                </div>
            </body>
            </html>
        `;
        
        const printWindow = window.open('', '_blank', 'width=1000,height=700');
        if (!printWindow) {
            alert("Por favor, permite las ventanas emergentes para imprimir.");
            return;
        }
        
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => {
            printWindow.print();
            printWindow.close();
        }, 250);
    };
    
    // Aplicar filtros
    const aplicarFiltros = (documentos) => {
        return documentos.filter(doc => {
            // Filtro por año
            if (filtroAnio && doc.year != filtroAnio) return false;
            
            // Filtro por tipo
            if (filtroTipo !== 'todos' && doc.tipo !== filtroTipo) return false;
            
            // Filtro por estado
            if (filtroEstado === 'activos' && doc.eliminado) return false;
            if (filtroEstado === 'eliminados' && !doc.eliminado) return false;
            
            // Filtro por búsqueda
            if (busqueda) {
                const busq = busqueda.toLowerCase();
                return (
                    String(doc.folio).toLowerCase().includes(busq) ||
                    doc.descripcion.toLowerCase().includes(busq) ||
                    doc.responsable.toLowerCase().includes(busq) ||
                    doc.asignatura.toLowerCase().includes(busq)
                );
            }
            
            return true;
        });
    };
    
    const documentos = obtenerDocumentosConFolio();
    const documentosFiltrados = aplicarFiltros(documentos);
    
    return (
        <div className="min-h-screen bg-slate-50 p-6">
            <div className="max-w-7xl mx-auto">
                {/* ENCABEZADO */}
                <div className="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-6 rounded-2xl mb-6 shadow-xl">
                    <div className="flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-black uppercase tracking-tight">Registro Oficial de Folios</h1>
                            <p className="text-blue-200 mt-2">Sistema de trazabilidad documental - Folios únicos por año académico</p>
                        </div>
                        <div className="text-right">
                            <div className="text-4xl font-black text-orange-400">{documentosFiltrados.length}</div>
                            <div className="text-sm text-blue-200">Documentos activos</div>
                        </div>
                    </div>
                </div>
                
                {/* CONTROLES DE FILTRO */}
                <div className="bg-white p-4 rounded-xl shadow-md mb-6">
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Año Académico</label>
                            <select 
                                className="w-full border p-2 rounded" 
                                value={filtroAnio}
                                onChange={e => setFiltroAnio(parseInt(e.target.value))}
                            >
                                {[2024, 2025, 2026, 2027].map(year => (
                                    <option key={year} value={year}>{year}</option>
                                ))}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Tipo de Documento</label>
                            <select 
                                className="w-full border p-2 rounded" 
                                value={filtroTipo}
                                onChange={e => setFiltroTipo(e.target.value)}
                            >
                                <option value="todos">Todos los tipos</option>
                                <option value="PLANIFICACIÓN">Planificaciones</option>
                                <option value="CRONOGRAMA">Cronogramas</option>
                                <option value="EVALUACIÓN">Evaluaciones</option>
                                <option value="DOCUMENTO">Documentos</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Estado</label>
                            <select 
                                className="w-full border p-2 rounded" 
                                value={filtroEstado}
                                onChange={e => setFiltroEstado(e.target.value)}
                            >
                                <option value="activos">Solo activos</option>
                                <option value="eliminados">Solo eliminados</option>
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-xs font-bold text-slate-600 mb-1">Buscar (Folio, Descripción, Responsable)</label>
                            <input 
                                type="text" 
                                className="w-full border p-2 rounded" 
                                placeholder="Ej: 00000123 o 'Unidad 1' o 'Juan Pérez'"
                                value={busqueda}
                                onChange={e => setBusqueda(e.target.value)}
                            />
                        </div>
                    </div>
                </div>
                
                {/* BOTÓN DE IMPRESIÓN */}
                <div className="flex justify-end mb-4">
                    <button 
                        onClick={generarReporteFolios}
                        className="bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow-lg hover:bg-green-800 flex items-center gap-2 transition-transform active:scale-95"
                    >
                        <LucideIcon iconName="Printer" size={20}/> 
                        GENERAR REPORTE OFICIAL (PDF)
                    </button>
                </div>
                
                {/* TABLA DE FOLIOS */}
                <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead className="bg-slate-800 text-white">
                                <tr>
                                    <th className="p-3 text-center">Folio Oficial</th>
                                    <th className="p-3 text-center">Tipo</th>
                                    <th className="p-3">Descripción</th>
                                    <th className="p-3 text-center">Asignatura</th>
                                    <th className="p-3 text-center">Nivel</th>
                                    <th className="p-3 text-center">Estado</th>
                                    <th className="p-3">Responsable</th>
                                    <th className="p-3 text-center">Año</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {documentosFiltrados.length === 0 ? (
                                    <tr>
                                        <td colSpan="8" className="p-8 text-center text-gray-400 italic">
                                            No se encontraron documentos con los filtros aplicados.
                                        </td>
                                    </tr>
                                ) : (
                                    documentosFiltrados.map((doc, index) => {
                                        const folioFormateado = typeof doc.folio === 'number' ? formatearFolio(doc.folio) : doc.folio;
                                        
                                        return (
                                            <tr 
                                                key={`doc.id-{index}`} 
                                                className={`hover:bg-slate-50 transition-colors ${doc.eliminado ? 'bg-red-50' : ''}`}
                                            >
                                                <td className="p-3 text-center">
                                                    <div className="font-mono font-bold text-blue-700 text-lg tracking-wider">
                                                        {folioFormateado}
                                                    </div>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                        doc.tipo === 'PLANIFICACIÓN' ? 'bg-blue-100 text-blue-800' :
                                                        doc.tipo === 'CRONOGRAMA' ? 'bg-green-100 text-green-800' :
                                                        doc.tipo === 'EVALUACIÓN' ? 'bg-purple-100 text-purple-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }`}>
                                                        {doc.tipo}
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <div className="font-medium">{doc.descripcion}</div>
                                                    {doc.eliminado && (
                                                        <div className="text-[10px] text-red-600 font-bold mt-1">
                                                            ⚠ ELIMINADO DEL SISTEMA
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-3 text-center font-bold text-slate-700">
                                                    {doc.asignatura}
                                                </td>
                                                <td className="p-3 text-center">
                                                    {doc.nivel}
                                                </td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                        doc.eliminado ? 'bg-red-100 text-red-800 border border-red-200' :
                                                        doc.estado === 'Aprobado' ? 'bg-green-100 text-green-800 border border-green-200' :
                                                        doc.estado === 'Pendiente' ? 'bg-yellow-100 text-yellow-800 border border-yellow-200' :
                                                        'bg-gray-100 text-gray-800 border border-gray-200'
                                                    }`}>
                                                        {doc.eliminado ? 'ELIMINADO' : doc.estado}
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <div className="font-medium">{doc.responsable}</div>
                                                    <div className="text-[10px] text-gray-500">{doc.fecha}</div>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <span className="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-bold">
                                                        {doc.year}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
                
                {/* PIE INFORMATIVO */}
                <div className="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <div className="flex items-start gap-3">
                        <div className="bg-blue-100 p-2 rounded-lg">
                            <LucideIcon iconName="Info" size={20} className="text-blue-600" />
                        </div>
                        <div>
                            <h4 className="font-bold text-blue-800 mb-1">Información sobre el Sistema de Folios</h4>
                            <ul className="text-sm text-blue-700 space-y-1">
                                <li>• Los folios son <strong>únicos e irrepetibles</strong> dentro del año académico</li>
                                <li>• El sistema se reinicia cada <strong>1 de enero</strong>, comenzando nuevamente desde 00000001</li>
                                <li>• Los documentos eliminados se marcan pero <strong>no se reutilizan sus folios</strong></li>
                                <li>• Cada folio garantiza la <strong>trazabilidad oficial</strong> de los documentos institucionales</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

       const LoginScreen = ({ users, onLogin, logoUrl, onPublicAccess }) => {
        const [step, setStep] = useState(1);
        const [selectedProfileType, setSelectedProfileType] = useState(null);
        const [selectedDepto, setSelectedDepto] = useState(null);
        const [selectedUser, setSelectedUser] = useState(null);
        const [password, setPassword] = useState('');

        const PROFILE_TYPES = [
            { id: 'gestion', label: 'Gestión Institucional', icon: 'Star', roles: [ROLES.DIRECTOR, ROLES.UTP, ROLES.ADMIN], desc: 'Dirección, UTP, Coordinación Ciclo' },
            { id: 'coord', label: 'Coordinación Depto', icon: 'Users', roles: [ROLES.COORDINADOR], desc: 'Jefes de Departamento' },
            { id: 'docente', label: 'Docentes', icon: 'BookOpen', roles: [ROLES.DOCENTE], desc: 'Profesores de Aula' },
            { id: 'pie', label: 'Equipo PIE', icon: 'HeartHandshake', roles: [ROLES.PIE], desc: 'Programa de Integración' },
            { id: 'imprenta', label: 'Centro de Copiado', icon: 'Printer', roles: [ROLES.MULTICOPIADO], desc: 'Gestión de Impresión y Retiro' }
        ];

        const handleSelectProfile = (p) => { setSelectedProfileType(p); setStep(p.id==='docente'||p.id==='coord'?2:3); };
        const getDepartamentos = () => {
            const depts = new Set(users.filter(u => selectedProfileType.roles.includes(u.role) && u.depto).map(u => u.depto));
            return [...depts].sort();
        };
        const getUsersList = () => users.filter(u => selectedProfileType.roles.includes(u.role) && (selectedProfileType.id!=='docente'&&selectedProfileType.id!=='coord' || u.depto===selectedDepto)).sort((a,b)=>a.name.localeCompare(b.name));
        
        const handleSubmit = (e) => { 
           e.preventDefault(); 
           if(selectedUser) {
                if (selectedUser.bloqueado) {
                    alert("⛔ ACCESO DENEGADO\n\nSu cuenta se encuentra suspendida temporalmente.\nPor favor, contacte a UTP o Dirección.");
                    return;
                }
                if (selectedUser.password === password) {
                    onLogin(selectedUser);
                } else {
                    alert("Contraseña incorrecta");
                }
            }
        };

        return (
            <div className="flex flex-col items-center justify-center min-h-screen relative overflow-hidden bg-slate-900">
                {/* 1. IMAGEN DE FONDO DIFUMINADA */}
                <div 
                    className="absolute inset-0 z-0"
                    style={{
                        backgroundImage: 'url("https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=1470&auto=format&fit=crop")', 
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        filter: 'blur(8px) brightness(0.6)', 
                        transform: 'scale(1.1)' 
                    }}
                ></div>

                {/* 3. TARJETA DE INGRESO */}
                <div className="bg-white/95 backdrop-blur-sm text-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md relative z-10 animate-fade-in mx-4 border-t-8 border-orange-600">
                    <div className="text-center mb-8">
                        <div className="mb-6 flex justify-center h-32 items-center">
                            {logoUrl ? (
                                // LOGO DEL COLEGIO GRANDE
                                <img 
                                    src={logoUrl} 
                                    alt="Insignia Colegio" 
                                    className="h-32 w-32 object-contain drop-shadow-md hover:scale-105 transition-transform duration-500"
                                />
                            ) : (
                                // Icono por defecto si no hay logo cargado
                                <div className="h-24 w-24 bg-teal-800 rounded-full flex items-center justify-center border-4 border-orange-500 shadow-lg">
                                    <LucideIcon iconName="School" size={48} className="text-orange-400"/>
                                </div>
                            )}
                        </div>
                        
                        <h1 className="text-2xl font-black text-teal-900 uppercase tracking-tight leading-none mb-1">Plataforma de Gestión</h1>
                        <h2 className="text-lg font-bold text-orange-600 uppercase tracking-widest">Colegio Marina de Chile</h2>
                    </div>

                    {step===1 && (
                        <div className="grid gap-3 animate-fade-in">
                           {PROFILE_TYPES.map(p=><button key={p.id} onClick={()=>handleSelectProfile(p)} className="flex items-center gap-4 p-4 border rounded-xl hover:bg-orange-50 hover:border-orange-500 hover:shadow-md transition-all group bg-white"><div className="bg-slate-100 p-2 rounded-full group-hover:bg-orange-200 transition-colors"><LucideIcon iconName={p.icon} className="text-teal-700 group-hover:text-orange-700"/></div><div className="text-left"><div className="font-bold text-slate-800">{p.label}</div><div className="text-xs text-gray-500">{p.desc}</div></div></button>)}
                            
                            <div className="mt-4 pt-4 border-t border-gray-200">
                                <button 
                                    onClick={onPublicAccess} 
                                    className="w-full flex items-center justify-center gap-2 p-3 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-600 hover:text-white transition-all font-bold shadow-sm"
                                >
                                    <LucideIcon iconName="CalendarDays" size={20}/> Acceso Público a Evaluaciones
                                </button>
                                <p className="text-[10px] text-center text-gray-500 mt-2">Para alumnos y apoderados</p>
                            </div>
                        </div>
                    )}
                    {step===2 && (
                        <div className="animate-fade-in">
                           <button onClick={()=>setStep(1)} className="text-xs mb-4 text-teal-600 font-bold hover:underline flex items-center gap-1"><LucideIcon iconName="ArrowLeft" size={12}/> Volver a Perfiles</button>
                           <h4 className="font-bold text-center mb-4 text-slate-700">Seleccione Departamento</h4>
                           <div className="grid grid-cols-2 gap-2">
                                {getDepartamentos().map(d=><button key={d} onClick={()=>{setSelectedDepto(d); setStep(3);}} className="p-3 border rounded-lg hover:bg-teal-50 hover:border-teal-500 font-bold text-sm text-slate-600 hover:text-teal-800 transition-all">{d}</button>)}
                           </div>
                        </div>
                    )}
                    {step===3 && (
                        <form onSubmit={handleSubmit} className="space-y-5 animate-fade-in">
                           <button type="button" onClick={()=>setStep(selectedProfileType.id==='docente'||selectedProfileType.id==='coord'?2:1)} className="text-xs text-teal-600 font-bold hover:underline flex items-center gap-1"><LucideIcon iconName="ArrowLeft" size={12}/> Volver atrás</button>
                           
                           <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Funcionario</label>
                                <div className="relative">
                                    <select className="w-full border-2 border-slate-200 p-3 rounded-lg appearance-none bg-slate-50 focus:bg-white focus:border-orange-500 outline-none text-sm font-bold text-slate-700" onChange={e=>setSelectedUser(users.find(u=>u.uid===e.target.value))}>
                                        <option>Seleccione su nombre...</option>
                                        {getUsersList().map(u=><option key={u.uid} value={u.uid}>{u.name}</option>)}
                                    </select>
                                    <div className="absolute right-3 top-3 text-slate-400 pointer-events-none"><LucideIcon iconName="ChevronDown" size={16}/></div>
                                </div>
                           </div>
                           
                           <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Contraseña</label>
                                <div className="relative">
                                    <input type="password" className="w-full border-2 border-slate-200 p-3 rounded-lg focus:border-orange-500 outline-none pl-10" placeholder="••••••" value={password} onChange={e=>setPassword(e.target.value)}/>
                                    <div className="absolute left-3 top-3 text-slate-400"><LucideIcon iconName="Lock" size={18}/></div>
                                </div>
                           </div>

                           <button className="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white py-3.5 rounded-lg font-black uppercase tracking-wider shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">Ingresar al Sistema</button>
                        </form>
                    )}
                </div>
                <div className="mt-8 text-center text-white/90 text-xs relative z-10 font-medium tracking-wide">
                     © 2026 Colegio Marina de Chile • Gestión Educativa Integral
                </div>
            </div>
        );
    };

    // ==========================================
    // COMPONENTE PRINCIPAL APP (ARQUITECTURA OPTIMIZADA)
    // ==========================================
    function App() {
        const [user, setUser] = useState(null);
        // Estado inicial seguro
        const [dbDataState, setDbDataState] = useState({
            config: {}, users: [], asignaturas: [], cursos: [], departamentos: [], 
            asignaciones: [], gruposElectivos: [], planificaciones: [], 
            evaluaciones: [], resultados: [], bloqueos: [], cronogramas: [], documents: [],
            fichasDocentes: [] // <-- NUEVO
        });
        const [loading, setLoading] = useState(true);
        const [coordMode, setCoordMode] = useState('personal');
        const [view, setView] = useState('home'); 
        // Bandera exclusiva para el acceso público desde la pantalla de ingreso.
        // Evita que el estado "view" mantenga abierto el portal público tras cerrar sesión.
        const [accesoPublico, setAccesoPublico] = useState(false); 
        const [showPasswordModal, setShowPasswordModal] = useState(false);
        const [notification, setNotification] = useState(null);

        // --- CARGA DE DATOS DIVIDIDA ---
        useEffect(() => {
            const init = async () => {
                // 1. Carga rápida local (Caché)
                const localData = localStorage.getItem('marina_db_split_v2');
                if (localData) {
                    try { setDbDataState(JSON.parse(localData)); } catch (e) { console.error(e); }
                }

                // 2. Carga Nube (Colecciones Separadas)
                if (db) {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                        else await auth.signInAnonymously();
                        
                        const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                        
                        // A. Principal
                        const mainDoc = await baseRef.collection('main').doc('config_general').get();
                        let fullData = mainDoc.exists ? mainDoc.data() : INITIAL_DB;

                        // B. Configurar Listeners en Tiempo Real
                        // 1. Escuchar la configuración general y usuarios
                        baseRef.collection('main').doc('config_general').onSnapshot(doc => {
                            if (doc.exists) {
                                setDbDataState(prev => ({ ...prev, ...doc.data() }));
                            }
                        });

                        // 2. Helper para escuchar las colecciones grandes
                        const setupListener = (colName, stateKey) => {
                            baseRef.collection(colName).onSnapshot(snap => {
                                const items = [];
                                snap.forEach(doc => items.push(doc.data()));
                                setDbDataState(prev => ({ ...prev, [stateKey]: items }));
                            }, error => {
                                console.error(`Error escuchando ${colName}:`, error);
                            });
                        };

                        // C. Iniciar las escuchas
                        // C. Iniciar las escuchas
                        setupListener('data_planificaciones', 'planificaciones');
                        setupListener('data_evaluaciones', 'evaluaciones');
                        setupListener('data_resultados', 'resultados');
                        setupListener('data_cronogramas', 'cronogramas');
                        setupListener('data_fichas', 'fichasDocentes'); // <-- NUEVA LÍNEA AÑADIDA

                        // Ya no necesitamos esperar a que cargue todo de golpe
                        // La pantalla principal ya tiene los datos base
                        setDbDataState(fullData);
                    } catch (error) {
                        console.error("Error nube:", error);
                    }
                }
                setLoading(false);
            };
            init();
        }, []);

        // --- GUARDADO INTELIGENTE (ROUTER DE COLECCIONES) ---
        const setDbData = (updateFn) => {
            setDbDataState(prevState => {
                const newState = typeof updateFn === 'function' ? updateFn(prevState) : updateFn;
                
                // Backup Local
                try { localStorage.setItem('marina_db_split_v2', JSON.stringify(newState)); } catch (e) {}

                if (db) {
                    const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    
                    // EXTRAEMOS LA CONFIGURACIÓN CENTRAL (Main)
                    const coreData = { ...newState };
                    delete coreData.planificaciones;
                    delete coreData.evaluaciones;
                    delete coreData.resultados;
                    delete coreData.cronogramas;
                    delete coreData.fichasDocentes; // <-- NUEVA LÍNEA AÑADIDA

                    const oldCoreData = { ...prevState };
                    delete oldCoreData.planificaciones;
                    delete oldCoreData.evaluaciones;
                    delete oldCoreData.resultados;
                    delete oldCoreData.cronogramas;
                    delete oldCoreData.fichasDocentes; // <-- NUEVA LÍNEA AÑADIDA

                    // SOLUCIÓN CONCURRENCIA: SOLO GUARDAMOS MAIN SI HUBO CAMBIOS REALES
                    // Evita que 40 docentes sobreescriban la configuración del colegio al mismo tiempo
                    // SOLO guardar cambios masivos de estructura si es una cuenta administrativa. 
// Evita que un docente en su panel pise la BD general.
const esCuentaAdmin = user && (user.role === 'Administrador' || user.role === 'UTP' || user.role === 'Dirección');

if (esCuentaAdmin && JSON.stringify(coreData) !== JSON.stringify(oldCoreData)) {
    baseRef.collection('main').doc('config_general').set(coreData, { merge: true }).catch(e => console.error(e));
}

                   // Función inteligente y OPTIMIZADA para guardar subcolecciones sin sobrescrituras accidentales
const saveItemsIfChanged = (newItems, oldItems, colName, keyField) => {
    if (JSON.stringify(newItems) !== JSON.stringify(oldItems)) {
        const batch = db.batch();
        let count = 0;

        const newIds = (newItems || []).map(i => String(i[keyField]));
        const oldIds = (oldItems || []).map(i => String(i[keyField]));

        // 1. Detectar eliminaciones con SEGURO ANTI-BORRADO
        const missingIds = oldIds.filter(id => !newIds.includes(id));
        
        // Solo eliminamos de la nube si es un borrado intencional a pequeña escala (ej: 1 a 3 elementos).
        // Si la diferencia es muy grande, bloqueamos el borrado porque es una desincronización de caché.
        if (missingIds.length > 0 && missingIds.length <= 3) {
            missingIds.forEach(id => {
                batch.delete(baseRef.collection(colName).doc(id));
                count++;
            });
        } else if (missingIds.length > 3) {
            console.warn(`⚠️ SE EVITÓ UN BORRADO MASIVO EN ${colName}. Se intentaron borrar ${missingIds.length} elementos debido a caché local desactualizada.`);
        }

        // 2. Guardar o actualizar SOLO LOS ELEMENTOS QUE REALMENTE CAMBIARON
        (newItems || []).forEach(item => {
            if (item[keyField]) {
                // Buscar la versión antigua de este elemento específico
                const oldItem = (oldItems || []).find(o => String(o[keyField]) === String(item[keyField]));
                
                // Solo enviamos la actualización a Firebase si el elemento es NUEVO o si su contenido interno CAMBIÓ.
                // Esto ahorra un 95% de tráfico de red y evita colisiones entre docentes.
                if (!oldItem || JSON.stringify(item) !== JSON.stringify(oldItem)) {
                    const ref = baseRef.collection(colName).doc(String(item[keyField]));
                    batch.set(ref, item, { merge: true });
                    count++;
                }
            }
        });

        if (count > 0) {
            batch.commit()
                .then(() => console.log(`✓ Sincronización exitosa en colName({count} cambios)`))
                .catch(e => console.error(`Error guardando ${colName}`, e));
        }
    }
};


                    // Aplicamos la protección a todas las colecciones independientes
                    saveItemsIfChanged(newState.planificaciones, prevState.planificaciones, 'data_planificaciones', 'key');
                    saveItemsIfChanged(newState.evaluaciones, prevState.evaluaciones, 'data_evaluaciones', 'id');
                    saveItemsIfChanged(newState.resultados, prevState.resultados, 'data_resultados', 'key');
                    saveItemsIfChanged(newState.cronogramas, prevState.cronogramas, 'data_cronogramas', 'key');
                    saveItemsIfChanged(newState.fichasDocentes, prevState.fichasDocentes, 'data_fichas', 'id'); // <-- NUEVA LÍNEA AÑADIDA
                }
                
                return newState;
            });
        };

        const handleChangePassword = (newPass) => {
           setDbData(prev => ({ ...prev, users: prev.users.map(u => u.uid === user.uid ? { ...u, password: newPass } : u) }));
           setNotification({ message: 'Contraseña actualizada', type: 'success' });
        };

        if (loading) return <div className="loader-overlay"><div className="spinner mb-4"></div><div className="text-gray-500 font-bold">Cargando sistema...</div></div>;
        if (!dbDataState) return <div className="p-10 text-center">Inicializando...</div>;

        return (
            <div className="min-h-screen bg-orange-50 font-sans text-gray-800">
               {notification && <NotificationPopup message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}
               <ChangePasswordModal isOpen={showPasswordModal} onClose={() => setShowPasswordModal(false)} onSave={handleChangePassword} />
               
                              {!user && !accesoPublico ? (
                   <LoginScreen 
                        users={dbDataState.users || []} 
                        logoUrl={dbDataState.config?.schoolLogo}
                        onLogin={u => { setUser(u); setView('home'); setAccesoPublico(false); }} 
                        onPublicAccess={() => setAccesoPublico(true)}
                    />
                ) : accesoPublico && !user ? (
                    <div className="min-h-screen bg-slate-50 flex flex-col">
                        <div className="p-4 bg-teal-900 text-white flex justify-between items-center shadow-md no-print-pdf">
                            <div className="flex items-center gap-3">
                                <LucideIcon iconName="School" size={24} className="text-orange-400"/>
                                <h1 className="font-bold text-lg hidden sm:block">Portal Público - Colegio Marina de Chile</h1>
                            </div>
                                                        <button onClick={() => { setAccesoPublico(false); setView('home'); }} className="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg font-bold text-sm transition-colors flex items-center gap-2">
                                <LucideIcon iconName="ArrowLeft" size={16}/> Volver al Ingreso
                            </button>
                        </div>
                        <div className="p-4 md:p-8 flex-1 overflow-y-auto">
                            <PublicEvaluaciones dbData={dbDataState} />
                        </div>
                    </div>
                ) : (
                   <div className="flex flex-col md:flex-row h-screen overflow-hidden">
                       <aside className="w-full md:w-64 bg-teal-900 text-white flex-col no-print-pdf hidden md:flex shrink-0 shadow-2xl z-20">
                           <div className="p-6 text-center border-b border-teal-800 bg-teal-950">
                                <div className="mb-2">
                                   {dbDataState.config?.schoolLogo ? 
                                       <img src={dbDataState.config.schoolLogo} alt="Insignia" className="h-16 w-16 mx-auto object-contain bg-white rounded-full p-1"/> : 
                                       <div className="h-16 w-16 mx-auto bg-teal-800 rounded-full flex items-center justify-center border-2 border-orange-500"><LucideIcon iconName="School" size={32} className="text-orange-400"/></div>
                                   }
                                </div>
                               <h1 className="font-bold text-lg leading-tight text-white">Colegio Marina de Chile</h1>
                                <div className="mt-4 px-3 py-1 bg-orange-600 rounded-full text-xs inline-block uppercase font-bold shadow-md">{user.role}</div>
                                <p className="mt-3 text-sm font-medium text-teal-100">{user.name}</p>
                           </div>
                           <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                                <button onClick={() => { setCoordMode('personal'); setView('home'); }} className={`w-full text-left p-3 rounded-lg flex items-center space-x-3 cursor-pointer transition ${view === 'home' && coordMode === 'personal' ? 'bg-orange-600 text-white shadow-md' : 'hover:bg-teal-800 text-teal-100'}`}><LucideIcon iconName="LayoutGrid" size={20}/> <span>Escritorio</span></button>
                                <button onClick={() => setView('public')} className={`w-full text-left p-3 rounded-lg flex items-center space-x-3 cursor-pointer transition ${view === 'public' ? 'bg-orange-600 text-white shadow-md' : 'hover:bg-teal-800 text-teal-100'}`}><LucideIcon iconName="Search" size={20}/> <span>Buscar Calendarios</span></button>
                                {[ROLES.UTP, ROLES.DIRECTOR, ROLES.COORDINADOR].includes(user.role) && (
                                    <button onClick={() => { setCoordMode('gestion'); setView('home'); }} className={`w-full text-left p-3 rounded-lg flex items-center space-x-3 cursor-pointer transition ${coordMode === 'gestion' && view === 'home' ? 'bg-orange-600 text-white shadow-md' : 'hover:bg-teal-800 text-teal-100'}`}><LucideIcon iconName="BarChart2" size={20}/> <span>Gestión Académica</span></button>
                                )}
                                {user.role === ROLES.PIE && (<div className="p-3 bg-teal-800 rounded-lg flex items-center space-x-3 text-teal-100"><LucideIcon iconName="HeartHandshake" size={20} className="text-pink-400"/> <span>Sugerencias PIE</span></div>)}
                                {user.role === ROLES.ADMIN && (<button onClick={() => { setCoordMode('admin'); setView('home'); }} className={`w-full text-left p-3 rounded-lg flex items-center space-x-3 cursor-pointer transition ${coordMode === 'admin' ? 'bg-orange-600 text-white shadow-md' : 'hover:bg-teal-800 text-teal-100'}`}><LucideIcon iconName="Settings" size={20}/> <span>Admin</span></button>)}
                                {user.role === ROLES.MULTICOPIADO && (<div className="p-3 bg-teal-800 rounded-lg flex items-center space-x-3 text-teal-100"><LucideIcon iconName="Printer" size={20} className="text-yellow-400"/> <span>Centro Copiado</span></div>)}
                                <div className="mt-4 pt-4 border-t border-teal-800">
                                    <button onClick={() => setShowPasswordModal(true)} className="w-full text-left p-3 rounded-lg flex items-center space-x-3 cursor-pointer hover:bg-teal-800 text-teal-100">
                                        <LucideIcon iconName="Key" size={20}/> <span>Cambiar mi Clave</span>
                                   </button>
                                </div>
                           </nav>
                                                      <div className="p-4 border-t border-teal-800">
                               <button 
                                   onClick={() => { 
                                       // Al cerrar sesión reiniciamos TODOS los estados de navegación,
                                       // de lo contrario si el usuario venía del "Portal Público" 
                                       // la pantalla de login no se muestra.
                                       setUser(null); 
                                       setView('home'); 
                                       setCoordMode('personal'); 
                                       setShowPasswordModal(false);
                                   }} 
                                   className="w-full flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 py-2 rounded-lg transition text-sm font-bold shadow-md"
                               >
                                   <LucideIcon iconName="LogOut" size={16} /> <span>Salir</span>
                               </button>
                           </div>
                       </aside>
                       
                       <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-orange-50 relative flex flex-col">
                           <div className="flex-1">
                               {view === 'public' ? <PublicEvaluaciones dbData={dbDataState} /> : (
                                   <>
                                       {user.role === ROLES.DOCENTE && <DocenteDashboard user={user} dbData={dbDataState} setDbData={setDbData} />}
                                       
                                       {/* VISTA UTP / DIRECTOR */}
                                       {(user.role === ROLES.UTP || user.role === ROLES.DIRECTOR) && (
                                           coordMode === 'admin' 
                                           ? <AdminPanel dbData={dbDataState} setDbData={setDbData} /> 
                                           : <UTPDirectorDashboard user={user} dbData={dbDataState} setDbData={setDbData} />
                                       )}

                                       {/* VISTA PIE */}
                                       {user.role === ROLES.PIE && <PIEDashboard user={user} dbData={dbDataState} setDbData={setDbData} />}
                                       
                                       {/* VISTA ADMIN */}
                                       {user.role === ROLES.ADMIN && <AdminPanel dbData={dbDataState} setDbData={setDbData} />}
                                       
                                       {/* VISTA MULTICOPIADO */}
                                       {user.role === ROLES.MULTICOPIADO && <MulticopiadoDashboard user={user} dbData={dbDataState} setDbData={setDbData} />}
                                       
                                       {/* VISTA COORDINADORES (AQUÍ ESTÁ EL CAMBIO CLAVE) */}
                                       {user.role === ROLES.COORDINADOR && (
                                          <>
                                              {coordMode === 'personal' && <DocenteDashboard user={user} dbData={dbDataState} setDbData={setDbData} />}
                                              {coordMode === 'gestion' && (
                                                  // SI EL COORDINADOR ES DE PIE, VE SU DASHBOARD. SI NO, VE EL GENERAL.
                                                  user.depto === 'PIE'
                                                  ? <PIEDashboard user={user} dbData={dbDataState} setDbData={setDbData} />
                                                  : <UTPDirectorDashboard user={user} dbData={dbDataState} setDbData={setDbData} isCoordinator={true} />
                                              )}
                                          </>
                                       )}
                                   </>
                               )}
                           </div>
                           <footer className="mt-8 text-center text-xs text-gray-400 py-4 border-t border-gray-200">
                                © 2026 Propiedad del @Colegio Marina de Chile
                           </footer>
                       </main>
                   </div>
                )}
            </div>
        );
    }



        const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</script>

<script>
    // Registro del Service Worker: es lo que permite que el navegador ofrezca "Instalar aplicación"
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js').catch(err => {
                console.warn('No se pudo registrar el service worker:', err);
            });
        });
    }
</script>
</body>
</html>
