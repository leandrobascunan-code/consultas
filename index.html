                                        );
                                    })}
                                </ul>
                            )}
                        </div>
                    </div>
                )}
        </div>
    );
};


   // --- MÓDULO DE PLANIFICACIÓN AVANZADO (VISTA TARJETAS + BLOOM INTELIGENTE + IMPRESIÓN POR CLASE + VARIACIÓN IA) ---
const PlanificacionModule = ({ context, dbData, setDbData, readOnly, currentUser, ownerUser, setNotification, unidadInicial = null, onUnidadActiva = null }) => {
    const [unidadSel, setUnidadSel] = useState((unidadInicial && unidadInicial.n) || 1);

    // NUEVO: informa al escritorio qué unidad está abierta, para la barra de ubicación
    useEffect(() => { if (onUnidadActiva) onUnidadActiva(unidadSel); }, [unidadSel]);
    const [expandedSession, setExpandedSession] = useState(null); 
    const [editingSession, setEditingSession] = useState(null); 

    // NUEVO: si el docente llegó desde el panel de monitoreo, se abre la unidad que debe completar
    useEffect(() => {
        if (unidadInicial && unidadInicial.n) setUnidadSel(unidadInicial.n);
    }, [unidadInicial]);

    let cronogramaKey = '', planKey = '';
    if (context.esMixto) {
        cronogramaKey = `context.asignaturaId-GLOBAL-{context.year}`;
        planKey = `cronogramaKey-{context.nombreGrupo}-U${unidadSel}`;
    } else if (context.esElectivo) {
        cronogramaKey = `context.asignaturaId-{context.nivel}-${context.year}`;
        planKey = `cronogramaKey-{context.nombreGrupo}-U${unidadSel}`;
    } else {
        cronogramaKey = `context.asignaturaId-{context.nivel}-${context.year}`;
        planKey = `cronogramaKey-{context.letra}-U${unidadSel}`;
    }

    const cronograma = (dbData.cronogramas || []).find(c => c.key === cronogramaKey);
    const cronogramaNivel = cronograma || (dbData.cronogramas || []).find(c => c.key === `context.asignaturaId-{context.nivel}-${context.year}`);
    
    // CORRECCIÓN: Evita sobreescribir a otros docentes usando SOLO las letras reales de este usuario.
    const cursosPlan = (context.letrasReales && context.letrasReales.length > 0) ? context.letrasReales : [context.letra];
        
        const PLAN_DEFAULTS = { 
        sesiones: [], letras: cursosPlan, numEvals: 1, contexto: '', contextoCurso: '', 
        descripcion: '', oaGlobal: '', contenidosBase: '', actividadesBase: '', indicadoresBase: '', 
        habilidadesBase: '', actitudesBase: '',

    const generarAdaptacionMBE = (caracteristicas, nivel) => {

        return `

            // NUEVO: el objetivo se arma siempre con la estructura
    // VERBO EN INFINITIVO + CONTENIDO + CONDICIÓN (cómo o mediante qué) + FINALIDAD (para qué o nivel de logro)
    const generarObjetivoInteligente = (contenidoCrudo, actividadCruda, idx, totalClases, habilidadCruda = '', semilla = 0) => {
        const act = String(actividadCruda || '').toLowerCase();
        const hab = String(habilidadCruda || '').toLowerCase().trim();
        const giro = Math.abs(parseInt(semilla, 10) || 0);
        const elegir = (lista) => lista[(idx + giro) % lista.length];
        const sinTilde = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        // 1. NIVEL COGNITIVO (Bloom) según el momento de la unidad
        const progreso = totalClases > 1 ? idx / (totalClases - 1) : 1;
        let nivelBloom = 1;
        if (progreso < 0.35) nivelBloom = act.match(/explic|resum|diferen|interpret|describ/) ? 2 : 1;
        else if (progreso < 0.70) nivelBloom = act.match(/analiz|investig|compar|examin/) ? 4 : 3;
        else nivelBloom = act.match(/crea|diseñ|invent|constru/) ? 6 : 5;

        // Si la habilidad declarada exige un nivel mayor, se respeta
        if (hab.match(/crear|diseñar|elaborar|producir|construir/)) nivelBloom = Math.max(nivelBloom, 6);
        else if (hab.match(/evaluar|argumentar|fundamentar|justificar|valorar|debatir/)) nivelBloom = Math.max(nivelBloom, 5);
        else if (hab.match(/analizar|comparar|relacionar|inferir|investigar/)) nivelBloom = Math.max(nivelBloom, 4);
        else if (hab.match(/aplicar|resolver|utilizar|calcular|demostrar/)) nivelBloom = Math.max(nivelBloom, 3);

        // 2. VERBO EN INFINITIVO (acción)
        const VERBOS = {
            1: ['Identificar', 'Reconocer', 'Distinguir', 'Señalar'],
            2: ['Explicar', 'Describir', 'Clasificar', 'Interpretar'],
            3: ['Aplicar', 'Resolver', 'Utilizar', 'Representar'],
            4: ['Analizar', 'Comparar', 'Examinar', 'Relacionar'],
            5: ['Evaluar', 'Argumentar', 'Valorar', 'Fundamentar'],
            6: ['Diseñar', 'Crear', 'Elaborar', 'Proponer']
        };
        const verbo = elegir(VERBOS[nivelBloom]);
        const raiz = sinTilde(verbo).slice(0, 4);

        // 3. CONTENIDO (objeto de estudio)
        const VERBOS_INICIALES = /^(identificar|reconocer|distinguir|señalar|conocer|comprender|explicar|describir|clasificar|interpretar|aplicar|resolver|utilizar|calcular|representar|analizar|comparar|examinar|relacionar|investigar|evaluar|argumentar|valorar|fundamentar|crear|diseñar|elaborar|proponer|desarrollar|trabajar|estudiar|revisar)\s+/i;
        const NOMBRES_PROPIOS = ['Chile', 'América', 'Europa', 'Asia', 'África', 'Oceanía', 'Estado', 'Internet', 'Dios'];
        let contenido = String(contenidoCrudo || '')
            .replace(/^\s*\d+[\.\-\)]\s*/, '')
            .replace(/^[-•*]\s*/, '')
            .replace(VERBOS_INICIALES, '')
            .replace(/^(introducci[oó]n a|conceptos b[aá]sicos de|nociones de)\s+/i, '')
            .replace(/\s+/g, ' ')
            .replace(/[.,;:\s]+$/, '')
            .trim();
        if (contenido.length < 3) contenido = 'los contenidos centrales de la unidad';
        const primeraPalabra = contenido.split(' ')[0];
        if (/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(contenido) && !NOMBRES_PROPIOS.includes(primeraPalabra)) {
            contenido = contenido.charAt(0).toLowerCase() + contenido.slice(1);
        }

        // 4. CONDICIÓN O CONTEXTO (cómo o mediante qué), según la actividad de la clase
        let condiciones;
        if (act.match(/ejercit|ejercicio|calcul|resolv|problema|operaci/)) condiciones = [
            'mediante la resolución de problemas con tablas, gráficos y estrategias de cálculo',
            'a través de la ejercitación guiada de casos y procedimientos',
            'mediante el modelamiento de ejemplos y la práctica individual'];
        else if (act.match(/investig|busc|indag|explor|fuente/)) condiciones = [
            'mediante la búsqueda y selección de información en fuentes confiables',
            'a través de la indagación guiada en fuentes diversas',
            'mediante el análisis de datos y evidencias recopiladas'];
        else if (act.match(/debat|discut|opin|argument|expon|present|disert/)) condiciones = [
            'mediante el debate y el intercambio de argumentos con evidencia',
            'a través de la exposición oral de ideas fundamentadas',
            'mediante la discusión guiada en plenario'];
        else if (act.match(/crea|diseñ|dibuj|constru|model|proyect|maqueta|prototip/)) condiciones = [
            'mediante el diseño y la elaboración de un producto concreto',
            'a través de la construcción de modelos o prototipos',
            'mediante la creación de un producto a partir de criterios dados'];
        else if (act.match(/lee|lectura|texto|guía|guia|compren|document/)) condiciones = [
            'mediante la lectura y el análisis de textos y fuentes',
            'a través del trabajo con guías de aprendizaje y preguntas orientadoras',
            'mediante la lectura comprensiva y la organización de ideas en esquemas'];
        else if (act.match(/video|audiovisual|imagen|mapa|gráfic|grafic|infograf/)) condiciones = [
            'mediante el análisis de recursos visuales como videos, mapas o gráficos',
            'a través de la observación guiada de imágenes y recursos audiovisuales',
            'mediante la interpretación de organizadores gráficos'];
        else if (act.match(/grupo|equipo|compañer|pareja/)) condiciones = [
            'mediante el trabajo colaborativo en equipos con roles definidos',
            'a través del trabajo en parejas y la revisión entre pares',
            'mediante la resolución de desafíos en grupos pequeños'];
        else condiciones = [
            'mediante actividades prácticas guiadas por el docente',
            'a través del análisis de ejemplos y situaciones concretas',
            'mediante el trabajo individual con material de apoyo'];
        let condicion = elegir(condiciones);
        // Evita repetir la acción (ej.: "Resolver ... mediante la resolución de ...")
        if (sinTilde(condicion).includes(raiz)) condicion = condiciones.find(c => !sinTilde(c).includes(raiz)) || condicion;

        // 5. FINALIDAD O CRITERIO (para qué o nivel de logro)
        const FINALIDADES = {
            1: ['reconocer sus elementos esenciales en situaciones de su entorno', 'construir una base conceptual que permita avanzar en la unidad'],
            2: ['explicar con sus propias palabras su significado e implicancias', 'relacionarlo con experiencias de la vida cotidiana'],
            3: ['interpretar situaciones de la vida cotidiana y justificar los procedimientos utilizados', 'resolver situaciones concretas y comunicar los resultados obtenidos'],
            4: ['establecer relaciones entre sus componentes y fundamentar las conclusiones con evidencia', 'identificar causas, consecuencias y patrones en situaciones reales'],
            5: ['emitir juicios fundamentados en criterios y evidencias', 'argumentar una postura propia y valorar otras perspectivas'],
            6: ['proponer soluciones originales a problemas de su entorno', 'demostrar la transferencia de lo aprendido en un producto propio']
        };
        const CRITERIO_CORTO = {
            1: 'reconocer su presencia en el entorno cotidiano',
            2: 'comunicar sus ideas con vocabulario propio de la asignatura',
            3: 'justificar los procedimientos utilizados',
            4: 'fundamentar sus conclusiones con evidencia',
            5: 'emitir juicios fundamentados',
            6: 'proponer soluciones originales'
        };
        let finalidad = elegir(FINALIDADES[nivelBloom]);

        // La habilidad declarada de la unidad se integra dentro de la finalidad
        const habLimpia = String(habilidadCruda || '')
            .replace(/^\s*\d+[\.\-\)]\s*/, '').replace(/^[-•*]\s*/, '').replace(/[.,;:\s]+$/, '').trim();
        if (habLimpia.length > 2) {
            const primeraHab = sinTilde(habLimpia.split(' ')[0]);
            const habMinuscula = habLimpia.charAt(0).toLowerCase() + habLimpia.slice(1);
            const habTexto = /(ar|er|ir)$/.test(primeraHab) ? habMinuscula : `desarrollar la habilidad de ${habMinuscula}`;
            // Si la habilidad repite el verbo principal, basta con la finalidad general
            if (primeraHab.slice(0, 4) !== raiz) finalidad = `${habTexto} y ${CRITERIO_CORTO[nivelBloom]}`;
        }

        const texto = `${verbo} ${contenido} ${condicion}, para ${finalidad}.`
            .replace(/\s{2,}/g, ' ')
            .replace(/\s+,/g, ',')
            .replace(/,\s*,/g, ',')
            .replace(/\.\./g, '.');

        return {
            verbo,
            nivel: nivelBloom,
            texto,
            contenidoUsado: contenido,
            partes: { verbo, contenido, condicion, finalidad, texto }
        };
    };


        // NUEVO: vuelve a redactar los objetivos (toda la unidad o una sola clase) sin tocar el resto de la clase
    const regenerarObjetivos = (soloIdx = null) => {
        if (readOnly || isPIE) return;
        const sesiones = planData.sesiones || [];
        const normales = sesiones.map((s, i) => ({ s, i })).filter(x => !x.s.esEvaluacion);
        if (normales.length === 0) {
            setNotification({ message: 'No hay clases para generar objetivos. Primero asigne sesiones en el Cronograma.', type: 'error' });
            return;
        }
        const listaHab = String(planData.habilidadesBase || '').split('\n')
            .map(l => l.replace(/^\s*\d+[\.\-\)]\s*/, '').replace(/^[-•*]\s*/, '').trim())
            .filter(l => l.length > 2);
        const semillaUnidad = Math.floor(Math.random() * 97) + 1;
        let cambiados = 0, sinContenido = 0;

        const nuevas = sesiones.map((s, i) => {
            if (s.esEvaluacion) return s;
            if (soloIdx !== null && i !== soloIdx) return s;
            if (!String(s.contenido || '').trim()) { sinContenido++; return s; }
            const pos = normales.findIndex(x => x.i === i);
            const hab = s.habilidadFoco || (listaHab.length > 0 ? listaHab[pos % listaHab.length] : '');
            // Una sola clase: avanza a la siguiente variante para que siempre cambie la redacción
            const semilla = soloIdx !== null ? (parseInt(s.objetivoVariante, 10) || 0) + 1 : semillaUnidad;
            const obj = generarObjetivoInteligente(s.contenido, s.actividadBase || s.actividadCentral || '', pos, normales.length, hab, semilla);
            cambiados++;
            return {
                ...s,
                objetivoClase: obj.texto,
                objetivoPartes: obj.partes,
                objetivoVariante: semilla,
                habilidadBloom: (BLOOM_VERBS[obj.nivel] || BLOOM_VERBS[2]).nombre,
                habilidadFoco: hab
            };
        });

        if (cambiados === 0) {
            setNotification({ message: 'Para generar el objetivo, la clase debe tener un contenido escrito.', type: 'error' });
            return;
        }
        setPlanData(prev => ({ ...prev, sesiones: nuevas }));
        const aviso = soloIdx !== null ? 'Objetivo de la clase regenerado' : `${cambiados} objetivo(s) regenerado(s)`;
        const extra = sinContenido > 0 ? ` (${sinContenido} clase(s) sin contenido quedaron igual)` : '';
        setNotification({ message: `aviso{extra}. Presione "Guardar" para conservar los cambios.`, type: 'success' });
    };

    const completeWithAI = () => {
        if (!planData.oaGlobal && !planData.contenidosBase && !planData.actividadesBase) {
            alert("⚠️ Faltan datos base. Por favor ingrese al menos OA, Contenidos o Actividades para dar contexto a la generación."); 
            return;
        }
        if (!planData.sesiones || planData.sesiones.length === 0) {
            alert("⚠️ No hay clases asignadas. Vaya a 'Cronograma', asigne un número de sesiones a la Unidad y guarde.");
            return;
        }

        let htmlCapacidades = "";
        if (context.esMixto) {
            htmlCapacidades = `
                <div style="margin-bottom: 12px; padding: 12px; background: #f0f9ff; border-radius: 8px;">
                    <strong style="color: #0284c7; font-size: 12px; display: block; margin-bottom: 4px;">🎯 Estudiantes 3° Medio:</strong> 
                    <p style="margin: 0; color: #0c4a6e; font-size: 11px; text-align: justify; line-height: 1.5;">${CAPACIDADES_POR_NIVEL["3° Medio"]}</p>
                </div>
                <div style="padding: 12px; background: #f0fdf4; border-radius: 8px;">
                    <strong style="color: #16a34a; font-size: 12px; display: block; margin-bottom: 4px;">🎯 Estudiantes 4° Medio:</strong> 
                    <p style="margin: 0; color: #064e3b; font-size: 11px; text-align: justify; line-height: 1.5;">${CAPACIDADES_POR_NIVEL["4° Medio"]}</p>

                        // 3. GENERACIÓN DE LAS PREGUNTAS ESTRUCTURADAS
            const q1 = arrAnalisis[idx % arrAnalisis.length].replace(/
TEMA

TEMA
/g, contenido.toLowerCase());

TEMA
/g, contenido.toLowerCase());

TEMA
/g, contenido.toLowerCase());

TEMA

TEMA

                        </div>

                        return {

                        {planesImportables.length === 0 ? (

                                            <div className="flex-1">

                                                                        : 'Datos copiados y documento vinculado a este curso. Presione "Guardar" para conservar las clases.',
                                                                    type: ok === false ? 'error' : 'success'

                                            </button>
                                        </li>
                                    );
                                })}
                            </ul>

                    </div>

{/* MODAL DE EDICIÓN DE UNIDAD */}

                            <div>

                                <div className="space-y-2 mb-2 max-h-32 overflow-y-auto">

                                            className="bg-blue-600 text-white px-4 rounded-lg font-bold text-sm hover:bg-blue-700 transition-colors"

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <div>
                                    <label className="text-xs font-black text-orange-800 uppercase tracking-wide mb-2 flex items-center gap-2"><LucideIcon iconName="Activity" size={16}/> Actividades Base</label>

                                </div>
                            </div>
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="text-xs font-black text-indigo-800 uppercase tracking-wide mb-2 flex items-center gap-2"><LucideIcon iconName="Brain" size={16}/> Habilidades de la Unidad (Una por línea)</label>
                                    <AutoResizeTextArea className="w-full border-2 border-indigo-200 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none bg-white shadow-inner transition-all" value={planData.habilidadesBase || ''} onChange={e=>setPlanData({...planData, habilidadesBase: e.target.value})} disabled={isDocente && planData.estado === 'Aprobado'} placeholder="Ej: Analizar fuentes históricas&#10;Argumentar posturas con evidencia" rows={4} />
                                    <p className="text-[10px] text-indigo-600 mt-1 italic">Estas habilidades se integrarán automáticamente en el objetivo de cada clase.</p>
                                </div>
                                <div>
                                    <label className="text-xs font-black text-rose-800 uppercase tracking-wide mb-2 flex items-center gap-2"><LucideIcon iconName="Heart" size={16}/> Actitudes de la Unidad</label>
                                    <AutoResizeTextArea className="w-full border-2 border-rose-200 rounded-lg p-3 text-sm focus:border-rose-500 outline-none bg-white shadow-inner transition-all" value={planData.actitudesBase || ''} onChange={e=>setPlanData({...planData, actitudesBase: e.target.value})} disabled={isDocente && planData.estado === 'Aprobado'} placeholder="Actitudes transversales de la unidad..." rows={4} />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-black text-purple-800 uppercase tracking-wide mb-2 flex items-center gap-2"><LucideIcon iconName="ListChecks" size={16}/> Indicadores de Evaluación (Uno por línea)</label>
                                <AutoResizeTextArea className="w-full border-2 border-purple-200 rounded-lg p-3 text-sm focus:border-purple-500 outline-none bg-white shadow-inner transition-all" value={planData.indicadoresBase} onChange={e=>setPlanData({...planData, indicadoresBase: e.target.value})} disabled={isDocente && planData.estado === 'Aprobado'} placeholder="Escriba los indicadores que se evaluarán en la unidad..." rows={4} />
                            </div>
                        </div>

                        <div className="mt-8 flex justify-end gap-4 border-t pt-6">
                            <button onClick={() => setShowEditBaseModal(false)} className="px-6 py-3 rounded-lg bg-gray-200 hover:bg-gray-300 font-bold text-gray-700 transition-colors">
                                Cancelar
                            </button>
                            <button 
                                onClick={() => { 
                                    setShowEditBaseModal(false); 
                                    handleSave(); 
                                }} 
                                className="px-8 py-3 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-black shadow-lg flex items-center gap-2 transform transition-transform hover:-translate-y-1"
                            >
                                <LucideIcon iconName="Save" size={20}/> Guardar Cambios
                            </button>
                        </div>
                    </div>
               </div>
            )}

            {/* --- NUEVO: DASHBOARD VISUAL DE PROGRESO --- */}
            <div className="mb-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-6 no-print-pdf transition-all hover:shadow-md">

                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path className="text-slate-100" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path className={`${porcentajeAvanceDashboard === 100 ? 'text-green-500' : 'text-teal-500'} transition-all duration-1000 ease-out`} strokeDasharray={`${porcentajeAvanceDashboard}, 100`} strokeWidth="3" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div className="absolute inset-0 flex items-center justify-center flex-col">
                        <span className={`text-2xl font-black ${porcentajeAvanceDashboard === 100 ? 'text-green-600' : 'text-slate-800'}`}>{porcentajeAvanceDashboard}%</span>
                    </div>
                </div>
                <div className="flex-1 w-full">
                    <h4 className="text-xl font-black text-slate-800 mb-1 flex items-center gap-2">

                    </h4>
                                        <p className="text-sm text-slate-500 mb-4">
                        {completaPorDocumento
                            ? `📎 Planificación entregada en documento adjunto (${planData.documentoExterno?.nombreOriginal || 'Drive'}). Las ${totalSesionesDashboard} sesiones de la unidad se consideran completas.`
                            : faltanDashboard === 0 
                                ? "¡Excelente! Todas las clases tienen contenido mínimo asignado (OA, Contenido y Actividad)."

                            <div className="text-2xl font-black text-slate-700">{totalSesionesDashboard}</div>
                        </div>
                        <div className="bg-teal-50 p-3 rounded-xl border border-teal-100 text-center">
                            <div className="text-[10px] text-teal-600 font-bold uppercase tracking-wider mb-1">Completas</div>
                            <div className="text-2xl font-black text-teal-700">{sesionesListasDashboard}</div>
                        </div>
                        <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 text-center">
                            <div className="text-[10px] text-orange-600 font-bold uppercase tracking-wider mb-1">Incompletas</div>
                            <div className="text-2xl font-black text-orange-700">{faltanDashboard}</div>
                        </div>
                        <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center">
                            <div className="text-[10px] text-blue-600 font-bold uppercase tracking-wider mb-1">Recursos Web</div>
                            <div className="text-2xl font-black text-blue-700">{(planData.enlacesRecursos || []).length}</div>
                        </div>
                    </div>
                </div>
            </div>
            {/* --------------------------------------------------------- */}

            {/* BARRA SUPERIOR DE HERRAMIENTAS CORREGIDA */}

                    <span className={`px-3 py-1 rounded text-xs font-bold uppercase border whitespace-nowrap ${planData.estado === 'Aprobado' ? 'bg-green-100 text-green-800 border-green-300' : 'bg-yellow-100 text-yellow-800 border-yellow-300'}`}>
                        Estado: {planData.estado}
                    </span>

                <div className="flex flex-wrap items-center justify-start xl:justify-end gap-2 w-full xl:w-auto">

                    {!readOnly && !isPIE && <button onClick={addSesion} className="bg-teal-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-teal-700 transition shadow-sm"><LucideIcon iconName="Plus" size={14}/> Añadir Clase</button>}
                    
                    {!readOnly && !isPIE && (
                        <button onClick={() => setShowImportModal(true)} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-blue-700 transition shadow-sm">
                            <LucideIcon iconName="Download" size={14}/> Importar
                        </button>
                    )}
                    
                    {!readOnly && <button onClick={completeWithAI} className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:shadow-lg transform hover:-translate-y-0.5 transition"><LucideIcon iconName="Sparkles" size={14}/> Asistente IA</button>}

                        <button
                            onClick={() => setDialogoObj({
                                id: Date.now(),
                                titulo: `Regenerar objetivos de la Unidad ${unidadSel}`,
                                mensaje: 'Se redactarán nuevamente los objetivos de todas las clases (excepto las evaluaciones), con la estructura: Verbo + Contenido + Condición + Finalidad.\nLos objetivos escritos a mano serán reemplazados.\nLuego presione "Guardar" para conservar los cambios.',
                                textoBoton: 'Regenerar',
                                color: 'teal',
                                alConfirmar: () => regenerarObjetivos(null)
                            })}
                            className="bg-white text-indigo-700 border border-indigo-300 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-indigo-50 shadow-sm transition"
                            title="Vuelve a redactar el objetivo de todas las clases de la unidad"
                        >
                            <LucideIcon iconName="RefreshCw" size={14}/> Regenerar objetivos
                        </button>
                    )}
                    
                    {(!readOnly || isDocente) && !isPIE && <button onClick={() => setShowDeleteModal(true)} className="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-red-100 transition shadow-sm" title="Borrar solo el detalle de las clases (Mantiene configuración base)"><LucideIcon iconName="RotateCcw" size={14}/> Reiniciar Clases</button>}
                    
                    {/* CORRECCIÓN DE GUARDADO: Habilitado para Docente, PIE y UTP */}
                    {(!readOnly || isPIE || isApprover) && (
                        <button onClick={handleSave} className="bg-orange-500 text-white px-4 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-orange-600 shadow-md transition transform hover:scale-105">
                            <LucideIcon iconName="Save" size={14}/> Guardar
                        </button>
                    )}
                    
                    <button onClick={() => printDocument('printable-planificacion', `Planificacion_U${unidadSel}`)} className="bg-slate-800 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-slate-900 shadow-md transition">
                        <LucideIcon iconName="Printer" size={14}/> Imprimir
                    </button>
                </div>
            </div>


            <DocumentoExternoUploader
                titulo={`Planificación en documento propio — Unidad ${unidadSel}`}
                descripcionAyuda="Si usted planifica en Word, PDF u otro formato, cárguelo aquí. Se guardará automáticamente en la carpeta institucional de Drive y quedará visible para UTP."
                documento={planData.documentoExterno}
                disabled={readOnly || isPIE}
                meta={{
                    tipo: 'Planificacion',
                    carpeta: 'Planificaciones',
                    asignatura: context.asignaturaNombre,
                    curso: (context.esElectivo || context.esMixto) ? context.nombreGrupo : `${context.nivel} ${cursosPlan.join('-')}`,
                    unidad: unidadSel,
                    docente: docenteResponsable?.name,
                    anio: context.year,
                    usuario: currentUser?.name
                }}
                onGuardar={guardarDocumentoExternoPlan}
                setNotification={setNotification}
            />

            <UTPFeedbackControl data={planData} onChange={setPlanData} currentUser={currentUser} isApprover={isApprover} />

            {/* PANEL SUPERIOR DE CONFIGURACIÓN DE LA UNIDAD */}
            <div className="bg-white rounded-xl shadow-md overflow-hidden no-print-pdf border border-slate-200">
                <div className="bg-gradient-to-r from-slate-800 to-slate-700 p-4 text-white flex justify-between items-center"><h4 className="font-bold flex items-center gap-2"><LucideIcon iconName="Settings" size={20}/> Configuración Base de Unidad {context.esMixto && "(PLAN ÚNICO 3° y 4°)"}</h4></div>
                <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                        <div>
                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">Contexto Unidad</label>
                            <textarea className="w-full border-2 border-slate-100 rounded-lg p-3 text-sm h-16 resize-none" value={planData.descripcion} onChange={e=>setPlanData({...planData, descripcion: e.target.value})} disabled={isDocente && planData.estado === 'Aprobado'} placeholder="Propósito de la unidad..."/>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">Contexto Curso (Seleccione características)</label>
                            <div className="mb-3 p-2 bg-slate-50 rounded border min-h-[60px]">
                                <p className="text-[10px] text-slate-500 mb-1">Características seleccionadas:</p>
                                <div className="text-[10px] text-slate-700">
                                    {planData.caracteristicasSeleccionadas && planData.caracteristicasSeleccionadas.length > 0 
                                        ? planData.caracteristicasSeleccionadas.map((trait, idx) => (
                                            <span key={idx} className="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded mr-1 mb-1">{trait}</span>
                                        ))
                                        : <span className="text-slate-400 italic">Ninguna característica seleccionada</span>
                                    }
                                </div>
                            </div>
                            <div className="mb-4">
                                <h5 className="text-xs font-bold text-green-700 mb-2">Características Positivas (Fortalezas)</h5>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 border border-green-100 rounded bg-green-50">
                                    {["Motivación y sentido: Mayor involucramiento cuando tareas se vinculan a su realidad", "Participación y comunicación: Expresan opiniones en clima seguro", "Colaboración y convivencia: Presencia de apoyo entre pares", "Autonomía y carácter: Disposición a asumir responsabilidades", "Uso de tecnología: Interés por recursos audiovisuales/digitales"].map((trait, idx) => (
                                        <label key={`pos-${idx}`} className="flex items-start gap-2 text-xs cursor-pointer hover:bg-green-100 p-1 rounded">
                                            <input type="checkbox" className="mt-1 accent-green-600" checked={planData.caracteristicasSeleccionadas?.includes(trait) || false} onChange={(e) => {
                                                const current = planData.caracteristicasSeleccionadas || [];
                                                const newTraits = e.target.checked ? [...current, trait] : current.filter(t => t !== trait);
                                                setPlanData({...planData, caracteristicasSeleccionadas: newTraits, contextoCurso: newTraits.length > 0 ? `Características seleccionadas: ${newTraits.join('; ')}` : ''});
                                            }}/>
                                            <span className="text-[10px]">{trait}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="mb-4">
                                <h5 className="text-xs font-bold text-red-700 mb-2">Características Desafiantes (Focos)</h5>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 border border-red-100 rounded bg-red-50">
                                    {["Aprendizaje superficial: Foco en cumplir más que en comprender", "Dependencia del docente: Necesitan instrucciones paso a paso", "Dificultades en colaboración: Conflictos en el reparto de roles", "Comunicación limitada: Inseguridad para expresar ideas en público", "Aspectos socioemocionales: Baja tolerancia a la frustración"].map((trait, idx) => (
                                        <label key={`des-${idx}`} className="flex items-start gap-2 text-xs cursor-pointer hover:bg-red-100 p-1 rounded">
                                            <input type="checkbox" className="mt-1 accent-red-600" checked={planData.caracteristicasSeleccionadas?.includes(trait) || false} onChange={(e) => {
                                                const current = planData.caracteristicasSeleccionadas || [];
                                                const newTraits = e.target.checked ? [...current, trait] : current.filter(t => t !== trait);
                                                setPlanData({...planData, caracteristicasSeleccionadas: newTraits, contextoCurso: newTraits.length > 0 ? `Características seleccionadas: ${newTraits.join('; ')}` : ''});
                                            }}/>
                                            <span className="text-[10px]">{trait}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <textarea className="w-full border-2 border-slate-100 rounded-lg p-3 text-sm h-20 resize-none mt-2" value={planData.contextoCursoNotas || ''} onChange={e=>setPlanData({...planData, contextoCursoNotas: e.target.value})} disabled={isDocente && planData.estado === 'Aprobado'} placeholder="Notas adicionales sobre el contexto del curso..." />
                        </div>
                        <div>
                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">Sellos Institucionales</label>
                            <div className="flex flex-wrap gap-2">
                                {(dbData.config.sellos || []).map(s => {
                                    const sName = typeof s === 'string' ? s : s.name;
                                    const isSelected = planData.sellos.some(ps => (typeof ps === 'string' ? ps : ps.name) === sName);
                                    return (
                                        <button key={sName} onClick={() => toggleArrayItem('sellos', s)} className={`px-2 py-1 rounded-full text-[10px] font-bold border transition ${isSelected ? 'bg-orange-100 text-orange-700 border-orange-300' : 'bg-white text-slate-400 border-slate-200'}`}>{sName}</button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                    <div className="space-y-4">
                        <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center shadow-inner relative overflow-hidden">
                            <div className="absolute -right-4 -bottom-4 opacity-5">
                                <LucideIcon iconName="BookOpen" size={120} />
                            </div>
                            <div className="relative z-10">
                                <h5 className="font-black text-xl text-teal-800 mb-2">Diseño Curricular de la Unidad</h5>
                                <p className="text-sm text-slate-600 mb-6 max-w-xl mx-auto">
                                    Haga clic en el botón inferior para abrir la ventana de edición. Aquí podrá configurar los <strong>Objetivos (OA)</strong>, <strong>Contenidos</strong>, <strong>Actividades</strong> e <strong>Indicadores</strong> que servirán de base para las clases.
                                </p>
                                <button 
                                    onClick={() => setShowEditBaseModal(true)} 
                                    disabled={readOnly || isPIE || (isDocente && planData.estado === 'Aprobado')}
                                    className="bg-gradient-to-r from-teal-600 to-emerald-600 text-white px-8 py-3 rounded-xl font-black shadow-md hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center gap-2 mx-auto disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                                >
                                    <LucideIcon iconName="Edit" size={20}/> ABRIR EDITOR DE UNIDAD
                                </button>

                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">Competencias 6C (NPP)</label>

                                {COMPETENCIAS_6C.map(c => (<button key={c} onClick={() => toggleArrayItem('competencias6C', c)} className={`px-2 py-1 rounded-full text-[10px] font-bold border transition ${planData.competencias6C.includes(c) ? 'bg-teal-100 text-teal-700 border-teal-300' : 'bg-white text-slate-400 border-slate-200'}`}>{c}</button>))}
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <div className="flex-1"><label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">N° Evaluaciones</label><input type="number" className="w-full border p-2 rounded text-sm" value={planData.numEvals} onChange={e=>setPlanData({...planData, numEvals: e.target.value})}/></div>
                            <div className="flex-1"><label className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1 block">Total Sesiones</label><input type="number" className="w-full border p-2 rounded text-sm bg-gray-100" value={(planData.sesiones || []).length} readOnly/></div>
                        </div>
                    </div>
                </div>
            </div>

            {/* VISTA PRINCIPAL DE LA PLANIFICACIÓN (INCLUYE PDF) */}
            <div id="printable-planificacion" className="bg-white p-2 md:p-8 rounded-xl border shadow-sm print:p-0 print:border-none print:shadow-none">

                <div className="mb-6 grid grid-cols-2 gap-4 text-xs border p-4 bg-slate-50 rounded-lg">
                    <div><strong className="text-slate-500 uppercase">Cursos Asignados (Replicados automáticamente):</strong> <span className="font-bold text-slate-800">{cursosPlan.join(', ') || 'Todos'}</span></div>
                    <div><strong className="text-slate-500 uppercase">Evaluaciones Sumativas:</strong> <span className="font-bold text-slate-800">{planData.numEvals || 0}</span></div>
                    <div className="col-span-2"><strong className="text-slate-500 uppercase">Contexto Registrado:</strong> <span className="italic text-slate-700">{planData.contextoCurso || 'No especificado'}</span></div>
                    <div className="col-span-2"><strong className="text-slate-500 uppercase">Focos Institucionales:</strong> <span className="font-bold text-indigo-700">{[...(planData.sellos||[]).map(s=>typeof s==='string'?s:s.name), ...(planData.competencias6C||[])].join(' • ') || 'Ninguno'}</span></div>
                </div>


                {/* BLOQUE GENERADO POR IA: VISIBLE SOLO UNA VEZ AL INICIO DE LA UNIDAD */}
                {(planData.iaCapacidades || planData.iaIntegracion || planData.iaAdaptacion) && (
                    <div className="mb-8 border-2 border-indigo-200 rounded-xl overflow-hidden page-break-inside-avoid shadow-sm" style={{ border: '2px solid #c7d2fe', borderRadius: '0.75rem' }}>
                        <div className="bg-gradient-to-r from-indigo-700 to-indigo-600 text-white p-3 font-bold flex items-center gap-2 uppercase tracking-wider text-sm" style={{ background: '#4338ca', color: 'white', padding: '12px', fontWeight: 'bold' }}>
                            <span>🧠</span> Encuadre Pedagógico de la Unidad
                        </div>
                        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-6 bg-white" style={{ padding: '20px', background: 'white' }}>
                            {planData.iaCapacidades && (
                                <div className="md:col-span-2">
                                    <h5 className="font-black text-indigo-800 text-xs uppercase mb-2 border-b-2 border-indigo-100 pb-1" style={{ color: '#3730a3', borderBottom: '2px solid #e0e7ff', paddingBottom: '4px', marginBottom: '8px' }}>1. Capacidades Esperadas del Nivel</h5>
                                    <div dangerouslySetInnerHTML={{__html: planData.iaCapacidades}} />
                                </div>
                            )}
                            {planData.iaIntegracion && (
                                <div>
                                    <h5 className="font-black text-indigo-800 text-xs uppercase mb-2 border-b-2 border-indigo-100 pb-1" style={{ color: '#3730a3', borderBottom: '2px solid #e0e7ff', paddingBottom: '4px', marginBottom: '8px' }}>2. Integración: Contenido, Sello y 6C</h5>
                                    <div dangerouslySetInnerHTML={{__html: planData.iaIntegracion}} />
                                </div>
                            )}
                            {planData.iaAdaptacion && (
                                <div>
                                    <h5 className="font-black text-indigo-800 text-xs uppercase mb-2 border-b-2 border-indigo-100 pb-1" style={{ color: '#3730a3', borderBottom: '2px solid #e0e7ff', paddingBottom: '4px', marginBottom: '8px' }}>3. Adaptación al Contexto del Curso (MBE)</h5>
                                    <div dangerouslySetInnerHTML={{__html: planData.iaAdaptacion}} />
                                </div>
                            )}
                        </div>
                    </div>
                )}

                <div className="mb-6 border rounded-lg overflow-hidden page-break-inside-avoid" style={{ border: '1px solid #e2e8f0', borderRadius: '0.5rem', marginBottom: '1.5rem' }}>
                    <div className="bg-slate-100 p-3 border-b font-bold text-xs uppercase text-slate-700 flex items-center gap-2" style={{ background: '#f1f5f9', padding: '12px', fontWeight: 'bold' }}>
                        <span>🎯</span> Objetivo de Aprendizaje (Unidad)
                    </div>
                    <div className="p-4 text-sm bg-white text-slate-800 leading-relaxed whitespace-pre-wrap" style={{ padding: '16px', background: 'white' }}>
                        {formatOA(planData.oaGlobal) || <span className="text-gray-400 italic">No se ha registrado un OA global para esta unidad.</span>}
                    </div>
                </div>

                {/* LISTADO DE CLASES EN FORMATO ACORDEÓN / TARJETAS INTELIGENTES (IMPRESIÓN CONTINUA OPTIMIZADA) */}
                <div className="grid grid-cols-1 gap-6" style={{ display: 'grid', gap: '1.5rem' }}>
                    {(planData.sesiones || []).map((s, idx) => {
                        const isOpen = expandedSession === idx; 
                        const isEditing = editingSession === idx; 
                        const isEval = s.esEvaluacion;
                        const duaSug = getDUAContext(s.actividadCentral, s.contenido, idx); // GENERAR CONTEXTO DUA AQUÍ
                        
                        return (
                            <div key={idx} className={`pdf-session-card rounded-xl border-2 transition-all duration-300 shadow-sm flex flex-col relative overflow-hidden ${s.realizado ? 'border-emerald-500 bg-emerald-50' : isEval ? 'border-yellow-400 bg-yellow-50' : 'border-slate-200 bg-white'} ${isOpen ? 'ring-4 ring-blue-200 shadow-lg' : 'hover:shadow-md'}`} style={{ border: s.realizado ? '2px solid #10b981' : isEval ? '2px solid #facc15' : '2px solid #e2e8f0', borderRadius: '0.75rem', background: s.realizado ? '#ecfdf5' : isEval ? '#fefce8' : 'white', breakInside: 'avoid', marginBottom: '1.5rem' }}>
                                
                                <div 
                                    className={`p-4 cursor-pointer flex justify-between items-center select-none transition-colors ${s.realizado ? 'bg-emerald-100/50 hover:bg-emerald-200/50' : isEval ? 'bg-yellow-200/50 hover:bg-yellow-100' : 'bg-slate-50 hover:bg-slate-100'} ${isOpen && !isEval && !s.realizado ? 'bg-blue-50/50' : ''}`} 
                                    style={{ padding: '16px', borderBottom: s.realizado ? '1px solid #a7f3d0' : isEval ? '1px solid #fef08a' : '1px solid #f1f5f9' }}
                                    onClick={() => toggleAccordion(idx)}
                                >
                                    <div className="flex items-center gap-4 flex-1">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-white shadow-inner text-lg ${s.realizado ? 'bg-emerald-500' : isEval ? 'bg-yellow-500' : 'bg-blue-600'}`} style={{ width: '40px', height: '40px', borderRadius: '50%', background: s.realizado ? '#10b981' : isEval ? '#eab308' : '#2563eb', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold' }}>
                                            {s.n}
                                        </div>
                                        <div className="flex-1 pr-4">
                                            <h5 className={`font-black uppercase text-base flex items-center gap-2 ${s.realizado ? 'text-emerald-800' : isEval ? 'text-yellow-700' : 'text-slate-800'}`} style={{ margin: 0, fontWeight: '900', color: s.realizado ? '#065f46' : isEval ? '#a16207' : '#1e293b' }}>
                                                Clase {s.n} {isEval && '🏆'} {s.realizado && '✅'}
                                            </h5>
                                            <div className="flex items-center gap-2 mt-1">
                                                {s.realizado && <span className="text-[10px] font-bold text-emerald-700 bg-emerald-200 px-2 py-0.5 rounded-full" style={{ fontSize: '10px', background: '#a7f3d0', color: '#047857', padding: '2px 8px', borderRadius: '9999px' }}>REALIZADA</span>}
                                                {isEval && <span className="text-[10px] font-bold text-yellow-600 bg-yellow-200/50 px-2 py-0.5 rounded-full" style={{ fontSize: '10px', background: '#fef08a', color: '#ca8a04', padding: '2px 8px', borderRadius: '9999px' }}>EVALUACIÓN SUMATIVA</span>}
                                                {!isOpen && !isEval && !s.realizado && (
                                                    <span className="text-[11px] text-gray-500 font-medium truncate max-w-[200px] sm:max-w-md lg:max-w-xl">
                                                        {s.objetivoClase || s.contenido || 'Haga clic para ver detalles de la clase...'}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2 items-center no-print-pdf" onClick={(e) => e.stopPropagation()}>
                                        <label className={`flex items-center gap-1 cursor-pointer px-3 py-1.5 rounded-lg border shadow-sm transition ${s.realizado ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-slate-400 hover:bg-green-50 hover:text-green-600 border-slate-200'}`} title={s.realizado ? "Desmarcar" : "Marcar como realizada"}>
                                            <input type="checkbox" checked={s.realizado} onChange={e=>updateSesion(idx,'realizado',e.target.checked)} disabled={readOnly&&!isDocente} className="hidden"/>
                                            <LucideIcon iconName="CheckCircle" size={16} />
                                            <span className="text-[10px] font-bold hidden sm:inline">{s.realizado ? 'LISTA' : 'MARCAR'}</span>
                                        </label>
                                        {!readOnly && (
                                            <div className="flex bg-white rounded-lg border shadow-sm overflow-hidden">
                                                <button onClick={()=>moveSesion(idx,-1)} className="p-2 hover:bg-slate-100 border-r" title="Subir Clase"><LucideIcon iconName="ArrowUp" size={16} className="text-slate-600"/></button>
                                                <button onClick={()=>moveSesion(idx,1)} className="p-2 hover:bg-slate-100 border-r" title="Bajar Clase"><LucideIcon iconName="ArrowDown" size={16} className="text-slate-600"/></button>
                                                <button onClick={()=>{const n=[...planData.sesiones];n.splice(idx,1);setPlanData({...planData,sesiones:n})}} className="p-2 hover:bg-red-50" title="Eliminar Clase"><LucideIcon iconName="Trash2" size={16} className="text-red-500"/></button>
                                            </div>
                                        )}
                                        <div className="text-slate-400 ml-2 bg-white p-1.5 rounded-full shadow-sm border border-slate-200">
                                            {isOpen ? <LucideIcon iconName="ChevronUp" size={20}/> : <LucideIcon iconName="ChevronDown" size={20}/>}
                                        </div>
                                    </div>
                                </div>

                                <div className={`pdf-session-body p-0 ${isOpen ? 'block' : 'hidden print:block'}`}>
                                    
                                    {isEditing ? (
                                        <div className="p-5 space-y-5 animate-fade-in bg-blue-50/30 no-print-pdf">
                                            <div className="flex justify-between items-center border-b pb-2 mb-2">
                                                <h6 className="font-bold text-blue-800 flex items-center gap-2"><LucideIcon iconName="Edit3" size={16}/> {isPIE ? "Sugerencias PIE (DUA)" : "Editando Planificación"}</h6>
                                                <button onClick={() => setEditingSession(null)} className="text-sm font-bold text-gray-500 hover:text-gray-800">Cancelar</button>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 opacity-90">
                                                <div><label className="text-[10px] font-black uppercase text-indigo-700 mb-1 block">Objetivo de Aprendizaje (OA)</label><AutoResizeTextArea className="w-full border rounded p-2 text-xs bg-white shadow-inner focus:border-indigo-500 outline-none" value={s.oa} onChange={e=>updateSesion(idx,'oa',e.target.value)} rows={2} disabled={isPIE}/></div>
                                                <div><label className="text-[10px] font-black uppercase text-teal-700 mb-1 block">Contenido</label><input className="w-full border rounded p-2 text-sm bg-white shadow-inner font-bold focus:border-teal-500 outline-none" value={s.contenido} onChange={e=>updateSesion(idx,'contenido',e.target.value)} disabled={isPIE}/></div>
                                            </div>
                                            
                                            <div className="bg-orange-50/50 p-4 rounded-lg border border-orange-200">
                                                <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                                    <label className="text-[11px] font-black uppercase text-orange-800 flex items-center gap-1"><LucideIcon iconName="Target" size={16}/> Objetivo de la Clase</label>
                                                    {!isPIE && (
                                                        <button type="button" onClick={() => regenerarObjetivos(idx)} className="text-[10px] font-bold bg-white text-orange-700 border border-orange-300 px-3 py-1 rounded-lg hover:bg-orange-600 hover:text-white transition-colors flex items-center gap-1">
                                                            <LucideIcon iconName="RefreshCw" size={12}/> Proponer otro objetivo
                                                        </button>
                                                    )}
                                                </div>
                                                <p className="text-[10px] text-orange-700 mb-2 italic">Estructura: Verbo en infinitivo + Contenido + Condición (cómo o mediante qué) + Finalidad (para qué).</p>
                                                <AutoResizeTextArea className="w-full border rounded p-3 text-sm font-medium text-orange-900 shadow-inner bg-white focus:border-orange-500 outline-none" value={s.objetivoClase || ''} onChange={e=>updateSesion(idx,'objetivoClase',e.target.value)} rows={2} disabled={isPIE}/>
                                                
                                                <label className="text-[11px] font-black uppercase text-slate-700 mb-2 mt-4 flex items-center gap-1"><LucideIcon iconName="Activity" size={16}/> Actividad Central</label>
                                                <AutoResizeTextArea className="w-full border border-slate-300 bg-white shadow-inner focus:border-slate-500 outline-none text-sm p-3 rounded-lg" value={s.actividadCentral || ''} onChange={e=>updateSesion(idx,'actividadCentral',e.target.value)} rows={4} disabled={isPIE}/>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 mt-2 border-t border-slate-200">
                                                    <div><label className="text-[10px] font-black uppercase text-rose-700 mb-1 block">Indicador</label><AutoResizeTextArea className="w-full border rounded p-2 text-xs italic bg-white shadow-inner" value={s.indicador} onChange={e=>updateSesion(idx,'indicador',e.target.value)} rows={2} disabled={isPIE}/></div>
                                                    <div><label className="text-[10px] font-black uppercase text-amber-700 mb-1 block">Instrumento</label><input className="w-full border rounded p-2 text-sm font-bold bg-white shadow-inner uppercase" value={s.instrumento} onChange={e=>updateSesion(idx,'instrumento',e.target.value)} disabled={isPIE}/></div>
                                                </div>
                                            </div>

                                            <div className="border-t border-slate-200 pt-4 mt-2">
                                                <label className="text-[11px] font-black uppercase text-emerald-800 mb-2 flex items-center gap-1"><LucideIcon iconName="Box" size={16}/> Materiales Estándar de la Clase</label>
                                                <AutoResizeTextArea className="w-full border rounded p-2 text-xs bg-white shadow-inner mb-4" value={s.recursosBase || ''} onChange={e=>updateSesion(idx,'recursosBase',e.target.value)} placeholder="Ej: Proyector, guías impresas, plumones..." rows={2} disabled={isPIE}/>

                                                <div className="bg-orange-50 p-4 rounded-lg border border-orange-200">
                                                    <label className="text-[11px] font-black uppercase text-orange-800 mb-2 flex items-center gap-2"><LucideIcon iconName="Bus" size={16}/> Recursos Especiales (Salidas, Entradas, Traslados)</label>
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                        <div className="md:col-span-2">
                                                            <input className="w-full border border-orange-300 rounded p-2 text-sm font-bold text-orange-900 outline-none focus:border-orange-500 bg-white shadow-inner" value={s.recursosEspeciales || ''} onChange={e=>updateSesion(idx,'recursosEspeciales',e.target.value)} placeholder="Ej: Bus para 40 alumnos a museo local..." disabled={isPIE}/>
                                                        </div>
                                                        <div>
                                                            <label className="text-[9px] font-bold text-orange-700 block mb-1 uppercase">Fecha Requerida:</label>
                                                            <input type="date" className="w-full border border-orange-300 rounded p-2 text-sm font-bold text-orange-900 outline-none focus:border-orange-500 bg-white shadow-inner" value={s.fechaRecursos || ''} onChange={e=>updateSesion(idx,'fechaRecursos',e.target.value)} disabled={isPIE}/>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="mt-6 border-t-4 border-pink-200 pt-4 bg-pink-50/50 p-4 rounded-xl">
                                                <h5 className="font-bold text-pink-800 flex items-center gap-2 mb-3"><LucideIcon iconName="HeartHandshake" size={20}/> Estrategias de Inclusión y Diversificación (PIE)</h5>
                                                
                                                <details className="mb-4 bg-white border border-pink-200 rounded-lg overflow-hidden group">
                                                    <summary className="p-3 text-xs font-bold text-pink-700 cursor-pointer flex justify-between items-center bg-pink-100 hover:bg-pink-200">
                                                        <span>📚 RECOMENDACIONES DUA (Decreto 83) - CLIC PARA VER</span>
                                                        <LucideIcon iconName="ChevronDown" size={14} className="group-open:rotate-180 transition-transform"/>
                                                    </summary>
                                                    <div className="p-4 text-xs text-slate-700 space-y-3 bg-white">
                                                        <div className="p-2 bg-pink-50 rounded border-l-2 border-pink-400">
                                                            <div dangerouslySetInnerHTML={{__html: duaSug.p1.replace('PRINCIPIO I', '<strong>PRINCIPIO I</strong>')}} />
                                                        </div>
                                                        <div className="p-2 bg-pink-50 rounded border-l-2 border-pink-400">
                                                            <div dangerouslySetInnerHTML={{__html: duaSug.p2.replace('PRINCIPIO II', '<strong>PRINCIPIO II</strong>')}} />
                                                        </div>
                                                        <div className="p-2 bg-pink-50 rounded border-l-2 border-pink-400">
                                                            <div dangerouslySetInnerHTML={{__html: duaSug.p3.replace('PRINCIPIO III', '<strong>PRINCIPIO III</strong>')}} />
                                                        </div>
                                                        <div className="mt-2 text-[10px] text-gray-500 border-t pt-2">
                                                            <strong>Otros elementos a considerar:</strong> Ajuste de tiempos, tamaño de letra en guías, ubicación estratégica en la sala, uso de audífonos canceladores de ruido.
                                                        </div>
                                                    </div>
                                                </details>

                                                <label className="text-[11px] font-black uppercase text-pink-900 mb-2 block">Sugerencias Metodológicas para esta Clase:</label>
                                                <AutoResizeTextArea 
                                                    className="w-full border-2 border-pink-300 rounded p-3 text-sm bg-white shadow-inner focus:border-pink-500 outline-none" 
                                                    value={s.sugerenciasPIE || ''} 
                                                    onChange={e=>updateSesion(idx,'sugerenciasPIE',e.target.value)} 
                                                    placeholder="Escriba aquí sugerencias específicas para abordar la clase considerando la diversidad del aula..." 
                                                    rows={4} 
                                                    disabled={!isPIE && currentUser.role !== ROLES.ADMIN && currentUser.role !== ROLES.UTP}
                                                />
                                            </div>

                                            <div className="flex justify-end pt-4">
                                                <button onClick={() => setEditingSession(null)} className="bg-green-600 text-white px-8 py-3 rounded-xl text-sm font-bold shadow-lg hover:bg-green-700 flex items-center gap-2">
                                                    <LucideIcon iconName="CheckCircle" size={18}/> Guardar Cambios
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="p-6 flex flex-col h-full bg-white" style={{ padding: '24px' }}>
                                            <div className="flex justify-end mb-4 no-print-pdf gap-2">
                                                <button onClick={() => printSingleClass(idx, s.n)} className="text-[10px] font-bold bg-slate-50 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-600 hover:text-white transition-colors flex items-center gap-1 shadow-sm"><LucideIcon iconName="Printer" size={12}/> IMPRIMIR</button>
                                                {!readOnly && !isPIE && !isEval && (
                                                    <button onClick={() => regenerarObjetivos(idx)} className="text-[10px] font-bold bg-orange-50 text-orange-700 px-3 py-1.5 rounded-lg border border-orange-200 hover:bg-orange-600 hover:text-white transition-colors flex items-center gap-1 shadow-sm" title="Vuelve a redactar solo el objetivo de esta clase">
                                                        <LucideIcon iconName="RefreshCw" size={12}/> NUEVO OBJETIVO
                                                    </button>
                                                )}
                                                {(!readOnly || isPIE) && !isEval && (
                                                    <button onClick={() => setEditingSession(idx)} className="text-[10px] font-bold bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-200 hover:bg-blue-600 hover:text-white transition-colors flex items-center gap-1 shadow-sm">
                                                        <LucideIcon iconName="Edit" size={12}/> {isPIE ? "AGREGAR SUGERENCIA PIE" : "EDITAR"}
                                                    </button>
                                                )}
                                            </div>

                                            <div className="space-y-4 text-slate-700 flex-1">
                                                {s.oa && (
                                                    <div style={{ marginBottom: '8px' }}>
                                                        <span className="text-[10px] font-bold text-gray-400 block mb-1 uppercase tracking-widest border-b border-slate-100 pb-1" style={{ fontSize: '10px', fontWeight: 'bold', color: '#9ca3af', textTransform: 'uppercase', borderBottom: '1px solid #f1f5f9', paddingBottom: '4px' }}>Objetivo de Aprendizaje Base</span>
                                                        <p className="text-xs italic leading-relaxed whitespace-pre-wrap">{s.oa}</p>
                                                    </div>
                                                )}
                                                
                                                <div style={{ marginBottom: '4px' }}>
                                                    <span className="text-[10px] font-bold text-gray-400 block mb-1 uppercase tracking-widest">📚 Contenido Central</span>
                                                    <p className="text-sm font-semibold">{s.contenido}</p>
                                                </div>

                                                {s.objetivoClase && (
                                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 shadow-sm">
                                                        <span className="text-[10px] font-black text-blue-800 block mb-2 uppercase tracking-widest">🎯 Objetivo SMART de la Clase</span>
                                                        <p className="text-sm font-bold leading-snug text-slate-800">{s.objetivoClase}</p>
                                                        {s.objetivoPartes && s.objetivoPartes.texto === s.objetivoClase && (
                                                            <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 no-print-pdf">
                                                                {[
                                                                    ['1. Verbo (acción)', s.objetivoPartes.verbo, 'bg-blue-50 border-blue-200 text-blue-900'],
                                                                    ['2. Contenido (objeto de estudio)', s.objetivoPartes.contenido, 'bg-amber-50 border-amber-200 text-amber-900'],
                                                                    ['3. Condición (cómo o mediante qué)', s.objetivoPartes.condicion, 'bg-teal-50 border-teal-200 text-teal-900'],
                                                                    ['4. Finalidad (para qué)', s.objetivoPartes.finalidad, 'bg-purple-50 border-purple-200 text-purple-900']
                                                                ].map(([titulo, valor, clases]) => (
                                                                    <div key={titulo} className={`border rounded-lg p-2 text-[10px] leading-snug ${clases}`}>
                                                                        <span className="font-black uppercase block mb-0.5">{titulo}</span>{valor}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                        <div className="mt-3 flex flex-wrap gap-2">
                                                            {s.habilidadBloom && (<div className="inline-block bg-indigo-100 text-indigo-800 text-[10px] px-2 py-1 rounded font-bold border border-indigo-200">🧠 Taxonomía: {s.habilidadBloom}</div>)}
                                                            {s.habilidadFoco && (<div className="inline-block bg-teal-100 text-teal-800 text-[10px] px-2 py-1 rounded font-bold border border-teal-200">🎯 Habilidad: {s.habilidadFoco}</div>)}
                                                            {s.contenido && (<div className="inline-block bg-amber-100 text-amber-900 text-[10px] px-2 py-1 rounded font-bold border border-amber-200">📚 Contenido: {s.contenido.substring(0,45)}{s.contenido.length > 45 ? '…' : ''}</div>)}
                                                        </div>
                                                    </div>
                                                )}
                                                
                                                <div className="flex-1 flex flex-col">
                                                    <span className="text-[10px] font-bold text-gray-400 block mb-1 uppercase tracking-widest mt-2">⚙️ Actividad Descriptiva</span>
                                                    <p className="text-xs leading-relaxed text-justify text-slate-600 whitespace-pre-wrap">{s.actividadCentral || <span className="text-gray-300 italic no-print">Sin actividad registrada.</span>}</p>
                                                </div>

                                                {s.actividadEstructura && (
                                                    <div className="mt-4 pt-4 border-t border-slate-100">
                                                        <span className="text-[9px] font-bold uppercase text-slate-400 mb-3 block tracking-widest text-center">Sugerencias Didácticas Complementarias</span>
                                                        <div dangerouslySetInnerHTML={{__html: s.actividadEstructura}} className="text-xs" />

    const CoberturaModule = ({ context, dbData }) => {
        // 1. Determinar las llaves correctas según el tipo de curso (Estándar, Electivo o Mixto)
        let cronogramaKey = '';
        let planKeyPrefix = '';

        if (context.esMixto) {
            // Caso Grupo Mixto (3° y 4° juntos)
            cronogramaKey = `context.asignaturaId-GLOBAL-{context.year}`;
            planKeyPrefix = `cronogramaKey-{context.nombreGrupo}`;
        } else if (context.esElectivo) {
            // Caso Electivo normal
            cronogramaKey = `context.asignaturaId-{context.nivel}-${context.year}`;
            planKeyPrefix = `cronogramaKey-{context.nombreGrupo}`;
        } else {
            // Caso Curso Estándar (Plan Común)
            cronogramaKey = `context.asignaturaId-{context.nivel}-${context.year}`;
            planKeyPrefix = `cronogramaKey-{context.letra}`;
        }

        // 2. Buscar el cronograma base para obtener la estructura de unidades
        const cronograma = (dbData.cronogramas || []).find(c => c.key === cronogramaKey) || { 
            unidades: [1,2,3,4].map(u => ({numero: u, sesiones: 0})) // Fallback si no existe cronograma
        };

        // 3. Calcular cobertura iterando sobre las unidades del cronograma
        const unidadesConCobertura = cronograma.unidades.map(u => {
            // Construir la key específica de la planificación para esta unidad y contexto
            const specificPlanKey = `planKeyPrefix-U{u.numero}`;
            
            // Buscar la planificación real en la base de datos
            const plan = (dbData.planificaciones || []).find(p => p.key === specificPlanKey);

            let totalSesionesPlanificadas = 0;
            let totalSesionesRealizadas = 0;

            if (plan) {
                // Si existe planificación, usamos sus datos reales
                totalSesionesPlanificadas = (plan.sesiones || []).length;
                
                // Contamos las sesiones marcadas como "realizado"
                totalSesionesRealizadas = (plan.sesiones || []).filter(s => s.realizado).length;
            }

            // Definir la base para el porcentaje:
            // Prioridad 1: Lo que el docente planificó realmente.
            // Prioridad 2: Lo que estimó el cronograma (si el docente aún no planifica).
            const baseCalculo = totalSesionesPlanificadas > 0 ? totalSesionesPlanificadas : (u.sesiones || 0);

            // Calcular porcentaje (tope 100%)
            const porcentaje = baseCalculo > 0 ? Math.min(100, Math.round((totalSesionesRealizadas / baseCalculo) * 100)) : 0;

            return {
                numero: u.numero,
                nombre: u.nombre || `Unidad ${u.numero}`,
                sesionesEstimadas: u.sesiones || 0,
                sesionesPlanificadas: totalSesionesPlanificadas,
                sesionesRealizadas: totalSesionesRealizadas,
                porcentaje: porcentaje,
                estadoPlan: plan ? plan.estado : 'No Iniciado'
            };
        });

        // Calculo del promedio total anual
        const promedioAnual = Math.round(unidadesConCobertura.reduce((acc, u) => acc + u.porcentaje, 0) / unidadesConCobertura.length) || 0;

        return (
            <div className="animate-fade-in space-y-6">
                
                {/* TARJETA RESUMEN SUPERIOR */}
                <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-xl p-6 text-white shadow-lg flex justify-between items-center no-print-pdf">
                    <div>

                            Cobertura Curricular: {context.esElectivo ? context.nombreGrupo : `${context.nivel} ${context.letra}`}
                        </h4>
                        <p className="text-slate-400 text-xs mt-1">
                            Calculado sobre sesiones marcadas como "Realizadas" en la planificación.
                        </p>
                    </div>
                    <div className="text-center">
                        <div className="text-3xl font-black text-teal-400">{promedioAnual}%</div>
                        <div className="text-[10px] uppercase font-bold tracking-wider">Avance Anual</div>
                    </div>
                </div>

                {/* VISUALIZACIÓN DE UNIDADES (GRID) */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 no-print-pdf">
                    {unidadesConCobertura.map(u => (
                        <div key={u.numero} className="bg-white border rounded-xl p-4 shadow-sm relative overflow-hidden group hover:border-teal-300 transition-all">
                            <div className="flex justify-between items-start mb-3">
                                <h5 className="font-bold text-slate-700">Unidad {u.numero}</h5>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${u.estadoPlan === 'Aprobado' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                                    {u.estadoPlan}
                                </span>
                            </div>
                            
                            <div className="relative h-3 bg-slate-100 rounded-full overflow-hidden mb-3">
                                <div 
                                    className={`absolute top-0 left-0 h-full transition-all duration-1000 ${u.porcentaje >= 90 ? 'bg-green-500' : u.porcentaje >= 50 ? 'bg-teal-500' : 'bg-orange-500'}`} 
                                    style={{width: `${u.porcentaje}%`}}
                                ></div>
                            </div>

                            <div className="flex justify-between items-end">
                                <div>
                                    <div className="text-2xl font-black text-slate-800">{u.porcentaje}%</div>
                                    <div className="text-[10px] text-slate-400 uppercase font-bold">Cobertura</div>
                                </div>
                                <div className="text-right text-xs text-slate-500">
                                    <div><strong className="text-slate-700">{u.sesionesRealizadas}</strong> realizadas</div>
                                    <div>de <strong>{u.sesionesPlanificadas}</strong> planificadas</div>
                                </div>

                        </div>
                    ))}
                </div>

                {/* VISTA IMPRIMIBLE (TABLA FORMAL) */}

                    {/* Botón de imprimir solo visible en pantalla */}

                            <LucideIcon iconName="Printer" size={16}/> Imprimir Reporte Oficial

                    </div>

                    {/* Encabezado del documento */}
                    <OfficialHeader 
                        user={{name: context.docenteName || 'Docente Responsable'}} 
                        context={context} 
                        docTitle="Reporte Oficial de Cobertura Curricular" 
                        logoUrl={dbData.config.schoolLogo}
                    />
                    
                    <div className="mt-6">
                        <table className="w-full text-sm border-collapse border border-black">
                            <thead className="bg-slate-100 text-black">
                                <tr>
                                    <th className="p-3 border border-black text-center w-16">Unidad</th>
                                    <th className="p-3 border border-black text-left">Estado Planificación</th>

                                    <th className="p-3 border border-black text-center">Sesiones Planificadas</th>
